<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316">
  <!-- 3D 布局示意：TP 留在节点内（NVLink），PP 跨节点（IB，点对点激活），DP 在最外层（梯度 all-reduce） -->
  <text x="10" y="20" font-family="Times New Roman, serif" font-size="13.5" fill="#1f2328">三维布局：TP 在节点内、PP 跨节点、DP 在最外层</text>

  <rect x="24" y="56" width="300" height="126" rx="4" fill="#f6f8fb" stroke="#8b949e" stroke-dasharray="4 3"/>
  <text x="34" y="74" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">节点 0</text>
  <rect x="40" y="88" width="60" height="46" rx="2" fill="#cbdabf" stroke="#7f9b6a"/>
  <text x="52" y="112" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">GPU 0</text>
  <text x="52" y="126" font-family="Times New Roman, serif" font-size="9.5" fill="#5b636b">TP 片 0</text>
  <rect x="108" y="88" width="60" height="46" rx="2" fill="#cbdabf" stroke="#7f9b6a"/>
  <text x="120" y="112" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">GPU 1</text>
  <text x="120" y="126" font-family="Times New Roman, serif" font-size="9.5" fill="#5b636b">TP 片 1</text>
  <rect x="176" y="88" width="60" height="46" rx="2" fill="#cbdabf" stroke="#7f9b6a"/>
  <text x="188" y="112" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">GPU 2</text>
  <text x="188" y="126" font-family="Times New Roman, serif" font-size="9.5" fill="#5b636b">TP 片 2</text>
  <rect x="244" y="88" width="60" height="46" rx="2" fill="#cbdabf" stroke="#7f9b6a"/>
  <text x="256" y="112" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">GPU 3</text>
  <text x="256" y="126" font-family="Times New Roman, serif" font-size="9.5" fill="#5b636b">TP 片 3</text>
  <text x="40" y="156" font-family="Times New Roman, serif" font-size="10" fill="#3f6b2f">节点内 NVLink 1.8 TB/s：放最吃带宽的 TP/EP（≤8 卡）</text>
  <text x="40" y="172" font-family="Times New Roman, serif" font-size="10" fill="#5b636b">PP stage 0 占这整台机器</text>

  <rect x="396" y="56" width="300" height="126" rx="4" fill="#f6f8fb" stroke="#8b949e" stroke-dasharray="4 3"/>
  <text x="406" y="74" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">节点 1</text>
  <rect x="412" y="88" width="60" height="46" rx="2" fill="#cbdabf" stroke="#7f9b6a"/>
  <text x="424" y="112" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">GPU 0</text>
  <text x="424" y="126" font-family="Times New Roman, serif" font-size="9.5" fill="#5b636b">TP 片 0</text>
  <rect x="480" y="88" width="60" height="46" rx="2" fill="#cbdabf" stroke="#7f9b6a"/>
  <text x="492" y="112" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">GPU 1</text>
  <text x="492" y="126" font-family="Times New Roman, serif" font-size="9.5" fill="#5b636b">TP 片 1</text>
  <rect x="548" y="88" width="60" height="46" rx="2" fill="#cbdabf" stroke="#7f9b6a"/>
  <text x="560" y="112" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">GPU 2</text>
  <text x="560" y="126" font-family="Times New Roman, serif" font-size="9.5" fill="#5b636b">TP 片 2</text>
  <rect x="616" y="88" width="60" height="46" rx="2" fill="#cbdabf" stroke="#7f9b6a"/>
  <text x="628" y="112" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">GPU 3</text>
  <text x="628" y="126" font-family="Times New Roman, serif" font-size="9.5" fill="#5b636b">TP 片 3</text>
  <text x="412" y="156" font-family="Times New Roman, serif" font-size="10" fill="#3f6b2f">同一组 TP 的 4 片权重，合起来才是一层</text>
  <text x="412" y="172" font-family="Times New Roman, serif" font-size="10" fill="#5b636b">PP stage 1 占这整台机器</text>

  <line x1="326" y1="112" x2="392" y2="112" stroke="#3b4148" stroke-width="1.4"/>
  <line x1="392" y1="132" x2="326" y2="132" stroke="#3b4148" stroke-width="1.4"/>
  <text x="330" y="100" font-family="Times New Roman, serif" font-size="10" fill="#1f2328">PP：stage 0 → stage 1</text>
  <text x="330" y="152" font-family="Times New Roman, serif" font-size="9.5" fill="#5b636b">bsh 激活</text>
  <text x="330" y="164" font-family="Times New Roman, serif" font-size="9.5" fill="#5b636b">IB 0.05 TB/s</text>

  <path d="M174,52 C174,36 546,36 546,52" fill="none" stroke="#b02020" stroke-width="1.3"/>
  <text x="286" y="34" font-family="Times New Roman, serif" font-size="10.5" fill="#b02020">DP：梯度 all-reduce（2P 或 3P 字节）</text>

  <text x="24" y="212" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">总卡数是各维度的乘积：n_total = n_TP · n_PP · n_DP · n_EP · n_CP；任何一维撞到上限，整体就被卡住。</text>
  <text x="24" y="234" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">选维顺序（lecture_08.pdf 第 57 页）：先 TP/EP 到单机上限（≤8）→ 再 PP 跨机把模型装下（或按带宽改用 ZeRO-3）→</text>
  <text x="24" y="252" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">剩下全部给 DP；batch 不够就用梯度累积换更大的有效 batch。</text>
  <text x="24" y="278" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">真实配置举例（第 72 页）：Llama 3 405B 为 DP128/TP8/EP0/PP16/CP1；Mixtral 8×22B 为 DP2/TP4/EP8/PP4/CP1；</text>
  <text x="24" y="296" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">Qwen3 为 DP?/TP2/EP32/PP8/CP1。规律：TP ≤ 8，EP 可以很大，长上下文阶段用大 CP。</text>
</svg>
