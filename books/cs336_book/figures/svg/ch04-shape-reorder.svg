<svg xmlns="http://www.w3.org/2000/svg" width="800" height="392" viewBox="0 0 800 392">
  <!-- 注意：MuPDF 不解析 <style> 选择器与 marker/dasharray，样式一律内联。 -->
  <text x="10" y="22" font-family="Times New Roman, serif" font-size="13.5" fill="#1f2328">同一个 Q、K、V 的三种写法：中间量从 n×n 降到 d_k×d_v，再到与 T 无关的状态</text>

  <!-- 面板 1 -->
  <rect x="16" y="46" width="240" height="248" rx="3" fill="#fbfcfd" stroke="#c9ccd1" stroke-width="1"/>
  <text x="28" y="70" font-family="Times New Roman, serif" font-size="12.5" fill="#1f2328">① 并行（二次）</text>
  <text x="28" y="90" font-family="Times New Roman, serif" font-size="11.5" fill="#3b4148">A = (Q K^T) V</text>
  <g fill="#eef3fb" stroke="#7d93b2" stroke-width="0.6">
    <rect x="56" y="104" width="14" height="14"/><rect x="70" y="104" width="14" height="14"/><rect x="84" y="104" width="14" height="14"/><rect x="98" y="104" width="14" height="14"/><rect x="112" y="104" width="14" height="14"/><rect x="126" y="104" width="14" height="14"/><rect x="140" y="104" width="14" height="14"/><rect x="154" y="104" width="14" height="14"/><rect x="168" y="104" width="14" height="14"/><rect x="182" y="104" width="14" height="14"/>
    <rect x="56" y="118" width="14" height="14"/><rect x="70" y="118" width="14" height="14"/><rect x="84" y="118" width="14" height="14"/><rect x="98" y="118" width="14" height="14"/><rect x="112" y="118" width="14" height="14"/><rect x="126" y="118" width="14" height="14"/><rect x="140" y="118" width="14" height="14"/><rect x="154" y="118" width="14" height="14"/><rect x="168" y="118" width="14" height="14"/><rect x="182" y="118" width="14" height="14"/>
    <rect x="56" y="132" width="14" height="14"/><rect x="70" y="132" width="14" height="14"/><rect x="84" y="132" width="14" height="14"/><rect x="98" y="132" width="14" height="14"/><rect x="112" y="132" width="14" height="14"/><rect x="126" y="132" width="14" height="14"/><rect x="140" y="132" width="14" height="14"/><rect x="154" y="132" width="14" height="14"/><rect x="168" y="132" width="14" height="14"/><rect x="182" y="132" width="14" height="14"/>
    <rect x="56" y="146" width="14" height="14"/><rect x="70" y="146" width="14" height="14"/><rect x="84" y="146" width="14" height="14"/><rect x="98" y="146" width="14" height="14"/><rect x="112" y="146" width="14" height="14"/><rect x="126" y="146" width="14" height="14"/><rect x="140" y="146" width="14" height="14"/><rect x="154" y="146" width="14" height="14"/><rect x="168" y="146" width="14" height="14"/><rect x="182" y="146" width="14" height="14"/>
    <rect x="56" y="160" width="14" height="14"/><rect x="70" y="160" width="14" height="14"/><rect x="84" y="160" width="14" height="14"/><rect x="98" y="160" width="14" height="14"/><rect x="112" y="160" width="14" height="14"/><rect x="126" y="160" width="14" height="14"/><rect x="140" y="160" width="14" height="14"/><rect x="154" y="160" width="14" height="14"/><rect x="168" y="160" width="14" height="14"/><rect x="182" y="160" width="14" height="14"/>
    <rect x="56" y="174" width="14" height="14"/><rect x="70" y="174" width="14" height="14"/><rect x="84" y="174" width="14" height="14"/><rect x="98" y="174" width="14" height="14"/><rect x="112" y="174" width="14" height="14"/><rect x="126" y="174" width="14" height="14"/><rect x="140" y="174" width="14" height="14"/><rect x="154" y="174" width="14" height="14"/><rect x="168" y="174" width="14" height="14"/><rect x="182" y="174" width="14" height="14"/>
    <rect x="56" y="188" width="14" height="14"/><rect x="70" y="188" width="14" height="14"/><rect x="84" y="188" width="14" height="14"/><rect x="98" y="188" width="14" height="14"/><rect x="112" y="188" width="14" height="14"/><rect x="126" y="188" width="14" height="14"/><rect x="140" y="188" width="14" height="14"/><rect x="154" y="188" width="14" height="14"/><rect x="168" y="188" width="14" height="14"/><rect x="182" y="188" width="14" height="14"/>
    <rect x="56" y="202" width="14" height="14"/><rect x="70" y="202" width="14" height="14"/><rect x="84" y="202" width="14" height="14"/><rect x="98" y="202" width="14" height="14"/><rect x="112" y="202" width="14" height="14"/><rect x="126" y="202" width="14" height="14"/><rect x="140" y="202" width="14" height="14"/><rect x="154" y="202" width="14" height="14"/><rect x="168" y="202" width="14" height="14"/><rect x="182" y="202" width="14" height="14"/>
    <rect x="56" y="216" width="14" height="14"/><rect x="70" y="216" width="14" height="14"/><rect x="84" y="216" width="14" height="14"/><rect x="98" y="216" width="14" height="14"/><rect x="112" y="216" width="14" height="14"/><rect x="126" y="216" width="14" height="14"/><rect x="140" y="216" width="14" height="14"/><rect x="154" y="216" width="14" height="14"/><rect x="168" y="216" width="14" height="14"/><rect x="182" y="216" width="14" height="14"/>
    <rect x="56" y="230" width="14" height="14"/><rect x="70" y="230" width="14" height="14"/><rect x="84" y="230" width="14" height="14"/><rect x="98" y="230" width="14" height="14"/><rect x="112" y="230" width="14" height="14"/><rect x="126" y="230" width="14" height="14"/><rect x="140" y="230" width="14" height="14"/><rect x="154" y="230" width="14" height="14"/><rect x="168" y="230" width="14" height="14"/><rect x="182" y="230" width="14" height="14"/>
  </g>
  <text x="28" y="264" font-family="Times New Roman, serif" font-size="11" fill="#3b4148">中间量：n×n 相似度矩阵</text>
  <text x="28" y="282" font-family="Times New Roman, serif" font-size="11" fill="#5b636b">乘加 n^2·d_k + n^2·d_v</text>

  <!-- 面板 2 -->
  <rect x="272" y="46" width="240" height="248" rx="3" fill="#fbfcfd" stroke="#c9ccd1" stroke-width="1"/>
  <text x="284" y="70" font-family="Times New Roman, serif" font-size="12.5" fill="#1f2328">② 重排（线性）</text>
  <text x="284" y="90" font-family="Times New Roman, serif" font-size="11.5" fill="#3b4148">A = Q (K^T V)</text>
  <g fill="#eef7f0" stroke="#6f9c7c" stroke-width="0.6">
    <rect x="340" y="116" width="18" height="18"/><rect x="358" y="116" width="18" height="18"/><rect x="376" y="116" width="18" height="18"/><rect x="394" y="116" width="18" height="18"/>
    <rect x="340" y="134" width="18" height="18"/><rect x="358" y="134" width="18" height="18"/><rect x="376" y="134" width="18" height="18"/><rect x="394" y="134" width="18" height="18"/>
    <rect x="340" y="152" width="18" height="18"/><rect x="358" y="152" width="18" height="18"/><rect x="376" y="152" width="18" height="18"/><rect x="394" y="152" width="18" height="18"/>
    <rect x="340" y="170" width="18" height="18"/><rect x="358" y="170" width="18" height="18"/><rect x="376" y="170" width="18" height="18"/><rect x="394" y="170" width="18" height="18"/>
  </g>
  <text x="284" y="212" font-family="Times New Roman, serif" font-size="11" fill="#3b4148">中间量：d_k×d_v 状态</text>
  <text x="284" y="230" font-family="Times New Roman, serif" font-size="11" fill="#5b636b">乘加 2·n·d_k·d_v（与 n 线性）</text>
  <text x="284" y="248" font-family="Times New Roman, serif" font-size="11" fill="#5b636b">前提：ρ = id，即去掉 softmax</text>
  <text x="284" y="272" font-family="Times New Roman, serif" font-size="11" fill="#7a5a2e">省下的倍数 = n/d_h</text>

  <!-- 面板 3 -->
  <rect x="528" y="46" width="256" height="248" rx="3" fill="#fbfcfd" stroke="#c9ccd1" stroke-width="1"/>
  <text x="540" y="70" font-family="Times New Roman, serif" font-size="12.5" fill="#1f2328">③ 串行（递推）</text>
  <text x="540" y="90" font-family="Times New Roman, serif" font-size="11.5" fill="#3b4148">S_t = S_(t-1) + k_t v_t^T</text>

  <rect x="540" y="120" width="72" height="38" rx="3" fill="#f4f6f9" stroke="#8b949e" stroke-width="1"/>
  <text x="552" y="144" font-family="Times New Roman, serif" font-size="11.5" fill="#1f2328">S_(t-1)</text>
  <line x1="612" y1="139" x2="644" y2="139" stroke="#3b4148" stroke-width="1.2"/>
  <circle cx="656" cy="139" r="11" fill="#ffffff" stroke="#3b4148" stroke-width="1.2"/>
  <text x="651" y="144" font-family="Times New Roman, serif" font-size="13" fill="#1f2328">+</text>
  <line x1="667" y1="139" x2="692" y2="139" stroke="#3b4148" stroke-width="1.2"/>
  <rect x="694" y="120" width="66" height="38" rx="3" fill="#eef3fb" stroke="#7d93b2" stroke-width="1"/>
  <text x="704" y="144" font-family="Times New Roman, serif" font-size="11.5" fill="#1f2328">S_t</text>
  <line x1="656" y1="112" x2="656" y2="127" stroke="#9a6a2f" stroke-width="1.2"/>
  <text x="596" y="108" font-family="Times New Roman, serif" font-size="10.5" fill="#7a5a2e">k_t·v_t^T 写入</text>

  <text x="540" y="186" font-family="Times New Roman, serif" font-size="11" fill="#3b4148">状态：d_k×d_v，与 T 无关</text>
  <text x="540" y="204" font-family="Times New Roman, serif" font-size="11" fill="#5b636b">每步乘加 d_k×d_v</text>
  <text x="540" y="222" font-family="Times New Roman, serif" font-size="11" fill="#5b636b">y_t = q_t^T·S_t</text>
  <text x="540" y="248" font-family="Times New Roman, serif" font-size="10.5" fill="#7a5a2e">加门控 γ_t 即 RetNet / Mamba-2</text>
  <text x="540" y="264" font-family="Times New Roman, serif" font-size="10.5" fill="#7a5a2e">再加 (I-βkk^T) 即 Gated DeltaNet</text>

  <!-- 底部结论 -->
  <line x1="16" y1="308" x2="784" y2="308" stroke="#c9ccd1" stroke-width="0.8"/>
  <text x="16" y="328" font-family="Times New Roman, serif" font-size="11.5" fill="#1f2328">比值 n^2(d_k+d_v) / (2·n·d_k·d_v) = n/d_h：n=32768、d_h=128 时 256×；收益只与上下文长度和头维有关，与模型宽度无关。</text>
  <text x="16" y="348" font-family="Times New Roman, serif" font-size="11.5" fill="#1f2328">递推状态与 KV cache 的元素数之比 = 2T/d_h：T=32768、d_h=128 时 512×；但状态只有固定容量，丢了 n×n 的精确寻址。</text>
  <text x="16" y="374" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">依据 lecture_04.pdf p4–p5 的公式与 lecture_03.pdf p58 的强度算法重绘；倍数与元素数为本书按同一计数补算（教材补全）。</text>
</svg>
