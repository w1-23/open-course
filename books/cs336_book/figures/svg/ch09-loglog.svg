<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <!-- 幂律在 log-log 上是一条直线：斜率 = −α，截距受不可约损失 C 与常数项影响。示意图，不含具体数值刻度。 -->
  <text x="10" y="20" font-family="Times New Roman, serif" font-size="13.5" fill="#1f2328">幂律的两种读法：斜率是指数，竖直平移是常数项</text>

  <line x1="80" y1="60" x2="80" y2="272" stroke="#3b4148" stroke-width="1.2"/>
  <line x1="80" y1="272" x2="662" y2="272" stroke="#3b4148" stroke-width="1.2"/>
  <text x="600" y="292" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">log D（token 数）</text>
  <text x="24" y="70" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">log L</text>

  <line x1="96" y1="96" x2="620" y2="196" stroke="#33414f" stroke-width="1.8"/>
  <text x="470" y="188" font-family="Times New Roman, serif" font-size="10.5" fill="#33414f">斜率 −α（数据项）</text>

  <line x1="96" y1="140" x2="620" y2="206" stroke="#6b8aa6" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="470" y="220" font-family="Times New Roman, serif" font-size="10.5" fill="#6b8aa6">同形式、更小的 α</text>

  <line x1="96" y1="176" x2="620" y2="212" stroke="#9aabbb" stroke-width="1.8" stroke-dasharray="3 4"/>
  <text x="470" y="240" font-family="Times New Roman, serif" font-size="10.5" fill="#9aabbb">更小的 α（更慢的下降）</text>

  <line x1="80" y1="252" x2="662" y2="252" stroke="#b02020" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="96" y="266" font-family="Times New Roman, serif" font-size="10.5" fill="#b02020">不可约损失 C：竖直方向的平移量，不是斜率</text>

  <line x1="330" y1="60" x2="330" y2="272" stroke="#c9ccd1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="240" y="80" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">拟合区（实测点）</text>
  <text x="350" y="80" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">外推区（不可验证）</text>

  <text x="80" y="316" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">形式 L(D) = A·D^(−α) + C。当 C 可忽略时，两边取对数得 log L = log A − α log D，</text>
  <text x="80" y="332" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">所以斜率直接读出指数；换对数底只改变截距，不改变斜率。</text>
</svg>
