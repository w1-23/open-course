<svg xmlns="http://www.w3.org/2000/svg" width="780" height="404" viewBox="0 0 780 404">
  <!-- MuPDF 不解析 <style>/marker/dasharray，样式一律内联。 -->
  <text x="10" y="22" font-family="Times New Roman, serif" font-size="13.5" fill="#1f2328">GEMM 分块：C 的第 (i, j) 个 tile 只依赖 A 的第 i 个行块与 B 的第 j 个列块</text>

  <!-- A -->
  <text x="30" y="72" font-family="Times New Roman, serif" font-size="11.5" fill="#1f2328">A：M×K（按行分块）</text>
  <g fill="#f4f6f9" stroke="#8b949e" stroke-width="0.8">
    <rect x="30" y="80" width="30" height="30"/><rect x="60" y="80" width="30" height="30"/>
    <rect x="30" y="110" width="30" height="30"/><rect x="60" y="110" width="30" height="30"/>
    <rect x="30" y="140" width="30" height="30"/><rect x="60" y="140" width="30" height="30"/>
    <rect x="30" y="170" width="30" height="30"/><rect x="60" y="170" width="30" height="30"/>
  </g>
  <g fill="#dce8f7" stroke="#5b7fa6" stroke-width="1">
    <rect x="30" y="110" width="30" height="30"/><rect x="60" y="110" width="30" height="30"/>
  </g>
  <text x="30" y="216" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">行块 i = 1</text>

  <!-- B -->
  <text x="170" y="72" font-family="Times New Roman, serif" font-size="11.5" fill="#1f2328">B：K×N（按列分块）</text>
  <g fill="#f4f6f9" stroke="#8b949e" stroke-width="0.8">
    <rect x="170" y="80" width="30" height="30"/><rect x="200" y="80" width="30" height="30"/><rect x="230" y="80" width="30" height="30"/><rect x="260" y="80" width="30" height="30"/>
    <rect x="170" y="110" width="30" height="30"/><rect x="200" y="110" width="30" height="30"/><rect x="230" y="110" width="30" height="30"/><rect x="260" y="110" width="30" height="30"/>
  </g>
  <g fill="#e6f0e9" stroke="#6f9c7c" stroke-width="1">
    <rect x="200" y="80" width="30" height="30"/><rect x="200" y="110" width="30" height="30"/>
  </g>
  <text x="170" y="160" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">列块 j = 1</text>

  <!-- C -->
  <text x="320" y="72" font-family="Times New Roman, serif" font-size="11.5" fill="#1f2328">C：M×N（每个 tile 一个 block）</text>
  <g fill="#f4f6f9" stroke="#8b949e" stroke-width="0.8">
    <rect x="320" y="80" width="30" height="30"/><rect x="350" y="80" width="30" height="30"/><rect x="380" y="80" width="30" height="30"/><rect x="410" y="80" width="30" height="30"/>
    <rect x="320" y="110" width="30" height="30"/><rect x="350" y="110" width="30" height="30"/><rect x="380" y="110" width="30" height="30"/><rect x="410" y="110" width="30" height="30"/>
    <rect x="320" y="140" width="30" height="30"/><rect x="350" y="140" width="30" height="30"/><rect x="380" y="140" width="30" height="30"/><rect x="410" y="140" width="30" height="30"/>
    <rect x="320" y="170" width="30" height="30"/><rect x="350" y="170" width="30" height="30"/><rect x="380" y="170" width="30" height="30"/><rect x="410" y="170" width="30" height="30"/>
  </g>
  <rect x="350" y="110" width="30" height="30" rx="2" fill="#dce8f7" stroke="#2f5b88" stroke-width="1.6"/>
  <text x="320" y="216" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">tile (i, j) = (1, 1)：acc 在寄存器里累加</text>

  <!-- 循环框 -->
  <rect x="500" y="62" width="262" height="158" rx="3" fill="#fbfcfd" stroke="#c9ccd1" stroke-width="1"/>
  <text x="512" y="84" font-family="Times New Roman, serif" font-size="11.5" fill="#1f2328">一个 block 做的事</text>
  <text x="512" y="106" font-family="Times New Roman, serif" font-size="10.5" fill="#3b4148">for k in range(0, K, BLOCK_K):</text>
  <text x="522" y="124" font-family="Times New Roman, serif" font-size="10.5" fill="#3b4148">load A[i, k] → 共享内存</text>
  <text x="522" y="142" font-family="Times New Roman, serif" font-size="10.5" fill="#3b4148">load B[k, j] → 共享内存</text>
  <text x="522" y="160" font-family="Times New Roman, serif" font-size="10.5" fill="#3b4148">acc += dot(a, b)</text>
  <text x="522" y="178" font-family="Times New Roman, serif" font-size="10.5" fill="#3b4148">指针 += BLOCK_K × stride</text>
  <text x="512" y="200" font-family="Times New Roman, serif" font-size="10.5" fill="#7a5a2e">ReLU 融在写回之前，不碰 HBM</text>

  <!-- 账目 -->
  <line x1="30" y1="232" x2="762" y2="232" stroke="#c9ccd1" stroke-width="0.8"/>
  <text x="30" y="252" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">全局读次数：朴素 = M×K×N；分块 = (M/B_M)(N/B_N)(B_M+B_N)K</text>
  <text x="30" y="274" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">B_M = B_N = 64 时（M=N=K=1024）：1.07×10⁹ → 3.36×10⁷ 个元素，约 32 倍</text>
  <text x="30" y="296" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">强度：朴素 0.25 FLOP/byte；分块 ≈ B_M·B_N / (2(B_M+B_N)) = 16（64 块）/ 32（128 块）</text>

  <text x="30" y="330" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">索引写法：a_ptrs 是 [BLOCK_M, BLOCK_K] 的二维指针块，b_ptrs 是 [BLOCK_K, BLOCK_N]，</text>
  <text x="30" y="348" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">一次 tl.load 就把一个 tile 搬进共享内存——这是 Triton 把"分块"变成一行代码的地方。</text>

  <line x1="30" y1="366" x2="762" y2="366" stroke="#c9ccd1" stroke-width="0.8"/>
  <text x="30" y="388" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">依据 lecture_06.py 第 539–583 行的三种做法与第 636–675 行的 kernel 重绘；32 倍与强度为本书按同一计数公式补算（教材补全）。</text>
</svg>
