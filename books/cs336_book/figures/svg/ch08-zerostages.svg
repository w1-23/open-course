<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330">
  <!-- ZeRO 各级的显存与可装参数：数值取自 lecture_08.pdf 第 28 页（8×A100 80G，混合精度 12 bytes/param 基准） -->
  <text x="10" y="20" font-family="Times New Roman, serif" font-size="13.5" fill="#1f2328">ZeRO 三级的两个视角：每参数显存（左）与同一集群能装下的参数量（右）</text>

  <text x="30" y="52" font-family="Times New Roman, serif" font-size="11.5" fill="#1f2328">每参数显存（字节）</text>
  <text x="400" y="52" font-family="Times New Roman, serif" font-size="11.5" fill="#1f2328">8×A100 80G 可装参数（十亿）</text>

  <text x="30" y="86" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">Baseline</text>
  <rect x="100" y="72" width="108" height="20" rx="2" fill="#c9ccd1"/>
  <text x="216" y="86" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">12</text>

  <text x="30" y="126" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">ZeRO-1</text>
  <rect x="100" y="112" width="45" height="20" rx="2" fill="#8fa6bd"/>
  <text x="153" y="126" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">5</text>

  <text x="30" y="166" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">ZeRO-2</text>
  <rect x="100" y="152" width="29" height="20" rx="2" fill="#6b8aa6"/>
  <text x="137" y="166" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">≈3.25（2+10/8）</text>

  <text x="30" y="206" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">ZeRO-3</text>
  <rect x="100" y="192" width="14" height="20" rx="2" fill="#3f5f7d"/>
  <text x="122" y="206" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">1.5（12/8）</text>

  <text x="400" y="86" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">Baseline</text>
  <rect x="470" y="72" width="14" height="20" rx="2" fill="#c9ccd1"/>
  <text x="492" y="86" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">6.66</text>

  <text x="400" y="126" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">ZeRO-1</text>
  <rect x="470" y="112" width="34" height="20" rx="2" fill="#8fa6bd"/>
  <text x="512" y="126" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">16</text>

  <text x="400" y="166" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">ZeRO-2</text>
  <rect x="470" y="152" width="52" height="20" rx="2" fill="#6b8aa6"/>
  <text x="530" y="166" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">24.62</text>

  <text x="400" y="206" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">ZeRO-3</text>
  <rect x="470" y="192" width="112" height="20" rx="2" fill="#3f5f7d"/>
  <text x="590" y="206" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">53.33</text>

  <line x1="30" y1="238" x2="690" y2="238" stroke="#c9ccd1" stroke-width="1"/>
  <text x="30" y="262" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">通信量对照（第 21、27 页）：朴素 DDP 2·#参数；ZeRO-1、ZeRO-2 仍是 2·#参数；ZeRO-3 为 3·#参数（1.5 倍）。</text>
  <text x="30" y="284" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">左图的 3.25 与 1.5 由课程表里的 (4+K/N_gpu) 与 12/8 两种记法给出；右图是同一张表的最大参数量一列。</text>
  <text x="30" y="306" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">注意 ZeRO-1/2 的显存增益来自优化器状态与梯度，参数仍是每卡一份；只有 ZeRO-3 让"能装的模型"线性变大。</text>
</svg>
