<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300">
  <!-- MuPDF 的 SVG 渲染不解析 <style> 选择器，所有样式必须写成内联属性。 -->
  <text x="16" y="24" font-family="Times New Roman, serif" font-size="13.5" fill="#1f2328">数据流水线四步：每一步修一种特定的失效模式，也各有各的代价</text>

  <text x="18" y="86" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">原始语料</text>
  <text x="18" y="102" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">HTML / PDF / 仓库</text>
  <text x="510" y="86" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">训练分布</text>
  <text x="510" y="102" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">≈ 模型真正看到的东西</text>

  <!-- 四个步骤框 -->
  <rect x="18" y="112" width="136" height="88" rx="3" fill="#f4f6f9" stroke="#8b949e" stroke-width="1"/>
  <text x="30" y="136" font-family="Times New Roman, serif" font-size="12.5" fill="#1f2328">转写</text>
  <text x="30" y="158" font-family="Times New Roman, serif" font-size="10" fill="#3b4148">去样板 + 抽正文</text>
  <text x="30" y="174" font-family="Times New Roman, serif" font-size="10" fill="#3b4148">PDF 需 OCR</text>
  <text x="30" y="192" font-family="Times New Roman, serif" font-size="10" fill="#5b636b">代价：有损</text>

  <line x1="154" y1="156" x2="170" y2="156" stroke="#3b4148" stroke-width="1.2"/>
  <polygon points="178,156 167,151.5 167,160.5" fill="#3b4148"/>

  <rect x="182" y="112" width="136" height="88" rx="3" fill="#eef3fb" stroke="#7d93b2" stroke-width="1"/>
  <text x="194" y="136" font-family="Times New Roman, serif" font-size="12.5" fill="#1f2328">过滤</text>
  <text x="194" y="158" font-family="Times New Roman, serif" font-size="10" fill="#3b4148">target 打分器取舍</text>
  <text x="194" y="174" font-family="Times New Roman, serif" font-size="10" fill="#3b4148">语种 / 质量 / 毒性</text>
  <text x="194" y="192" font-family="Times New Roman, serif" font-size="10" fill="#5b636b">代价：阈值随预算移</text>

  <line x1="318" y1="156" x2="334" y2="156" stroke="#3b4148" stroke-width="1.2"/>
  <polygon points="342,156 331,151.5 331,160.5" fill="#3b4148"/>

  <rect x="346" y="112" width="136" height="88" rx="3" fill="#f4f6f9" stroke="#8b949e" stroke-width="1"/>
  <text x="358" y="136" font-family="Times New Roman, serif" font-size="12.5" fill="#1f2328">去重</text>
  <text x="358" y="158" font-family="Times New Roman, serif" font-size="10" fill="#3b4148">哈希 + Jaccard</text>
  <text x="358" y="174" font-family="Times New Roman, serif" font-size="10" fill="#3b4148">MinHash + LSH</text>
  <text x="358" y="192" font-family="Times New Roman, serif" font-size="10" fill="#5b636b">代价：两两比较</text>

  <line x1="482" y1="156" x2="498" y2="156" stroke="#3b4148" stroke-width="1.2"/>
  <polygon points="506,156 495,151.5 495,160.5" fill="#3b4148"/>

  <rect x="510" y="112" width="136" height="88" rx="3" fill="#eef3fb" stroke="#7d93b2" stroke-width="1"/>
  <text x="522" y="136" font-family="Times New Roman, serif" font-size="12.5" fill="#1f2328">配比</text>
  <text x="522" y="158" font-family="Times New Roman, serif" font-size="10" fill="#3b4148">小规模回归搜权重</text>
  <text x="522" y="174" font-family="Times New Roman, serif" font-size="10" fill="#3b4148">epoch 硬上限</text>
  <text x="522" y="192" font-family="Times New Roman, serif" font-size="10" fill="#5b636b">代价：尺度迁移假设</text>

  <line x1="16" y1="222" x2="644" y2="222" stroke="#c9ccd1" stroke-width="0.8"/>
  <text x="16" y="242" font-family="Times New Roman, serif" font-size="10.5" fill="#3b4148">共同骨架：定义「好数据长什么样」（target）→ 写一个能跑在全量原始数据上的打分函数 → 按分数取舍。</text>
  <text x="16" y="264" font-family="Times New Roman, serif" font-size="9.5" fill="#5b636b">依据 lecture_14.py 第 18–19 行（四步划分）、第 62 / 71–72 行（过滤框架）、</text>
  <text x="16" y="282" font-family="Times New Roman, serif" font-size="9.5" fill="#5b636b">第 164–170 行（去重三问与线性时间要求）、第 339–348 行（配比的问法与三种基线）的重绘。</text>
</svg>
