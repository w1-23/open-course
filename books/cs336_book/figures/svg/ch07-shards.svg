<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430">
  <!-- 三种切法示意：DP 切 batch、TP 切宽度、PP 切深度。全部内联属性。 -->
  <text x="10" y="20" font-family="Times New Roman, serif" font-size="13.5" fill="#1f2328">三种切法：切的维度不同，通信的东西也不同</text>

  <!-- DP -->
  <text x="10" y="45" font-family="Times New Roman, serif" font-size="12" fill="#1f2328">DP：切 batch —— 每卡持完整参数，只同步梯度</text>
  <rect x="24" y="56" width="120" height="26" rx="2" fill="#dfe7f2" stroke="#7d93b2"/>
  <text x="44" y="74" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">batch 切片 0</text>
  <rect x="168" y="56" width="120" height="26" rx="2" fill="#dfe7f2" stroke="#7d93b2"/>
  <text x="188" y="74" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">batch 切片 1</text>
  <rect x="312" y="56" width="120" height="26" rx="2" fill="#dfe7f2" stroke="#7d93b2"/>
  <text x="332" y="74" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">batch 切片 2</text>
  <rect x="456" y="56" width="120" height="26" rx="2" fill="#dfe7f2" stroke="#7d93b2"/>
  <text x="476" y="74" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">batch 切片 3</text>

  <rect x="24" y="92" width="120" height="24" rx="2" fill="#f4f6f9" stroke="#8b949e"/>
  <text x="60" y="108" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">W（完整）</text>
  <rect x="168" y="92" width="120" height="24" rx="2" fill="#f4f6f9" stroke="#8b949e"/>
  <text x="204" y="108" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">W（完整）</text>
  <rect x="312" y="92" width="120" height="24" rx="2" fill="#f4f6f9" stroke="#8b949e"/>
  <text x="348" y="108" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">W（完整）</text>
  <rect x="456" y="92" width="120" height="24" rx="2" fill="#f4f6f9" stroke="#8b949e"/>
  <text x="492" y="108" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">W（完整）</text>

  <line x1="144" y1="104" x2="166" y2="104" stroke="#b02020" stroke-width="1.2"/>
  <line x1="288" y1="104" x2="310" y2="104" stroke="#b02020" stroke-width="1.2"/>
  <line x1="432" y1="104" x2="454" y2="104" stroke="#b02020" stroke-width="1.2"/>
  <text x="580" y="104" font-family="Times New Roman, serif" font-size="10.5" fill="#b02020">all-reduce 梯度</text>
  <text x="580" y="119" font-family="Times New Roman, serif" font-size="10" fill="#5b636b">每次 2·#参数</text>

  <!-- TP -->
  <text x="10" y="160" font-family="Times New Roman, serif" font-size="12" fill="#1f2328">TP：切宽度 —— 每卡持权重的一部分切片，激活靠 all-gather 拼回</text>
  <rect x="24" y="170" width="552" height="22" rx="2" fill="#eef3e9" stroke="#7f9b6a"/>
  <text x="200" y="186" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">X（batch × d，每卡都持全量，图中 d 方向被切成 4 段）</text>
  <rect x="24" y="200" width="138" height="46" rx="2" fill="#dce7d2" stroke="#7f9b6a"/>
  <text x="70" y="228" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">W₁</text>
  <rect x="162" y="200" width="138" height="46" rx="2" fill="#cbdabf" stroke="#7f9b6a"/>
  <text x="208" y="228" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">W₂</text>
  <rect x="300" y="200" width="138" height="46" rx="2" fill="#bccfb0" stroke="#7f9b6a"/>
  <text x="346" y="228" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">W₃</text>
  <rect x="438" y="200" width="138" height="46" rx="2" fill="#adc2a1" stroke="#7f9b6a"/>
  <text x="484" y="228" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">W₄</text>
  <text x="24" y="262" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">每卡只存 d/4 输出维；每层前后向各 2 次 all-reduce，通信量 ≈ 8bsh per layer</text>
  <text x="600" y="216" font-family="Times New Roman, serif" font-size="10.5" fill="#b02020">要求 NVLink 级带宽</text>

  <!-- PP -->
  <text x="10" y="292" font-family="Times New Roman, serif" font-size="12" fill="#1f2328">PP：切深度 —— 每卡持若干层，激活按 stage 点对点传递</text>
  <rect x="24" y="304" width="128" height="60" rx="2" fill="#f6ece0" stroke="#b08a62"/>
  <text x="40" y="330" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">stage 0</text>
  <text x="40" y="346" font-family="Times New Roman, serif" font-size="10" fill="#5b636b">层 0–L/4</text>
  <rect x="166" y="304" width="128" height="60" rx="2" fill="#f0e3d2" stroke="#b08a62"/>
  <text x="182" y="330" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">stage 1</text>
  <text x="182" y="346" font-family="Times New Roman, serif" font-size="10" fill="#5b636b">层 L/4–L/2</text>
  <rect x="308" y="304" width="128" height="60" rx="2" fill="#e9d9c4" stroke="#b08a62"/>
  <text x="324" y="330" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">stage 2</text>
  <text x="324" y="346" font-family="Times New Roman, serif" font-size="10" fill="#5b636b">层 L/2–3L/4</text>
  <rect x="450" y="304" width="128" height="60" rx="2" fill="#e2cfb6" stroke="#b08a62"/>
  <text x="466" y="330" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">stage 3</text>
  <text x="466" y="346" font-family="Times New Roman, serif" font-size="10" fill="#5b636b">层 3L/4–L</text>
  <line x1="152" y1="334" x2="164" y2="334" stroke="#3b4148" stroke-width="1.2"/>
  <line x1="294" y1="334" x2="306" y2="334" stroke="#3b4148" stroke-width="1.2"/>
  <line x1="436" y1="334" x2="448" y2="334" stroke="#3b4148" stroke-width="1.2"/>
  <text x="596" y="330" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">每 micro-batch</text>
  <text x="596" y="345" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">只传 bsh 激活</text>
  <text x="10" y="392" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">三种切法的代码见 lecture_07.py 的 data_parallelism_main（第 397 行）、tensor_parallelism_main（第 447 行）、</text>
  <text x="10" y="408" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">pipeline_parallelism_main（第 492 行）；通信量表达式取自 lecture_08.pdf 第 43 页。</text>
</svg>
