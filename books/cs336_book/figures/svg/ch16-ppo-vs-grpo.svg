<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <!-- 注意：MuPDF 的 SVG 渲染不解析 <style> 选择器，所有样式必须写成内联属性。 -->
  <defs>
    <marker id="a16b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#3b4148"/>
    </marker>
  </defs>

  <text x="10" y="20" font-family="Times New Roman, serif" font-size="13.5" fill="#1f2328">同一个损失骨架，两种优势：PPO 的 A_t 逐 token，GRPO 的 A_i 逐序列</text>

  <!-- 左：PPO -->
  <text x="14" y="46" font-family="Times New Roman, serif" font-size="12.5" fill="#1f2328">PPO（p15）</text>
  <rect x="14" y="56" width="336" height="126" rx="3" fill="#ffffff" stroke="#c9ccd1" stroke-width="0.9"/>

  <rect x="26" y="70" width="96" height="34" rx="3" fill="#f4f6f9" stroke="#8b949e" stroke-width="1"/>
  <text x="34" y="91" font-family="Times New Roman, serif" font-size="11" fill="#1f2328">价值网络 V_φ</text>
  <line x1="122" y1="87" x2="146" y2="87" stroke="#3b4148" stroke-width="1.1" marker-end="url(#a16b)"/>

  <text x="152" y="78" font-family="Times New Roman, serif" font-size="10.5" fill="#3b4148">A_t = R − V_φ(s_t)</text>
  <text x="152" y="93" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">γ = λ = 1（bandit）</text>

  <g>
    <rect x="30" y="124" width="30" height="26" fill="#eef3fb" stroke="#7d93b2" stroke-width="1"/>
    <rect x="62" y="124" width="30" height="26" fill="#eef3fb" stroke="#7d93b2" stroke-width="1"/>
    <rect x="94" y="124" width="30" height="26" fill="#eef3fb" stroke="#7d93b2" stroke-width="1"/>
    <rect x="126" y="124" width="30" height="26" fill="#eef3fb" stroke="#7d93b2" stroke-width="1"/>
    <rect x="158" y="124" width="30" height="26" fill="#eef3fb" stroke="#7d93b2" stroke-width="1"/>
    <text x="36" y="142" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">A₁</text>
    <text x="68" y="142" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">A₂</text>
    <text x="100" y="142" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">A₃</text>
    <text x="132" y="142" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">A₄</text>
    <text x="164" y="142" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">A_T</text>
  </g>
  <text x="30" y="168" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">优势随位置变化：需要价值头（与策略同规模量级），显存翻倍</text>

  <!-- 右：GRPO -->
  <text x="376" y="46" font-family="Times New Roman, serif" font-size="12.5" fill="#1f2328">GRPO（p18、p20）</text>
  <rect x="376" y="56" width="370" height="126" rx="3" fill="#ffffff" stroke="#c9ccd1" stroke-width="0.9"/>

  <text x="388" y="74" font-family="Times New Roman, serif" font-size="10.5" fill="#3b4148">A_i = (r_i − mean) / (std + 1e-4)，无价值网络</text>

  <g>
    <rect x="390" y="88" width="62" height="20" fill="#f7f0e8" stroke="#b08a5a" stroke-width="1"/>
    <rect x="390" y="112" width="62" height="20" fill="#f7f0e8" stroke="#b08a5a" stroke-width="1"/>
    <rect x="390" y="136" width="62" height="20" fill="#f7f0e8" stroke="#b08a5a" stroke-width="1"/>
    <text x="396" y="102" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">o₁ → A₁</text>
    <text x="396" y="126" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">o₂ → A₂</text>
    <text x="396" y="150" font-family="Times New Roman, serif" font-size="10.5" fill="#1f2328">o_G → A_G</text>
  </g>

  <text x="466" y="102" font-family="Times New Roman, serif" font-size="10.5" fill="#3b4148">A_i 在整条序列上是同一个数</text>
  <text x="466" y="126" font-family="Times New Roman, serif" font-size="10.5" fill="#8a4b2a">std 除法破坏无偏性（p23）</text>
  <text x="466" y="150" font-family="Times New Roman, serif" font-size="10.5" fill="#8a4b2a">长度归一化带来长度偏置（p24）</text>
  <text x="466" y="172" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">G 条共享一个 prompt，必须成组采</text>

  <!-- 底部说明 -->
  <line x1="14" y1="198" x2="748" y2="198" stroke="#c9ccd1" stroke-width="0.8"/>
  <text x="14" y="220" font-family="Times New Roman, serif" font-size="11.5" fill="#1f2328">共享的部分：</text>
  <text x="112" y="220" font-family="Times New Roman, serif" font-size="11" fill="#3b4148">min(ρA, clip(ρ, 1−ε, 1+ε)A)，ρ = π_θ / π_old，ε = 0.2（p12）</text>
  <text x="14" y="242" font-family="Times New Roman, serif" font-size="11.5" fill="#1f2328">不同的部分：</text>
  <text x="112" y="242" font-family="Times New Roman, serif" font-size="11" fill="#3b4148">A 的维度（逐 token vs 逐序列）、A 的来源（学出来的 V_φ vs 组内统计）、额外参数量（有 vs 无）</text>
  <text x="14" y="264" font-family="Times New Roman, serif" font-size="11" fill="#3b4148">结论：两者只能写成两个式子。压成同一个公式会抹掉上面"不同的部分"，并让人误以为 GRPO 也要价值网络。</text>
  <text x="14" y="286" font-family="Times New Roman, serif" font-size="10.5" fill="#5b636b">依据 lecture_16.pdf p12、p15、p18、p20、p23、p24 重绘。</text>
</svg>
