    Falcon 3, Qwen 3.5, etc): next lecture!'
- source_id: CS336-2026-L03-PDF
  locator: pdf:p58
  url: https://github.com/stanford-cs336/lectures/blob/main/lecture_03.pdf
  quote: GQA/MQA – Reducing attention head cost / Let’s think about the compute involved for attention
    / Total arithmetric operations (𝑏𝑛𝑑2), total memory accesses (𝑏𝑛𝑑+ 𝑏ℎ𝑛2 + 𝑑2) / Arithmetic intensity
    (compute/memory) is high 𝑂 / 1 / 𝑘+ / 1 / 𝑏𝑛 / −1 / - we can keep our GPUs running / X / softmax /
    projection / d = hidden dim / b = batch / n = length (<d) / h = heads / k = head dim (d/h)
- source_id: CS336-2026-L03-PDF
  locator: pdf:p59
  url: https://github.com/stanford-cs336/lectures/blob/main/lecture_03.pdf
  quote: 'GQA/MQA – Reducing attention head cost / What about the incremental case when we generate text?
    / Key difference: can’t parallelize the generation process – needs to be step by step / In this case
    – we need to incrementally re-compute/update attention via the ‘KV cache’ / [Animation from https://medium.com/@joaolages/kv-caching-explained-276520203249]'
