  quote: GQA/MQA – Reducing attention head cost / What’s the incremental arithmetic intensity? / Total
    arithmetric operations (𝑏𝑛𝑑2), total memory accesses (𝑏𝑛2𝑑+ 𝑛𝑑2) / Arithmetic intensity is not good
    𝑂 / 𝑛 / 𝑑+ / 1 / 𝑏 / −1 / - need large batches + short seq length / (n) or big model dimensions (d)
    / K, V / projection / Is there some way around this? The n/d term is difficult to reduce.
