  url: https://github.com/stanford-cs336/lectures/blob/main/lecture_03.pdf
  quote: 'LayerNorm vs RMSNorm / Original transformer: LayerNorm – normalizes / the mean and variance
    across 𝑑𝑚𝑜𝑑𝑒𝑙 / Many modern LMs: RMSNorm – does not / subtract mean or add a bias term / 𝑦= / 𝑥 /
    𝑥 / 2 / 2 + 𝜀 / ∗𝛾 / Notable models: / GPT3/2/1, OPT, GPT-J, BLOOM / Notable models: / LLaMA-family,
    PaLM, Chinchilla, T5'
- source_id: CS336-2026-L03-PDF
  locator: pdf:p15
  url: https://github.com/stanford-cs336/lectures/blob/main/lecture_03.pdf
  quote: Why RMSNorm? / Modern explanation – it’s faster (and just as good). / • / Fewer operations (no
    mean calculation) / • / Fewer parameters (no bias term to store) / Does this explanation make sense?
    / Matrix multiplies are the vast majority of FLOPs (and memory) / [Ivanov et al 2023]
- source_id: CS336-2026-L03-PDF
  locator: pdf:p16
  url: https://github.com/stanford-cs336/lectures/blob/main/lecture_03.pdf
  quote: 'Why RMSNorm (2) / Important lesson: FLOPS are not runtime! (we will discuss this in far more
    detail later) / [Ivanov et al 2023] / Left top (”43G”) is FLOPS / Right top (“153”) is the FLOP-to-memory
    ratio / RMSNorm can still matter due to / the importance of data movement'
- source_id: CS336-2026-L03-PDF
  locator: pdf:p17
  url: https://github.com/stanford-cs336/lectures/blob/main/lecture_03.pdf
  quote: RMSNorm - validation / RMSNorm runtime (and surprisingly, perf) gains have been seen in papers
    / Narang et al 2020
- source_id: CS336-2026-L03-PDF
