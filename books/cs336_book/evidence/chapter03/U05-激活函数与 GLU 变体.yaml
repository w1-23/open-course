    most / models post 2023'
- source_id: CS336-2026-L03-PDF
  locator: pdf:p22
  url: https://github.com/stanford-cs336/lectures/blob/main/lecture_03.pdf
  quote: Gated activations (*GLU) / GLUs modify the ‘first part’ of a FF layer / 𝐹𝐹𝑥= max 0, 𝑥𝑊1 𝑊2 /
    Instead of a linear + ReLU, augment the above with an (entrywise) linear term / max 0, 𝑥𝑊1 →max 0,
    𝑥𝑊1 ⊗(𝑥𝑉) / This gives the gated variant (ReGLU) – note that we have an extra parameter (V) / FFReGLU
    𝑥= (max 0, 𝑥𝑊1 ⊗𝑥𝑉) 𝑊2
- source_id: CS336-2026-L03-PDF
  locator: pdf:p23
  url: https://github.com/stanford-cs336/lectures/blob/main/lecture_03.pdf
  quote: 'Gated variants of standard FF layers / GeGLU / SwiGLU (swish is 𝑥∗sigmoid(𝑥)) / Note: Gated
    models use smaller dimensions for the 𝑑𝑓𝑓 by 2/3 / Notable models: / T5 v1.1, mT5, LaMDA, Phi3, /
    Gemma 2, Gemma 3, Gemma 4 / Notable models: / LLaMa 1/2/3, PaLM, Mistral, / OlMo, most models post
