  quote: 'A few of the common activations / ReLU / 𝐹𝐹𝑥= max 0, 𝑥𝑊1 𝑊2 / GeLU / 𝐹𝐹𝑥= GELU 𝑥𝑊1 𝑊2 / 𝐺𝐸𝐿𝑈𝑥≔𝑥Φ(𝑥)
    / SwiGLU / GeGLU (next slide..) / Notable models: / Original transformer, T5, / Gopher, Chinchilla,
