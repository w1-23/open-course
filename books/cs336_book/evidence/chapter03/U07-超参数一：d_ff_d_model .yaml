  quote: Surprising (?) consensus hyperparameter 1 / Feedforward – model dimension ratio. / There are
    two dimensions that are relevant – the feedforward dim (𝑑𝑓𝑓) and model dim / (𝑑𝑚𝑜𝑑𝑒𝑙). What should
    their relationship be? / 𝒅𝒇𝒇= 𝟒 𝒅𝒎𝒐𝒅𝒆𝒍 / This is almost always true. There’s just a few exceptions.
