  url: https://github.com/stanford-cs336/lectures/blob/main/lecture_03.pdf
  quote: 'Exception #1 – GLU variants / Remember that GLU variants scale down by 2/3rd. This means most
    GLU variants have / 𝑑𝑓𝑓= / 8 / 3 𝑑𝑚𝑜𝑑𝑒𝑙. This is mostly what happens. Some notable such examples.
    / Model / 𝒅𝒇𝒇/𝒅𝒎𝒐𝒅𝒆𝒍 / PaLM / 4 / Mistral 7B / 3.5 / LLaMA-2 70B / 3.5 / LLaMA 70B / 2.68 / Qwen 14B
    / 2.67 / DeepSeek 67B / 2.68 / Yi 34B / 2.85 / T5 v1.1 / 2.5 / Models are roughly in this range, though
    PaLM, LLaMA2 and Mistra'
- source_id: CS336-2026-L03-PDF
