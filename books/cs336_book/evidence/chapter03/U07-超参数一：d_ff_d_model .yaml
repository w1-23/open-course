  url: https://github.com/stanford-cs336/lectures/blob/main/lecture_03.pdf
  quote: 'Exception #2 – T5 / As we have (and will) see, most LMs are have boring, conservative hyperparameters.
    / One exception is T5 [Raffel et al 2020] which has some very bold settings. / In particular, for
    the 11B model, they set / 𝑑𝑓𝑓= 65,536 / 𝑑𝑚𝑜𝑑𝑒𝑙= 1024 / For an astounding 64-times multiplier. / Other,
    recent exceptions – Gemma 2 (8x), SmolLM/Gemma 3/Gemma 4 (4x, GLU)'
