<text x="120" y="176" font-size="8" fill="#666" text-anchor="middle">同一题的采样树：绿=最终正确，红=错误</text>
<text x="120" y="190" font-size="8" fill="#4a7ba6" text-anchor="middle">ORM 只在叶子上监督；PRM 给每个中间节点打分，</text>
<text x="120" y="202" font-size="8" fill="#4a7ba6" text-anchor="middle">错误步骤（红圈节点）在发生处即被定位</text>
