<!-- legend -->
<text x="165" y="206" font-size="8" text-anchor="middle" fill="#666">灰色箭头 = 主题关联；彩色虚线 = 建议路径（A 蓝 / B 绿 / C 橙）。</text>
<text x="165" y="220" font-size="8" text-anchor="middle" fill="#666">箭头表示主题衔接；各路径均以第 0 章的概念与记号为预备。</text>
<text x="165" y="234" font-size="8" text-anchor="middle" fill="#666">附录 A.1 文献总表可按章节号直接检索。</text>
