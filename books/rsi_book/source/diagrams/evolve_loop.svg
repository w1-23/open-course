<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <defs>
    <marker id="arA" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#333"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#b26a00"/>
    </marker>
  </defs>
  <style>
    text { font-family:"Times New Roman",SimSun, "Microsoft YaHei", sans-serif; fill: #222; }
    .node { rx: 8; stroke-width: 1.4; }
    .lbl { font-size: 15px; }
    .sub { font-size: 12px; fill: #555; }
    .en  { font-family: "Times New Roman", serif; font-style: italic; }
  </style>

  <!-- agent box with five components -->
  <rect x="60" y="60" width="360" height="280" rx="14" fill="#f7f9fc" stroke="#7a8fa6" stroke-width="1.6"/>
  <text x="240" y="86" text-anchor="middle" font-size="16">代理系统　<tspan class="en">P = (ℳ, S, ℛ, T, ℰ)</tspan></text>

  <rect class="node" x="84" y="104" width="150" height="52" fill="#e8f0fe" stroke="#5b8def"/>
  <text class="lbl" x="159" y="126" text-anchor="middle"><tspan class="en">M</tspan>　模型权重</text>
  <text class="sub" x="159" y="145" text-anchor="middle">自训练 · 微调（第 3 章）</text>

  <rect class="node" x="246" y="104" width="150" height="52" fill="#e6f4ea" stroke="#34a853"/>
  <text class="lbl" x="321" y="126" text-anchor="middle"><tspan class="en">S</tspan>　脚手架</text>
  <text class="sub" x="321" y="145" text-anchor="middle">提示 · 工具 · 控制流（第 5 章）</text>

  <rect class="node" x="84" y="170" width="150" height="52" fill="#fef7e0" stroke="#f9ab00"/>
  <text class="lbl" x="159" y="192" text-anchor="middle"><tspan class="en">R</tspan>　记忆与技能库</text>
  <text class="sub" x="159" y="211" text-anchor="middle">经验 · 技能 · 知识（第 5 章）</text>

  <rect class="node" x="246" y="170" width="150" height="52" fill="#fce8e6" stroke="#ea4335"/>
  <text class="lbl" x="321" y="192" text-anchor="middle"><tspan class="en">T</tspan>　任务接口</text>
  <text class="sub" x="321" y="211" text-anchor="middle">目标 · 环境 · 课程（第 6 章）</text>

  <rect class="node" x="165" y="252" width="150" height="56" fill="#f3e8fd" stroke="#a142f4"/>
  <text class="lbl" x="240" y="274" text-anchor="middle"><tspan class="en">E</tspan>　评估器</text>
  <text class="sub" x="240" y="294" text-anchor="middle">判据 · 验证器（第 4、7 章）</text>

  <!-- improvement operator loop -->
  <rect x="500" y="150" width="170" height="90" rx="12" fill="#fff" stroke="#b26a00" stroke-width="1.8"/>
  <text x="585" y="180" text-anchor="middle" font-size="15">改进算子　<tspan class="en">U</tspan></text>
  <text class="sub" x="585" y="202" text-anchor="middle">生成变更 <tspan class="en">i_X</tspan></text>
  <text class="sub" x="585" y="221" text-anchor="middle">（作用于哪个分量由谱系决定）</text>

  <!-- arrows: P -> I (feedback), I -> P (update), E -> I (drive) -->
  <path d="M 420 120 C 470 100, 480 110, 505 158" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arA)"/>
  <text x="470" y="98" text-anchor="middle" class="sub">轨迹与成绩</text>

  <path d="M 505 232 C 470 270, 450 280, 424 285" fill="none" stroke="#b26a00" stroke-width="1.8" marker-end="url(#arB)"/>
  <text x="472" y="278" text-anchor="middle" class="sub" fill="#b26a00">施加 <tspan class="en">P<tspan font-size="9">t+1</tspan> = U(P<tspan font-size="9">t</tspan>, F<tspan font-size="9">t</tspan>)</tspan></text>

  <path d="M 315 280 L 496 240" fill="none" stroke="#a142f4" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arA)"/>
  <text x="408" y="248" text-anchor="middle" class="sub" fill="#7b34c9">判据驱动</text>
</svg>
