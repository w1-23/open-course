# 来源映射：每一章的主要来源、级别与引用范围
#
# 级别：
#   S  原始论文的正式版或公认教材（定理与定义的唯一依据）
#   A  名校课程讲义（组织的参考，不作为定理依据）
#   B  官方文档与官方代码（实现细节与超参数的依据）
#   C  综述（只用来建地图，不得作为关键定理的依据）
#
# file 指向 source/text/ 下已抽取的纯文本，便于逐条核对；页码指该文件内的章节号。
# 「已下载」不等于「已核对」；核对状态记在 review/source_review.yaml。
chapters:
  - "no": 1
    title: Bandit 与探索
    primary:
      - level: S
        cite: "[Sutton2018]"
        file: RLbook2020.txt
        where: "第 2 章（多臂老虎机）、第 2.6–2.7 节（UCB、梯度算法）、第 2.10 节（上下文老虎机）"
      - level: S
        cite: "[Auer2002]"
        where: "UCB1 的对数遗憾界与定理 1"
      - level: C
        cite: "[Lattimore2020]"
        where: "只用于探索方法的分类框架"
    notes: "Lai–Robbins 下界须给出常数与渐近形式；GLIE 的两个条件分开写，不要合并成一条"

  - "no": 2
    title: MDP 与 Bellman 理论
    primary:
      - level: S
        cite: "[Sutton2018]"
        file: RLbook2020.txt
        where: "第 3 章（MDP、回报、值函数、最优性）、第 3.8 节（设计奖励）"
      - level: S
        cite: "[Puterman1994]"
        where: "第 6 章（压缩映射与最优方程的存在唯一性）"
      - level: S
        cite: "[Ng1999]"
        where: "势函数塑形的充分条件"
    notes: "策略改进定理用价值差恒等式证明；残差界只能是 sup-norm 的，不得替换为 MSE/MSBE"

  - "no": 3
    title: 动态规划、蒙特卡洛与时序差分
    primary:
      - level: S
        cite: "[Sutton2018]"
        file: RLbook2020.txt
        where: "第 4 章（DP）、第 5 章（MC 与 GLIE）、第 6–7 章（TD、n 步、资格迹）"
      - level: S
        cite: "[Watkins1992]"
        where: "Q 学习收敛的步长与访问条件"
    notes: "禁止「自举低方差且无偏」；n 步回报与 λ-回报的权重写法统一按 _CONVENTIONS.md"

