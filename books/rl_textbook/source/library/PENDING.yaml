## 处理规则

1. 上述两章若确实需要一手引用，唯一合规做法是用户提供 PDF 或开放获取链接，我再补入
   `source/papers/` 并重跑 `python scripts\build_library.py --all`。
2. 在补入之前，相关论断一律走替代证据，并在正文用脚注注明"转述自 xx，未核原文"。
3. `review/cards/` 中涉及这两篇的 claim，`status` 只能是 `替代证据` 或 `待核验`。
