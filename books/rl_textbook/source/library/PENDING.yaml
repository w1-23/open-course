# 未能按期获取的权威来源

本文件记录按 v3.1 计划应有、但确实无法获取（已尝试多个地址，均为 404 或不可下载）的
一手来源，以及替代证据与由此产生的表述限制。**任何依赖这些来源的论断，在正文中一律
不得声称"依据原始论文"，只能引用替代证据，或标注为「待核验」。**

