notes: 复审通过。首轮 P1（定理 2.5 证明用 D_max）已整段重写为对最小值取极值，逐步复核成立：D_min≥γE[D']≥γD_min ⇒ (1−γ)D_min≥0（γ<1）⇒ D≥0，严格性由 D(s)≥γD_min+A(s) 得到，且明写了最大值方向的陷阱；首轮 P2（定理 2.6 缺 γ<1）已补前提与尾项说明。仍存两条 P3、按 lead 决定记 notes 保留：(a) :147/:162 定理 2.1 终止分支只写「必然有限终止」，严格所需 E[τ]<∞ 仍缺（正文有 [疑点]）；(b) :182 式 (2.13) 的可逆性只援引 γ<1，未覆盖 γ=1+必然终止（应提 ρ(P^π)<1）。另 :439「任何形如 γΦ(s')−Φ(s) 的引导项都不会改变最优解」建议加「在 γ<1 下」。Ng et al. (1999) 与残差界原始出处不在 source/，列为待核验。
