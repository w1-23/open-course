reproduction_result:
  note: >
    运行 `python review/reproductions/CH02-THM-002_two_state.py` → exit 0。
    情形 A 得 D=(+10.0000, +0.0000)，情形 B 得 D=(+5.5000, -5.0000)；两种情形下
    式 (2.22) 的复核偏差均为 0.00e+00。

claims:
  - id: c1
    text: π' 在其余状态与 π 相同时，那些状态的一步优势为 0，故「全状态非劣」成立。
    evidence: 由 A(s)=E_{a∼π'}Q^π(s,a)−V^π(s) 直接代入，见 derivation_file 第 1 节
    status: 已核对
  - id: c2
    text: 因此「可能使其他状态变差」为假；变差需要 π' 在别处的一步优势为负。
    evidence: 复现脚本情形 A/B 的数值对比（D=(+10,0) 与 (+5.5,−5)）
    status: 已核对
  - id: c3
    text: :364「若只在部分状态改进，则只能得到该部分状态的价值不减」同源失真，应区分两种情形。
    evidence: 对照 RLbook2020 p.100 (4.7)(4.8) 的状态逐点结构，见 derivation_file 第 3 节
    status: 已核对
  - id: c4
    text: 正确写法给出可构造的数值反例：(+10)→s1 与 (−0.5) 自环、γ=0.9 时 D=(+5.5,−5)。
    evidence: reproduction_file 与 derivation_file 第 2 节的表格
    status: 已核对

planned_fix:
  - 习题 5 改写为「构造 π' 在 s0 改进、在 s1 退化的两状态 MDP，得 V^{π'}(s0)>V^π(s0) 而 V^{π'}(s1)<V^π(s1)（提示数值 (+5.5,−5)）」，并补问相反情形为什么不成立。
  - 把 :364 的「只能得到该部分状态的价值不减」改为区分两种情形：别处退化时全局非劣失效；别处与 π 相同时全局非劣自动成立、改进处严格增大。
  - 在习题 5 答案要点（若有教师版）中引用 review/reproductions/CH02-THM-002_two_state.py 的两情形输出，避免学生复制旧断言的错证。

