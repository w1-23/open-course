issue_id: CH02-SEC-002
chapter: 2
severity: P1
status: 已有依据
title: 习题 5 断言"只在 s0 改进也会使别处变差"，与定理 2.5 直接矛盾
summary: >
  习题 5 与 :364 的说明都声称「π' 只在 s0 上改进、其余状态与 π 相同时，可能存在
  其他状态 s 使 V^{π'}(s)<V^π(s)」。这是错的：π' 与 π 相同的那些状态一步优势恒为 0，
  「全状态非劣」成立，定理 2.5 因此给出全局非劣，别处不可能变差。要让别处变差，
  π' 必须在别处退化（一步优势为负），也就是违反前提。两状态数值见证：
  π'=(good,stay) 得 D=(+10,0)（非负）；π'=(good,drop) 才得 D=(+5.5,−5)。
  已按此改写习题 5 与 :364，并把见证写成可复现脚本。

current_text:
  file: content/ch02.md
  lines: "364, 503"
  excerpt: >
    5. 用式 (2.22) 证明：若策略 π' 只在某一个状态 s0 上改进，其余状态与 π 相同，
    则 V^{π'}(s0)>V^π(s0)，但可能存在其他状态 s 使 V^{π'}(s)<V^π(s)。

sources:
  - key: RLbook2020
    level: S
    role: 策略改进定理的严格性表述：条件按状态逐点给出，把结论推到所有状态
    pdf_page: 100
    printed_page: "§4.2, p.78, 式 (4.7)(4.8)"
    quote: >
      Moreover, if there is strict inequality of (4.7) at any state, then there must be
      strict inequality of (4.8) at that state.
    note: >
      (4.7) 对每个状态单独成立才推出 (4.8) 对每个状态成立；π' 与 π 相同的状态上
      q_π(s,π'(s))=v_π(s)，(4.7) 以等号成立，因此这些状态同样被结论覆盖。

derivation_file: review/derivations/CH02-SEC-002.md
