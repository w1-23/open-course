  - id: c4
    text: 定理 1 的梯度权重是含动作的 Q_U(s,ω,a)，不能无条件换成 Q_Ω(s,o)。
    evidence: 1609.05140_option-critic p.3 Theorem 1 原文
    status: 已核对
  - id: c5
    text: >
      若用 Q_Ω(s,o) 作权重，Σ_a ∇θ π_o(a|s)·Q_Ω(s,o) = Q_Ω(s,o)Σ_a ∇θ π_o(a|s) = 0，
      内部策略的期望梯度恒为零（梯度消失）。
    evidence: 推导——Σ_a π_o(a|s) = 1 对 θ 求导即得 Σ_a ∇θ π_o = 0；与 c4 的定理 1 对照（derivation_file 第 3 节）
    status: 已核对

planned_fix:
  - 式 (9.4) 改为 `P(s'|s,o)·γ·[V(s') − Q(s',o)]`，并把 76 行的解释改为"梯度 = γ[V−Q]，即优势的负值"。
  - 「关键公式」一节重复的 (9.4) 同步修改（两处必须一致）。
  - 算法 9-1 第 6 行改为 `... * Q_U(s,o,a; w)`，并在框后说明"权重必须含动作；用 Q_Ω 会让该期望梯度恒为零"。
  - 算法 9-1 第 7 行改为 `beta <- beta - eta_beta * (Q(s',o;w) - V(s';w)) * grad_beta beta_o(s')`，保留 γ 时注明"γ 已并入占用测度，此处 γ 只作步长尺度"。
  - 正文 78 行改写：明确"单步偏导 → 策略梯度定理要乘 state-option 占用测度并对 τ 取期望，Q 的评估状态由 s 移到 s'"。
  - 正文 95 行改写：分两段说清"第 6 行梯度恒为零"与"第 7 行用当前 Q 代替 Q(s',o) 是[近似]"。
  - 伪代码框补两条前提：β 用 sigmoid 松弛（硬阈值无梯度）；加终止正则或最小选项长度（否则选项退化为一步）。

