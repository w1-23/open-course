    evidence: 1609.05140_option-critic p.3 Theorem 2 原文公式
    status: 已核对
  - id: c3
    text: >
      本书式 (9.4) 写成 P·γ·[Q(s',o) − V(s')]，符号与 (9.3) 的偏导相反；
      正确形式是 P·γ·[V(s') − Q(s',o)]。
    evidence: 由式 (9.3) 求偏导（derivation_file 第 1 节）；并与正文 76 行、定理 2 的符号三处对照
    status: 已核对
    note: >
