issue_id: CH09-ALG-001
chapter: 9
severity: P0
status: 已有依据
title: 选项评论家：式 (9.4) 的符号反了，伪代码第 6 行的价值函数让梯度恒为零
summary: >
  两处独立错误，都在 9.1.2 节。① 由式 (9.3) 对 β_o(s') 求偏导得
  P(s'|s,o)·γ·[V(s') − Q(s',o)]，书中式 (9.4) 写成了它的相反数；正文 76 行的文字
  解释、定理 2 的 −Σμ∂β·A_Ω、以及"负优势→提高终止概率"三处都与正确符号一致，
  属"文字对、公式错"。② 算法 9-1 第 6 行用 Q_Ω(s,o) 乘 ∇θ log π_o(a|s)，
  而 Q_Ω 与采样动作无关，Σ_a ∇θ π_o(a|s) = 0，故该项的期望梯度**恒为零**——
  这是"梯度消失"，不是"可互替的近似"。
  本卡前一轮的 c3 曾撤回"式 (9.4) 方向错误"，该撤回无效，须在台账中撤销撤回。

current_text:
