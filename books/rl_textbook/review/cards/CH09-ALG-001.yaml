  excerpt: >
    72: \frac{\partial Q(s,o)}{\partial \beta_o(s')}=P(s'\mid s,o)\,\gamma\bigl[Q(s',o)-V(s')\bigr]
    88: 6:    theta <- theta + eta_theta * grad_theta log pi_o(a|s) * Q(s,o; w)
    89: 7:    beta  <- beta + eta_beta * gamma * (Q(s,o; w) - V(s'; w)) * grad_beta beta_o(s')
  note: >
    行号对应修正前的版本（2026-10-20 19:0x 之前）。同一条错误在「关键公式」一节
    （原第 380 行）重复出现，施工时两处都要改。

