issue_id: CH10-BT-001
chapter: 10
severity: P2
status: 已有依据
title: 式 (10.1) 前的"概率之比等于强度之比的指数"写错，且 BT 的比较独立性假设未交代
summary: >
  第 22 行把 Bradley–Terry 的比值性质写成"两个回答被选中的概率之比等于各自'强度'之比的
  指数"。正确的比值恒等式是 P(y_w≻y_l)/P(y_l≻y_w) = exp(r_w − r_l)：若"强度"取
  s_i = r_i（对数强度），比值是 exp(强度差) 而不是 exp(强度比)；若"强度"取 BT 原式的
  π_i，比值就是强度比本身。两种读法下原句都不成立。另外 10.1.2 只写了"同一上下文、
  同一奖励函数"与 logistic 形式，没有写"各对比较在给定奖励下相互独立（或至少不被同一
  标注者的当天状态系统性污染）"——而 10.1.3 讨论标注者异质性时默认了这一点，前后口径
  不一致。这是定义处的表述错误，不影响式 (10.1) 与式 (10.2)。

current_text:
