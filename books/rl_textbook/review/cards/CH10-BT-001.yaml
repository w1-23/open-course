    等于各自"强度"之比的指数。
    第 33 行：它意味着奖励函数只在"差"的意义上被数据约束，任何常数平移都不改变似然，
    也意味着两个回答的奖励必须落在同一个可比较的尺度上（同一上下文、同一奖励函数）。

