claims:
  - id: c1
    text: 式 (10.1) 本身（σ(奖励差)）与"只约束奖励差、常数平移不变"的论述正确。
    evidence: 式 (10.1)、式 (10.3)；推导：σ(r_w+c−r_l−c)=σ(r_w−r_l)
    status: 已核对
  - id: c2
    text: >
      第 22 行的比值表述错误：P(w≻l)/P(l≻w)=exp(r_w−r_l) 是"强度差"的指数（强度取
      exp(r) 时是强度比本身），不是"强度之比的指数"。
    evidence: 由式 (10.1) 直接计算；1706.03741_christiano-rlhf p.5 的指数形式
    status: 已核对
  - id: c3
    text: >
      BT 的隐含假设中，"同一 prompt、logistic 噪声、同一奖励尺度"已写；"各对比较在给定
      奖励下相互独立"未写，而 10.1.3 的标注者异质性讨论默认了它。
    evidence: 推导；content/ch10.md 第 33 行与第 61 行的口径对照
    status: 已核对
  - id: c4
    text: 该表述错误不影响式 (10.2) 的负对数似然与后文 DPO 推导（后文一律直接用奖励差）。
    evidence: 式 (10.2)、式 (10.10) 都只用奖励差
    status: 已核对

planned_fix:
  - 第 22 行改为"两个回答被选中的赔率之比等于 exp(奖励差)：P(y_w≻y_l)/P(y_l≻y_w)=exp(r_w−r_l)；若把 exp(r) 叫强度，它就是强度比本身"。
  - 第 33 行后补一句假设清单：同一上下文、同一奖励函数、logistic 噪声，以及"各对比较在给定奖励下相互独立"，并说明违反独立性时 MLE 仍可用但不再是有效似然。
  - 10.1.3 第 61 行讨论标注者异质性时，把"同一个 logistic 等价于假设所有标注者共享奖励"与 c3 的独立性假设对照，避免两处口径不一致。

