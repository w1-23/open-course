issue_id: CH12-FORM-001
chapter: 12
severity: P1
status: 已有依据
title: 转移分解把观测 o_t 写进了右式却没写进左式；且 s=(h,e) 与 π(a|h) 并列却没有点明这是 POMDP
summary: >
  12.2.1 先把状态写成 s_t=(h_t,e_t)（式 (12.6)），e_t 是工具或环境的内部状态；随后把转移
  分解成 P(h_{t+1},e_{t+1}|h_t,e_t,a_t)=P_llm(h_{t+1}|h_t,a_t)·P_env(e_{t+1},o_t|e_t,a_t)。
  两处都有问题。其一，h_{t+1}=h_t⊕a_t⊕o_t，观测 o_t 由环境产生却必须进入上下文，因此
  正确的分解应把 o_t 放进左式（P(h_{t+1},e_{t+1},o_t|h_t,e_t,a_t)），或把"追加"写成
  确定性映射再对 o_t 积分；现在右式含 o_t、左式不含，等式两侧不是一个事件。其二，状态
  含 e_t 而策略写成 π(a|h)（12.3.2 节），即策略看不到 e_t——这是标准的 POMDP（观测是
  h_t、状态是 (h_t,e_t)），正文从未点明"部分可观测"，也没有说明价值函数 V_φ(h_t) 不是
  状态的充分统计量、由此引入的近似属于哪一类。这两点直接影响 12.2.2"不能把步骤当成
  token"的论证力度（那里的理由是价值头没在含观测的前缀上训练过，而不是状态不可观测）。

current_text:
  file: content/ch12.md
  lines: "100-119"
  excerpt: >
    第 103 行：s_t=(h_t, e_t)，其中 h_t 是上下文，e_t 是工具或环境的内部状态（文件树、
    浏览器会话、代码运行时）。
    第 110-113 行：P(h_{t+1},e_{t+1}|h_t,e_t,a_t) = P_llm(h_{t+1}|h_t,a_t)·P_env(e_{t+1},o_t|e_t,a_t)，
    第一步由策略决定（生成的内容进上下文），第二步由环境决定（工具的执行结果既改变 e，
    也作为观测 o_t 进入 h）。

