claims:
  - id: c1
    text: >
      式 (12.6) 的状态含 e_t，而策略是 π(a|h)（12.3.2 节第 174 行），策略观测不到 e_t，
      因此这是 POMDP；正文没有出现"部分可观测/POMDP"的说明。
    evidence: 推导：content/ch12.md 第 103 行与第 174 行的 π(a|h) 对照
    status: 已核对
  - id: c2
    text: >
      转移分解的左右两侧事件不一致：h_{t+1} 含 o_t，而左式没把 o_t 列为随机变量，右式
      却对 o_t 取条件；正确写法应把 o_t 放进左式，或把追加写成确定性映射。
    evidence: 推导：h_{t+1}=h_t⊕a_t⊕o_t 由构造决定
    status: 已核对
  - id: c3
    text: >
      "第一步由策略决定、第二步由环境决定"的定性结论不受上述问题影响（P_llm 可微、
      P_env 不可微的不对称仍然成立）。
    evidence: 推导：content/ch12.md 第 115-119 行的梯度讨论
    status: 已核对

planned_fix:
  - 第 110-113 行把左式改为 P(h_{t+1},e_{t+1},o_t|h_t,e_t,a_t)，或改为"h_{t+1}=h_t⊕a_t⊕o_t，其中 o_t~P_env(·|e_t,a_t)"的确定性映射加环境核两行。
  - 第 107 行后补一句："策略只观测 h_t，状态含 e_t，因此这是部分可观测 MDP；V_φ(h_t) 是对观测而非状态的估计，12.2.2 的第二条限制与此同源。"
  - 12.2.2 第 125 行"不能套用之二"的理由补半句"即使不看训练分布问题，V(h) 也不是状态的充分统计量"，使两条理由分开。

