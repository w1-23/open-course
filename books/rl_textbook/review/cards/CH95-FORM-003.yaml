issue_id: CH95-FORM-003
chapter: 95
severity: P2
status: 已有依据
title: 组内优势式只写"减均值"，缺第 11 章 (11.7) 的标准差归一化与 s_r=0 整组掩掉
summary: >
  第 95.8 式给出 Â_{i,t}=Â_i=r(x,y_i)−r̄，并把它当作"本章的接口约定"。第 11 章的对应量是
  Â_i=(r_i−r̄)/(s_r+ε_num)，其中 s_r=std(r)、ε_num 只是数值保护、s_r=0 的组整组掩掉（不提供相对信息）。
  两处差别不是记号问题：除以 s_r 会改变梯度尺度（第 11 章 (11.13) 明写 ∇J∝E[(1/s_r)(r_i−r̄)∇log π]），
  而 s_r 依赖同一组样本，使估计量变成比率型、有限 G 下没有一般无偏性；s_r=0 的组若不掩掉则会
  除零或产生纯噪声梯度。读者从本章进第 11 章，会突然多出一个分母、一条掩掉规则和一个 ε_num。
  本章第 250 行已把 (95.8) 说成 GRPO 的直接应用，这个缺口就更显眼。

current_text:
  file: content/ch13prep.md
  lines: "139-144"
  excerpt: >
    第 140 行：Â_{i,t} = Â_i = r(x,y_i) − r̄，t=1,…,|y_i|；
    第 144 行：其中 r̄ 是同一批样本的均值基线。式 (95.8) 的含义是"这条回答整体比平均好多少"，
    它对每个 token 都成立——同一回答的所有 token 共享同一个优势。

