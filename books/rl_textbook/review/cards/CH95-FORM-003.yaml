    text: >
      第 95.8 式与第 11 章 (11.7) 不是同一个量：前者只中心化，后者中心化后还除以 s_r+ε_num；
      若本章的"接口约定"被当作最终形式，第 11 章的分母就成了无出处的突现。
    evidence: 推导：content/ch11.md 第 108-122 行 (11.7) 与本章第 140 行逐项对照；2402.03300_deepseekmath-grpo p.14 给出同一形式
    status: 已核对
  - id: c2
    text: >
      除以 s_r 改变梯度尺度（不是无偏变换），且 s_r 依赖同组样本使估计量变成比率型；
      s_r=0（全组同奖励）时标准做法是整组掩掉，否则除零或只剩噪声。
    evidence: 推导：content/ch11.md 第 120、174、182-190 行分别给出 ε_num 的数值保护作用、比率型估计的偏差、梯度尺度 1/s_r；2402.03300 p.14 的 std(r) 分母
    status: 已核对

