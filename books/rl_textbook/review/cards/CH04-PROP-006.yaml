title: 两处数字与表格不一致：不动点比值区间写成 1.045–1.10，d=6 的"两个特征值"未说明是极值
summary: >
  第 267 行称"TD 不动点与最优投影只差 1.045 到 1.10 倍"，但按表 4-1 的五行数算出的比值是
  1.0445、1.1078、1.0887、1.0616、1.0393，区间应为 1.039–1.108，两端都与正文不符（下界差 0.006，
  上界差 0.008）。第 242 行称"实测 d=6 时 A 的特征值为 0.0144 与 0.0218"：d=6 时 A 是 6×6，
  有六个特征值，只列两个且未说明它们是极小/极大，读者无法复核。两处都是可机械核对的数字，
  不影响结论，但会让"实验可复现"的说法打折。

