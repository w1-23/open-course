issue_id: CH10-DPO-005
chapter: 10
severity: P2
status: 已有依据
title: 隐式奖励 (10.13) 丢掉了 β_KL·log Z(x)，"任何一个语言模型都隐含着奖励"应限定在等价类意义上
summary: >
  10.3.1 第五步把隐式奖励写成 r̂_θ = β_KL·log(π_θ/π_ref)，紧接着说"任何一个语言模型都
  隐含着一个奖励函数，只要指定参考策略和 β_KL"。按 DPO 定理 1，这个重参数化只给出奖励
  等价类中的一个代表：同一最优策略对应的奖励可以相差任意只依赖 x 的函数（推导里正是
  β_KL·log Z(x)，第一步的式 (10.9) 也写出来了，第二步相减时抵消）。因此"隐含着奖励函数"
  应写成"在相差一个只依赖 x 的常数的意义上"，否则读者会以为 (10.13) 给出了唯一的奖励，
  进而把不同 prompt 的 r̂ 值直接比较。本章后面（10.5.1、10.5.2）确实在跨 prompt 比较
  隐式奖励，这个限定时必须显式写出。

current_text:
  file: content/ch10.md
  lines: "207-215"
  excerpt: >
    第 214 行：式 (10.13) 是本章最值得停一下的公式。它告诉我们：在式 (10.5) 的目标下，
    "奖励"与"策略偏离参考策略的程度"是同一件事的两种写法。任何一个语言模型都隐含着一个
    奖励函数，只要指定参考策略和 β_KL。

