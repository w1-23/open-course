claims:
  - id: c1
    text: >
      式 (10.13) 是奖励等价类的一个代表：真奖励与它相差 β_KL·log Z(x)，后者只依赖 x，
      因此在同一 prompt 内的差值与偏好概率中不影响任何结论。
    evidence: 式 (10.9) 与式 (10.10) 的相消；2305.18290_dpo p.6 定理 1
    status: 已核对
  - id: c2
    text: >
      第 214 行"任何一个语言模型都隐含着一个奖励函数"应加"在相差只依赖 x 的函数的
      意义上"，否则会被读成唯一奖励。
    evidence: 2305.18290_dpo p.6；推导：Z(x) 只依赖 x
    status: 已核对
  - id: c3
    text: >
      10.5.2 的跨 prompt 比较（长度残差回归、受控胜率）用的是同一批 prompt 内的成对
      比较，未直接比较不同 x 的 r̂ 数值——因此该限定不影响 10.5 现有的度量，但必须写明。
    evidence: 推导：content/ch10.md 第 336-353 行的度量都按同一 prompt 的成对样本定义
    status: 已核对

planned_fix:
