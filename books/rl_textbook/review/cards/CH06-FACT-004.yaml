issue_id: CH06-FACT-004
chapter: 6
severity: P2
status: 已有依据
title: '"原始论文指出 α_ent 等价于对奖励做 1/α_ent 缩放"是推论，不是论文的原话'
summary: 第 299 行与第 363 行两次把"α_ent 等价于对奖励做 1/α_ent 的缩放"记在 Haarnoja et al., 2018a 名下。原文的说法是：SAC 对奖励尺度特别敏感，因为奖励尺度充当能量最优策略的温度、从而控制策略的随机性（引文）；它给的是"奖励尺度 = 温度"的定性关系，没有写出 1/α_ent 这个换算。等价性本身是对的——在式 (6.16) 的目标里把奖励乘以
  c，等于把 α_ent 除以 c——但它是从目标式直接读出的推论，标成论文"明确指出"属引用不准。读者据此去论文里找这句话会找不到，进而怀疑整段的出处。
current_text:
  file: content/ch06.md
  lines: 299, 363
  excerpt: |-
    第 299 行：原始论文中 \(\alpha_{\mathrm{ent}}\) 是手工设定的超参数，并明确指出它等价于对奖励做 \(1/\alpha_{\mathrm{ent}}\) 的缩放
    第 363 行：SAC 的原始论文指出 \(\alpha_{\mathrm{ent}}\) 等价于对奖励做 \(1/\alpha_{\mathrm{ent}}\) 的缩放，因此"调温度"与"调奖励尺度"在数学上是同一件事
