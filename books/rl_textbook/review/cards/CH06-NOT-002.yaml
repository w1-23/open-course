  lines: 103, 130, 139, 310-316
  excerpt: '第 103 行：Q(s,a;\theta,\alpha,\beta)=V(s;\theta,\beta)+A(s,a;\theta,\alpha)

    第 130 行：P(i)=\frac{p_i^{\alpha}}{\sum_k p_k^{\alpha}}

    第 312 行：\(\alpha\) 是学习率，出现在第 5 章的策略梯度更新与本章式 (6.1) 的表格更新中'
