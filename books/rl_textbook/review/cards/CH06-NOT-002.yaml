  quote: 'put a scalar V (s; θ, β), and the other stream output an |A|-

    dimensional vector A(s, a; θ, α). Here, θ denotes the pa-

    rameters of the convolutional layers, while α and β are the

    parameters of the two streams of fully-connected layers.

    Using the deﬁnition of advantage, we might be tempted to

    construct the aggregating module as follows:

    Q(s, a; θ, α, β) = V (s; θ, β) + A(s, a; θ, α),'
- key: 1511.05952_prioritized-replay
  level: S
  role: PER 原文用 α 作优先级指数、β₀ 作重要性采样指数初值
  pdf_page: 6
  printed_page: §5 超参数（纸面 p.6）
  quote: 'subset of 8 games), and found the sweet spot to be α = 0.7, β0 = 0.5 for the rank-based variant

    and α = 0.6, β0 = 0.4 for the proportional variant. These choices are trading off aggressiveness

    with robustness, but it is easy to revert to a behavior closer to the baseline by reducing α and/or

    increasing β.'
