issue_id: CH06-NOT-002
chapter: 6
severity: P2
status: 已有依据
title: α 在章内有三个所指（学习率、Dueling 优势支路、PER 优先级指数），符号澄清段只覆盖了第一个
summary: 第 310–316 行专门写了一节"三个温度/步长符号"，但它只说 α 是学习率。实际上第 103 行的 Dueling 聚合用 \((\theta,\alpha,\beta)\) 表示主干／优势支路／价值支路参数（沿用原文记号），第 130 行与第 458 行的 PER 用 α 作优先级指数、β 作重要性采样指数，而 β 在第 314 行又被 \(\beta_{KL}\) 占据一角。于是
  α 在一章里有三个所指、β 有三个所指，澄清段只覆盖了其中一个。这不是排版小疵：把式 (6.8) 的 α 当成学习率、或把式 (6.5) 的 α 当成优先级指数，都会直接算错，而两处相距不到 60 行。
