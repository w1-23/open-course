reproduction_result:
  note: >
    本条不需要数值实验，只需四则运算：λ=0.9 时 w_5=(1−0.9)×0.9^4=0.06561；
    λ=0.5 时 w_5=0.5×0.5^4=0.03125（与正文 0.031 一致）；0.0314 对应 λ=0.9 的 w_12。

claims:
  - id: c1
    text: 对 0≤λ<1，权重和 Σ_n(1−λ)λ^{n−1}=1，归一化常数 1−λ 的唯一作用就是让权重和为 1。
    evidence: 等比级数求和；RLbook2020 p.311 原文 "normalized by a factor of 1−λ to ensure that the weights sum to 1"
    status: 已核对
  - id: c2
    text: λ=1 时每个有限 n 的权重都为 0、主和归零，式 (3.18) 在该点没有定义；正确定义需写出残余项 λ^{T−t−1}G_t。
    evidence: RLbook2020 p.312 原文 "the main sum goes to zero, and the remaining term reduces to the conventional return"
    status: 已核对
  - id: c3
    text: 正文第 273 行 λ=0.9 的 w_5=0.033 是算错的，正确值 0.06561；0.0314 实际是 w_12。
    evidence: 逐项计算，见 derivation_file 第 3 节权重表
    status: 已核对
  - id: c4
    text: 正文的定性结论（λ 增大使长项相对权重变大、分布变平缓而不是摊平）成立，但缺"权重和恒为 1"这一判据，读者无法自证。
    evidence: 由 c1 与权重表直接得到（推导第 1、3 节）
    status: 已核对

planned_fix:
  - 第 268–271 行式 (3.18) 后补两句：权重和 Σ_{n≥1}(1−λ)λ^{n−1}=1（0≤λ<1）；λ=1 时主和为零、残余项 λ^{T−t−1}G_t→G_t，即退化为 MC 回报（引式 (3.19) 递推作解释）。
  - 第 273 行把 w_5=0.033 改为 w_5=0.066，并把"与前者第 5 项相当"改为"是前者第 5 项的 2.1 倍"。
  - 第 273 行末句后补一句判据："因为权重和恒为 1，λ 增大只能把质量从短项移到长项，不可能让各项趋于相等。"
  - 习题 6（第 476 行）要求"用 λ=0.9 与 λ=0.99 前 10 项说明"，答案需给出 w_5(0.9)=0.0656 与 Σ_{n≤10}w_n=0.6513，与修正后的正文一致。

