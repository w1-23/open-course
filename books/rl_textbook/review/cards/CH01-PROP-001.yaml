planned_fix:
  - 命题 1.1 改为带条件的版本：加"首个被选臂的首次回报非负"前提，并明确 Δ₁ 为该臂与最优臂的均值差。
  - 删除"此后只有臂 1 的估计被更新"与"正漂移随机游走返回该区域的期望次数有限"两句，改为"一旦 Q(1) 低于其它臂的当前估计，贪心就会换臂，故不保证锁死"。
  - 紧接着补一句"贪心的真正缺陷是没有机制保证再次尝试，最坏情形遗憾为 Θ(T)"，与命题 1.2 的下界衔接，并明确区分"可能线性/必然线性/次线性"三种口径。
  - 检查 1.2.2 之后引用命题 1.1 的段落（若有"因此贪心必然线性"之类推论）一并改写。
  - 习题中若要求"证明贪心遗憾为线性"，需改成"构造一个使贪心线性遗憾的奖励序列"。

