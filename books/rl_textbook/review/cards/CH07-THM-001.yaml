reproduction_result:
  note: >
    不需要数值实验：压缩情形下的有界性有闭式证明 d_{h+1} ≤ λ d_h + ε ⇒ d_h ≤ λ^h d_0 +
    ε(1−λ^h)/(1−λ) ≤ d_0 + ε/(1−λ)，见推导第 2 节。若要数值对照，可用二维线性系统
    x_{t+1}=A x_t + w（‖A‖<1）比较开环推演误差曲线——它应收敛到平台而非指数上升。

claims:
  - id: c1
    text: 式 (7.5) 与定理 7.1 的线性界正确，证明只需逐项三角不等式。
    evidence: 推导第 2 节 (a)；ch07 `:121` `:126` 的陈述本身
    status: 已核对
  - id: c2
    text: 「压缩核 ⇒ 几何增长」方向说反：λ-压缩下 d_h ≤ d_0 + ε_m/(1−λ)，误差有界而不增长。
    evidence: 推导第 2 节 (b) 的闭式递推与上界
    status: 已核对
  - id: c3
    text: 「误差分支式相乘」不成立：单条路径误差仍 ~hε_m，随深度指数增长的是叶子数 b^h。
    evidence: 推导第 2 节 (c)；与本章定理 7.1 直接冲突
    status: 已核对
  - id: c4
    text: MBPO 定理 4.2 的模型项为 k(ε_m+2ε_π)/(1−γ)，对 rollout 长度与模型误差都线性，佐证"线性而非相乘"。
    evidence: 1906.08253_mbpo p.4 的 Theorem 4.2 转写与推导第 2 节末段
    status: 已核对

planned_fix:
  - 把 `:129` 的评注改为：「界是紧的当且仅当各步误差同向累积；若转移核在总变差下是 λ-压缩，误差被压到 ε_m/(1−λ) 而不再随 h 增长；只有动力学扩张时才会出现更快的（指数）增长。」
  - 把 `:282` 改为：「式 (7.5) 的线性增长在搜索里更严重：每个叶子都要走 h 次模型查询，单叶误差约 hε_m；而叶子数随深度按 b^h 增长，整棵树的误差预算因此被放大——这是"深树不可信"的算术来源，不是单条路径的误差被逐层相乘。」
  - 若保留 §7.4.4 的三种边界列举，在该段开头补一句"这里说的放大指搜索树覆盖的叶子数，不是单条推演的误差律"，避免与定理 7.1 并列时被读成同一条。
