issue_id: CH07-THM-001
chapter: 7
severity: P1
status: 已有依据
title: 误差随深度累积在本章有三种互不相容的说法，且"压缩核⇒几何增长"方向说反了
summary: >
  定理 7.1 与式 (7.5) 给出的是线性界 ‖P̂_h−P_h‖_TV ≤ hε_m（标 [精确]）；但紧随其后的
  评注说"实践中往往更接近几何增长（若转移核是压缩的）"，§7.4.4 又说"误差分支式相乘而非
  相加"。三者是三种不同增长率，不可能同时成立。其中线性界本身正确；"压缩核⇒几何增长"
  方向反了——压缩会把误差压成有界 ε_m/(1−λ)，只有扩张动力学才会指数增长；"分支式相乘"
  也不成立——单条推演路径的误差仍按 h 累积，随深度指数增长的是叶子数 b^h。外部文献
  （MBPO 定理 4.2）对模型误差给出的也是线性项 kε_m/(1−γ)。

current_text:
  file: content/ch07.md
  lines: "118-129, 282"
  excerpt: >
    第 129 行：界是紧的当且仅当误差同号累积，实践中往往更接近几何增长（若转移核是压缩的）或更快（若动力学不稳定）。
    第 282 行：式 (7.5) 的线性增长在搜索里更严重：树越深，每个叶子依赖更多次模型查询，误差分支式相乘而非相加。

