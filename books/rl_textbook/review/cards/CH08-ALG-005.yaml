title: DAgger 段落此前只有"作者+年份"括注，缺一手引注；表述本身正确
summary: >
  8.4.2 节的描述（"让策略先跑，把它访问到的状态拿给专家标注，再并入数据集"）与
  Ross、Gordon 与 Bagnell 2011 的 Algorithm 3.1 完全一致：算法第 4–6 行是
  "用 π_i 采样轨迹 →取被 π_i 访问到的状态 →专家给出动作 →并入 D"，
  并且明确"我们要的是学习者自己会遇到的状态"。原文还给了 β_i 的混合策略 π_i = β_i π* + (1−β_i)π̂_i 与 no-regret 收敛，正文第 273 行的 Tε 线性界即由此而来。
  审计第一轮因该文献不在库中而记为"无法核实"；现已把 arXiv:1011.0686 收入
  source/library（level S，9 页），正文也补成"（Ross、Gordon 与 Bagnell, 2011，算法 3.1）"。

current_text:
  file: content/ch08.md
  lines: "255-257; 283-284"
  excerpt: >
    既然错误来自"策略自己会去、但专家没去过的状态"，修法就明确了：让策略先跑，
    把**它访问到的状态**拿给专家标注，再把这些新样本并入数据集。这就是 DAgger
    （Ross、Gordon 与 Bagnell, 2011，算法 3.1）。

sources:
  - key: 1011.0686_dagger
    level: S
    role: Algorithm 3.1 的原始步骤（在 π_i 访问到的状态上取专家标签）
    pdf_page: 4
    printed_page: "§3 Algorithm 3.1"
    quote: >
      Get dataset Di = {(s, π∗(s))} of visited states by πi and actions given by expert.
      Aggregate datasets: D ←D S Di. Train classiﬁer ˆπi+1 on D.
    note: >
      这就是"数据集聚合"的字面含义：新增样本的**状态**来自学习者当前策略，
      标签来自专家——不是对专家数据做变换。
  - key: 1011.0686_dagger
    level: S
    role: 为什么要这样做——把"学习者会遇到的状态"逐步纳入训练分布
    pdf_page: 4
    printed_page: "§3"
    quote: >
      The intuition behind this algorithm is that over the iterations, we are building up
      the set of inputs that the learned policy is likely to encounter during its execution
      based on previous experience (training iterations).
    note: 这句话直接支撑正文"DAgger 改变的是数据分布，而不是样本数量"的论断。

