issue_id: CH05-GAE-001
chapter: 5
severity: P1
status: 已有依据
title: GAE 的定义与两端点正确，但"偏差"的三种来源没有区分，且与原文"otherwise biased"表面冲突
summary: '本章式 (5.17) Â_t=Σ_{l≥0}(γλ)^l δ_{t+l} 与 GAE 原文式 (16) 逐项一致；λ=0 退化为单步 δ_t、λ=1 望远镜求和为 G_t−V_φ(s_t)，分别对应原文式
  (17)(18)；第 238 行"λ=1 时偏差 与 critic 的精度无关"正是原文"GAE(γ,1) is γ-just regardless of the accuracy of V, but
  it has high variance"的中文表述，本章**没有**写成"GAE(λ=1) 无偏、只增方差"，也没有把 "优势估计无偏"当成"策略梯度无偏"——判定项 4 的实质内容成立。缺的是两处边界：
  （a）原文第 5 页明确指出"γ<1 会（相对未折扣目标）给策略梯度引入偏差，与 V 是否准确 无关"，本章从未提到这一层，读者会把"偏差"只理解成 critic 误差； （b）原文第 4 页说 δ^V
  "only γ-just for V=V^{π,γ}, otherwise it will yield biased policy gradient estimates"，而本章命题 B（任意状态基线不改变梯度期望）只对**蒙特卡洛权重**
  G_t 成立；两者并不矛盾——有偏的是自举权重 δ_t（V_φ 的误差经转移核 P 变成动作相关项， 见 CH05-ADV-001.md 第 3 节）——但本章没有一句把"MC 权重 vs 自举权重"的分界线写出来，
  读者会把命题 B 套到 δ_t 上，属需要决策的表达风险。

  '
current_text:
  file: content/ch05.md
  lines: 219-248
  excerpt: '第 226 行（式 5.17）："Â_t = Σ_{l≥0}(γλ)^l δ_{t+l},  λ∈[0,1]" 第 231 行："λ=0 时 Â_t=δ_t，退化为单步 TD 误差；λ=1
    时把递推展开，相邻项中的 γV_φ 逐项相消，只剩" 第 238 行："**λ=1 时偏差与 critic 的精度无关**。无论 V_φ 多离谱，G_t−V_φ(s_t) 都只差一个状态函数，而状态函数进不了梯度（命题
    B）。反过来，λ<1 时自举把 V_φ 的误差乘进了优势，误差不再是一个纯粹的状态函数，于是偏差出现。"

    '
sources:
- key: 1506.02438_gae
  level: S
  role: GAE 的定义式与 λ=0/λ=1 两个端点的原始出处
  pdf_page: 5
  printed_page: §3, p.5, Eq. (16)(17)(18)
  quote: The generalized advantage estimator GAE(γ, λ) is deﬁned as the exponentially-weighted average
    of these k-step estimators
  note: '式 (16) 与本章 (5.17) 的求和形式、权重 (γλ)^l 完全一致；(18) 的右端正是 G_t−V(s_t)。

    '
- key: 1506.02438_gae
  level: S
  role: λ=1 时偏差与 V 精度无关、但方差高的原文表述（本章第 238 行的依据）
  pdf_page: 5
  printed_page: §3, p.5
  quote: 'GAE(γ, 1) is γ-just regardless of the accuracy of V , but it has high variance due to the sum
    of terms. GAE(γ, 0) is γ-just for V = V π,γ and otherwise induces bias, but it typically has much
    lower variance.

    '
  note: '这正是"λ=1 偏差与 critic 精度无关、λ<1 依赖 critic"的原文；注意原文的限定词是 γ-just（对折扣优势无偏），不是"对未折扣优势无偏"。

    '
- key: 1506.02438_gae
  level: S
  role: γ<1 本身引入偏差（相对未折扣目标），本章缺此一层
  pdf_page: 5
  printed_page: §3, p.5
  quote: 'Taking γ < 1 introduces bias into the policy gradient estimate, regardless of the value function''s
    accuracy. On the other hand, λ < 1 introduces bias only when the value function is inaccurate.

    '
  note: '这句话把"折扣偏差"与"自举偏差"分开，是本章最需要补的一句：本章只在折扣目标下 讨论，读者不会意识到 γ 本身是另一个偏差旋钮。

    '
- key: 1506.02438_gae
  level: S
  role: 与本章命题 B 表面冲突的原句（需在正文调和）
  pdf_page: 4
  printed_page: §3, p.4
  quote: 'However, this estimator is only γ-just for V = V π,γ, otherwise it will yield biased policy
    gradient estimates.

    '
  note: '原文此处的"biased policy gradient estimates"指的是用 δ^V 当 Ψ_t 时该**估计量**不等于 真优势；在 on-policy、状态基线的前提下，其期望仍等于
    ∇J（本章命题 B）。两种说法 对象不同，需要在正文里明确区分，否则读者会认为本章与原文矛盾。

    '
