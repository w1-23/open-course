planned_fix:
- 在 5.2.3 节第 238 行之后补一句折扣偏差：'注意这里的'偏差'只指自举带来的部分；原文还指出 γ<1 本身会让梯度相对未折扣目标产生偏差，与 V 是否准确无关——本书全章优化的是折扣目标 (5.1)，因此不把这一层计入，但读者换到未折扣任务时必须补上。'
- 在 5.2.3 节末尾增加一段两句的调和：'GAE 原文说 δ^V 在 V≠V^π 时会 yield biased policy gradient estimates，指的是 δ^V 不是 A^π 的无偏估计；它与命题
  B 不矛盾——命题 B 说的是带状态基线的梯度**期望**不变，而原文说的是**优势估计量**本身有偏。两者的差别正是 5.2.1 节两个命题的分工。'
- 在式 (5.17) 下方补半句适用范围：'λ 只在 V_φ 不精确时引入偏差；V_φ 精确时 0≤λ≤1 都无偏，差别只在方差'，与原文 p.5 的措辞对齐。
- 若 lead 决定在 5.2.3 增补上述两段，需同步检查图 5-3 的图注措辞（当前图注用'偏差/标准差'，未区分偏差来源），在图注里加'（相对解析梯度的范数误差）'以免与折扣偏差混淆。
