issue_id: CH03-PROP-002
chapter: 3
severity: P1
status: 已有依据
title: 蒙特卡洛的无偏性被归因于"样本相互独立"，且"每次访问对单个样本有偏"与原文和表 3-1 矛盾
summary: >
  第 103 行把无偏的理由写成"首次访问的样本在给定状态后相互独立，因而 G_t 是无偏样本"。
  无偏的真正来源是"回合按 π 生成、过程马尔可夫"，独立性只决定平均值的方差（式 3.7 的 σ²/N），
  不是无偏的原因。第 110 行更进一步说"每次访问对单个样本有偏"：每个每次访问回报 G_t 的
  条件期望仍是 v^π(s)，单个样本无偏；偏差来自访问次数 N_s 随机且与回报相关的比值结构。
  S&B p.115 只说 every-visit "less straightforward, but converges"，未断言有偏；
  同章表 3-1 写的是"偏差 小（样本相关）"，与正文自相矛盾。

current_text:
  file: content/ch03.md
  lines: "96-117"
  excerpt: >
    第 103 行：首次访问的样本在给定状态后相互独立，因而 G_t 是 v^π(S_t) 的无偏样本
    第 110 行：[精确]；每次访问对单个样本有偏（重复访问相关），但两种估计在样本量趋于无穷时都收敛 [渐近]

sources:
  - key: RLbook2020
    level: S
    role: 首次访问与每次访问的定义（两种方法都只是"对哪些访问的回报取平均"）
    pdf_page: 114
    printed_page: "§5.1 Monte Carlo Prediction（纸面 p.92）"
    quote: >
      The first-visit MC method estimates v_π(s) as the average of the returns following first
      visits to s, whereas the every-visit MC method averages the returns following all visits
      to s. These two Monte Carlo (MC) methods are very similar but have slightly different
      theoretical properties.
  - key: RLbook2020
    level: S
    role: >
      无偏性与 1/√n 的论证（i.i.d. 用于大数定律与标准差，不是用于无偏性本身），以及每次访问"也收敛"而非"有偏"的说法
    pdf_page: 115
    printed_page: "§5.1 Monte Carlo Prediction（纸面 p.93）"
    quote: >
      In this case each return is an independent, identically distributed estimate of v_π(s)
      with finite variance. By the law of large numbers the sequence of averages of these
      estimates converges to their expected value. Each average is itself an unbiased estimate,
      and the standard deviation of its error falls as 1/√n, where n is the number of returns
      averaged. Every-visit MC is less straightforward, but its estimates also converge
      quadratically to v_π(s) (Singh and Sutton, 1996).

