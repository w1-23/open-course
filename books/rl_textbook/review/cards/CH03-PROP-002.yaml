claims:
  - id: c1
    text: E[G_t|S_t=s]=v^π(s) 的前提是回合按 π 生成且过程马尔可夫，与样本间是否独立无关。
    evidence: 由 v^π 与 G_t 的定义直接得到；RLbook2020 p.115 把 i.i.d. 用在大数定律与 1/√n 上
    status: 已核对
  - id: c2
    text: 独立性真正支撑的是式 (3.7) 的 Var(N 条回报均值)=σ²/N 与大数定律，正文这一段的结论本身没错。
    evidence: RLbook2020 p.115 原文 "the standard deviation of its error falls as 1/√n"
    status: 已核对
  - id: c3
    text: 原文"每次访问对单个样本有偏"的说法不成立：每个 G_t 的条件期望仍是 v^π(s)，偏差来自随机访问次数 N_s 的比值结构。
    evidence: 推导第 2 节（比值估计量的偏）；RLbook2020 p.115 只说 every-visit 收敛、未说单个样本有偏
    status: 已核对
  - id: c4
    text: 正文第 110 行与同章表 3-1"每次访问 MC ｜ 偏差 小（样本相关）"自相矛盾，属章内不一致。
    evidence: content/ch03.md 第 242 行表 3-1 该行与第 110 行对照；另见 RLbook2020 p.115 原文只说 every-visit 收敛
    status: 已核对

planned_fix:
  - 第 103 行拆成两句：先给无偏的真正理由（G_t 是沿 π 的实际回报，E[G_t|S_t=s]=v^π(s)），再给独立性的作用（跨回合独立同分布 ⇒ 式 3.7 的 σ²/N 与大数定律）。
  - 第 110 行改为"每次访问的单个样本仍无偏；偏差来自访问次数 N_s 随机且与回报相关的比值结构，量级小，两种估计在样本量趋于无穷时都收敛"，与表 3-1 的"小（样本相关）"对齐。
  - 第 105–107 行把条件期望的记号说明补全："期望同时对 A_{t+k}~π 与 S_{t+k+1}~P 取"，避免读者误以为只对状态取期望。

