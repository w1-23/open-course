planned_fix:
  - 定理 8.1 框内拆成两条结论并各带条件："第一（间隙扩张，α_off 足够大）……第二（价值下界，需 \(D_{\mathrm{TV}}(\hat\pi_{k+1},\pi_{\hat Q_k})\le\varepsilon\) 与 \(\mathbb{E}_{\pi_{\hat Q_k}}[\pi_{\hat Q_k}/\hat\pi_\beta-1]\ge\max_a(\pi_{\hat Q_k}/\hat\pi_\beta)\cdot\varepsilon\)）……"。
  - 第 132 行"当 α_off 足够大时，有两点结论"改为"在策略慢变（\(D_{\mathrm{TV}}\le\varepsilon\)）且 α_off 足够大时"，把两个条件分开归属。
  - 第 128 行"α_off 的量纲与奖励相同"改为"α_off 与奖励尺度相乘，因此换奖励尺度必须同步缩放"，并补一句"理论所需 α 随数据量增加而下降，所以 α 的合适取值同时取决于奖励尺度与数据覆盖"。
  - 第 142 行的条件清单同步加上"策略慢变"与"α 随数据量选"两条，避免读者把 \(D_{\mathrm{TV}}\le\varepsilon\) 漏掉。

