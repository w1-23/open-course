issue_id: CH08-ALG-004
chapter: 8
severity: P2
status: 已有依据
title: 定理 8.1 把 CQL 的 Thm 3.3 与 Thm 3.4 合并成一条，条件归属不准；α 的语义也不全
summary: >
  原文 CQL 有两条结论：Theorem 3.3（在学习到的 Q 值下界意义上保守，条件是策略慢变
  \(D_{\mathrm{TV}}(\hat\pi_{k+1},\pi_{\hat Q_k})\le\varepsilon\)，并需要一个关于
  \(\hat\pi_{\hat Q_k}/\hat\pi_\beta\) 的期望不等式）与 Theorem 3.4（间隙扩张，条件是
  "α_k 足够大"）。正文的定理 8.1 把两者压成一条，且第 132 行写成"当 α_off 足够大时，
  有两点结论"——把 Thm 3.3 的慢变条件也归给了 α。另外第 128 行说"α_off 的量纲与奖励相同"，
  原文只称它为 tradeoff factor，并明确说"保证下界所需的 α 理论值随数据量增加而下降"；
  结论（换奖励尺度必须同步缩放）成立，但理由应写成"α 与奖励尺度相乘"而不是"量纲相同"。
  本条不质疑符号方向：式 (8.5)(8.6) 与原文 Eq (2)(4) 逐项一致，方向（压数据外、抬数据内）正确。

current_text:
