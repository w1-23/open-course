    note: 正文式 (8.7) 与这条不等式完全一致，只需把条件写对。
  - key: 2006.04779_cql
    level: S
    role: α 的语义——tradeoff factor，且理论所需取值随数据量下降
    pdf_page: 4
    printed_page: "§3.1"
    quote: >
      We also note that as more data becomes available and |D(s, a)| increases, the
      theoretical value of α that is needed to guarantee a lower bound decreases, which
      indicates that in the limit of infinite data, a lower bound can be obtained by using
      extremely small values of α.
    note: 同页 Theorem 3.2 的 α 下界公式里含 √|D(s)| 与 π/π̂β 的比值，说明 α 的最优量级随数据覆盖变化。

