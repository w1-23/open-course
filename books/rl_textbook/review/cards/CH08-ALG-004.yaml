    第 132 行：……当 \(\alpha_{\mathrm{off}}\) 足够大时，有两点结论。第一，对任意状态 \(s\)，
    数据动作与数据外动作之间的估值差被**扩张**……第二，此时 \(\hat V_{k+1}(s)\le V_{k+1}(s)\)……

