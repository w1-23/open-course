title: 定理 1.2 标 [渐近]，与本章第 8 行的标签定义、以及第 167 行的自述都冲突
summary: >
  第 8 行定义：标 [精确] 的结论对每个有限 T 成立，标 [渐近] 的只描述 T→∞ 的曲线形状。
  式 (1.10) 是 Regret(T) ≤ 8 Σ ln T/Δ_a + (1+π²/3)ΣΔ_a，对每个 T≥1 成立，按第 8 行应标
  [精确]；第 167 行作者自己也写「严格说对每个有限 T 都成立，地位其实是 [精确]」，但定理框
  仍标 [渐近]。这是章内两处口径不一致（读者按第 8 行判读会得到与定理框相反的结论），不是
  数学错误。作者的理由「可读内容只有按 ln T 增长」属于叙述层面的判断，而标签在本书里是
  陈述强度的标记；用标签提示"这条界别当真"，会让 [精确] 失去可比性——该提醒放进正文句子
  更合适（第 167 行已有）。本章其余两处 [渐近]（式 (1.3) 的 liminf、第 58 行的极小极大
  讨论）符合定义，故 (1.10) 是唯一的不一致点。

current_text:
  file: content/ch01.md
