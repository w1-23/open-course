    quote: >
      the number c > 0 controls
      the degree of exploration. If Nt(a) = 0, then a is considered to be a maximizing action.
    note: 确认 (1.9) 的自由 c 与教材原版一致，问题出在把常数 8 挂到这个自由参数上。
  - key: 1904.07272_bandit-algorithms
    level: S
    role: UCB1 的原版置信半径是 √(α ln t/n_t(a)) 且 α=2，即 (1.9) 的 c=√2
    pdf_page: 17
    printed_page: "第 1 章 §1.5（纸面 p.13）"
    quote: >
      with α = 2; note that log T is replaced with log t compared to the exposition in this chapter (see (1.5)). This
      version allows for the same regret bounds, at the cost of a somewhat more complicated analysis.
    note: 该句紧接在原版半径公式 (1.15) 之后，α=2 即置信半径系数为 √2。

