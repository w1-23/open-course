issue_id: CH01-THM-001
chapter: 1
severity: P1
status: 已有依据
title: 定理 1.2 让 c 自由却把常数 8 当作通用常数——8 只对应 c=√2，而本章实验取 c=2
summary: >
  式 (1.9) 把 UCB 索引写成 Q_t(a)+c√(ln t/N_t(a)) 并声明 c>0 任意，第 151 行还说
  「c 是置信水平的手柄」；定理 1.2 紧接着给出常数 8 的界，隐含 c 已被固定。按标准分析，
  索引 Q+c√(ln t/N) 的遗憾首项常数是 4c²（Hoeffding + 并集界，见推导第 2 节），
  4c²=8 给出 c=√2，正是 Auer 等 (2002) 原版半径 √(2 ln t/N)（Lattimore 与 Szepesvári
  把原版写成 √(α ln t/n_t(a)) 并注明 α=2）。而本章表 1-2 的实验用的是 c=2，对应常数 16。
  于是定理 1.2 按 (1.9) 的表述对 c=2 为假；对 c≤1/√2 连尾部级数都不收敛、索引不再是
  有效上置信界，结论同样不成立。

current_text:
  file: content/ch01.md
  lines: "146-149,157-165"
  excerpt: >
    第 146-149 行（式 1.9）：A_t=argmax_a{Q_t(a)+c√(ln t/N_t(a))}，c>0。
    第 157-159 行（定理 1.2）：设 K 个臂的奖励独立同分布、取值于 [0,1]……则 UCB1 的期望遗憾满足下面的界。
    第 161-165 行（式 1.10）：Regret(T) ≤ 8 Σ_{a:Δ_a>0} ln T/Δ_a + (1+π²/3) Σ_a Δ_a。
    第 255 行（实验设定）：UCB1（式 (1.9) 取 c=2）。

