reproduction_file: null
reproduction_result:
  note: >
    本条是分析性结论，不需要数值实验：常数依赖由推导第 2 节的 Hoeffding 界给出，
    4c² 对 c 的线性依赖是显式的。若要数值演示，可比较 c=√2 与 c=2 的 UCB 遗憾曲线斜率，
    但那只能显示常数差别，不能证明界。

claims:
  - id: c1
    text: UCB 索引 Q+c√(ln t/N) 的遗憾首项常数是 4c²，来自 Hoeffding 偏差概率 t^(−2c²) 与必然情形的计数约束 n ≤ 4c² ln t/Δ²。
    evidence: 推导第 2 节（review/derivations/CH01-THM-001.md），式 (*)
    status: 已核对
  - id: c2
    text: 4c²=8 当且仅当 c=√2；Auer 等 (2002) 的 UCB1 原版半径是 √(2 ln t/N)，即 c=√2。
    evidence: 1904.07272_bandit-algorithms p.17 式 (1.15) 后「with α = 2」+ 推导第 3 节
    status: 已核对
  - id: c3
    text: 本章表 1-2 的实验用 c=2，对应的常数应为 16，与式 (1.10) 的 8 不一致。
    evidence: content/ch01.md 第 255 行；推导第 3 节
    status: 已核对
  - id: c4
    text: 若 c ≤ 1/√2，则 2c² ≤ 1，尾部级数 Σ t^(−2c²) 发散，(1.10) 的界不成立，索引也不再是有效上置信界。
    evidence: 推导第 2 节末（尾部级数收敛条件 2c²>1）
    status: 已核对
  - id: c5
    text: 因此定理 1.2 按 (1.9) 的表述（c 自由）为假，须固定 c=√2 或把常数写成 4c²。
    evidence: 推导第 4 节（review/derivations/CH01-THM-001.md）的结论部分；式 (1.9) 与式 (1.10) 对照
    status: 已核对

planned_fix:
  - 在式 (1.9) 后补一句「本节固定 c=√2，即 Auer 等 (2002) 的置信半径 √(2 ln t/N)」，并删去「c 是置信水平的手柄」里暗示可任取的表述。
  - 或把式 (1.10) 的首项常数改成 4c²，并在定理前提里补 c>1/√2（保证偏差尾部级数收敛）。
  - 表 1-2 的设定行与第 1.4.4 节正文同步：若实验仍取 c=2，须注明「实验参数与定理 1.2 的 c=√2 不同，此处的界不适用于该实验」。
  - 第 171 行「UCB1 在间隙不太小的实例上遗憾按 ln T 增长」的数值算例基于式 (1.10)，改常数后同步复核 8 与 4c² 的乘积。

