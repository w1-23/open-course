title: n 步回报的"偏差与方差介于两端、方差随 n 增"未标理论地位，方差单调性一般不成立
summary: >
  3.4.1 节末句把两件事合成一句："用到的真实奖励越多，自举成分越少，偏差越小、方差越大"。
  偏差一条有严格依据（S&B 式 (7.3) 的误差缩减性质，γ^n 收缩），是 [精确]；
  方差一条只是常见趋势，不是定理——Var(G^{(n)}) 的三项分解里，奖励与自举值的协方差项可以为负，
  足以让方差序列非单调。正文两句都没有标理论地位，读者会当成定理。

current_text:
  file: content/ch03.md
  lines: "253-262"
  excerpt: >
    V(S_{t+n}) 是剩下尾巴的估计。n=1 退化为 TD(0) 的目标，n 超过回合长度时退化为 MC 回报。
    中间取值的偏差与方差介于两端：用到的真实奖励越多，自举成分越少，偏差越小、方差越大。

sources:
  - key: RLbook2020
    level: S
    role: n 步回报的误差缩减性质（约束的是期望误差的上界，不是方差单调性）
    pdf_page: 166
    printed_page: "§7.1 n-step TD Prediction（纸面 p.144）"
    quote: >
      The n-step return uses the value function Vt+n−1 to correct for the missing rewards beyond
      Rt+n.
    note: >
      该性质只给"期望"的一阶误差上界，对二阶矩（方差）没有任何断言，因此不能用来支持
      "方差随 n 增大"这一句。

