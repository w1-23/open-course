planned_fix:
  - 第 117 行改为："一条序列上的 token KL 之和是序列 KL 的**无偏**估计——前缀从 π_θ 抽正是无偏的原因；若前缀取自 π_ref（off-policy）则会引入偏差。它的真正问题是方差随长度线性增长。"
  - 第 100 行"于是整条序列的累计惩罚恰好等于序列 KL"改为"于是累计的 KL 惩罚等于 β_KL log(π_θ(y|x)/π_ref(y|x))，其期望才是序列 KL"。
  - 第 117 行之后补一句：工程上用 k3 估计器（非负、无偏、方差更小），见第 10 章 (10.8) 与第 11 章 (11.11)。

