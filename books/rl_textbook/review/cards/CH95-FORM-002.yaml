claims:
  - id: c1
    text: >
      按 (95.7) 的链式分解，单条序列上的 Σ_t log(π_θ/π_ref) 的期望恰为序列 KL，
      即该估计量无偏；正文的"有偏"判断错误。
    evidence: 推导：review/derivations/CH95-FORM-002.md 第二、三步给出 E[Ê]=D_KL 的完整推导；与 2402.03300_deepseekmath-grpo p.14 的"unbiased estimator"表述一致
    status: 已核对
  - id: c2
    text: >
      偏差的来源是 off-policy 前缀（y_<t ∼ π_ref 而 y_t ∼ π_θ），而不是本章所说的
      on-policy 前缀；正文把因果方向写反了。
    evidence: 推导：若前缀改由 π_ref 抽样，E[Σ_t log(π_θ/π_ref)] 的内层期望变为 E_{π_ref}[log(π_θ/π_ref)]，不等 (95.7)；见同一推导文件第二步
    status: 已核对
  - id: c3
    text: >
      真正需要提醒的是方差：和的方差随 T 线性增长（Θ(T)），单条序列估计长回答 KL 的相对误差不随长度消失；
      k3 估计器（第 10 章 (10.8)、第 11 章 (11.11)）同为无偏但方差更小，这才是工程选择的理由。
    evidence: 推导：Var(Ê)=E[Ê²]−KL² 按 t 展开为三项，同阶时 Θ(T)；2402.03300 p.14 的 k3 形式逐 token 非负
    status: 已核对
  - id: c4
    text: >
      第 100 行"累计惩罚恰好等于序列 KL"与该错误同源：逐 token 扣除的 β_KL Σ_t log(π_θ/π_ref)
      是一个样本上的对数比，只有取期望才等于 β_KL·D_KL。
    evidence: 推导：见 review/derivations/CH95-FORM-002.md 第四节；与本章 (95.7) 并列即可看出差一个 E[·]
    status: 已核对

