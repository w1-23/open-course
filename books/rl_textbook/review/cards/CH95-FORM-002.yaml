issue_id: CH95-FORM-002
chapter: 95
severity: P1
status: 已有依据
title: 第 117 行把单条序列的 token KL 之和说成"有偏估计"，按同一节的链式分解它其实无偏，问题在方差
summary: >
  第 117 行称"用一条采样序列算出的 token KL 之和，是对序列 KL 的一个有偏（因为前缀分布
  来自 π_θ 而非 π_ref）或至少高方差的估计"。这与同节 (95.7) 的链式分解直接冲突：
  E_{y∼π_θ}[Σ_t log(π_θ/π_ref)] = D_KL(π_θ‖π_ref)，所以单条序列上的求和是无偏估计，
  而"前缀来自 π_θ"恰恰是无偏的原因——若把前缀换成 π_ref（对参考模型的输出做 teacher
  forcing），内层期望才不再等于逐位置 KL，那时才出现偏差。真正需要提醒读者的是方差：
  和的方差随序列长度线性增长，标准差不随长度消失，这才是工程上改用 k3 估计器的动机。
  这一段的教学后果不轻：读者会以为"必须先纠偏"，从而给一个本来就无偏的估计量加修正项。
  同节的另一处同源表述在第 100 行——"累计惩罚恰好等于序列 KL"，应改为"其期望等于"。

