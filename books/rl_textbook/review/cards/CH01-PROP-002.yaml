claims:
  - id: c1
    text: 常数（指数遗忘）步长在非平稳环境是常用做法，但文献只说 it is one of the most popular ways，并未称其唯一正确。
    evidence: RLbook2020 p.54「One of the most popular ways…」
    status: 已核对
  - id: c2
    text: 常数步长不满足 Σα_n²<∞，估计永不收敛，这是它的已知代价而非"正确"。
    evidence: RLbook2020 p.55「never completely converge…」
    status: 已核对
  - id: c3
    text: 滑窗平均与无偏常数步长 β_n=α/ō_n 是实现同一诉求的另外两条路径。
    evidence: RLbook2020 p.55 习题 2.7 式 (2.8)(2.9) 与 §2.5 的滑窗讨论
    status: 已核对
  - id: c4
    text: 第 71 行的「唯一正确」与第 136 行「跟踪与收敛不可兼得」口径相反，属章内不一致。
    evidence: 推导第 3 节（review/derivations/CH01-PROP-002.md）；content/ch01.md 第 71 行与第 136 行对照
    status: 已核对

planned_fix:
  - 第 71 行改为：1/n 对应样本平均，在平稳奖励下无偏、方差按 1/n 收缩；常数 α 给出指数遗忘的平均，它不收敛（式 (1.8) 第二条不满足），但在非平稳环境下正是要的跟踪行为。
  - 同句补一句：滑窗平均与无偏常数步长（β_n=α/ō_n）是同一诉求的另两种实现，故不存在"唯一正确的选择"。
  - 把「平稳分布最优」改成「平稳奖励分布下合适」，避免与 MDP 里的状态平稳分布混淆。
  - 与第 136 行统一措辞：两处都表述为「让步长不趋于零以跟踪漂移，代价是放弃收敛保证」。

