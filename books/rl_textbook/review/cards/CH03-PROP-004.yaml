issue_id: CH03-PROP-004
chapter: 3
severity: P2
status: 已有依据
title: ε-软最优策略的价值差写成 O(ε)，漏掉 1/(1−γ) 因子
summary: >
  3.2.3 节末句说"最终学到的只是最优的 ε-软策略，价值与最优值相差 O(ε)"。
  正确量级是 O(ε/(1−γ))：由 ε-贪心对 Q* 展开可直接推出
  V^*(s) − V^{π*_ε}(s) ≤ ε(R_max−R_min)/(1−γ)。漏掉 1/(1−γ) 会让读者以为探索代价与折扣无关，
  与本章"折扣决定有效视野"的主线矛盾。S&B 在 p.122 只给 ε-软定义、p.125 只说
  "best policy among the ε-soft policies"，并未给出界，所以这是作者自加的量化表述，必须写全常数。

current_text:
  file: content/ch03.md
  lines: "147-154"
  excerpt: >
    称满足式 (3.10) 的策略为 ε-软策略：它把覆盖变成策略自身的性质，代价是最终学到的只是
    最优的 ε-软策略，价值与最优值相差 \(O(\varepsilon)\)。

sources:
  - key: RLbook2020
    level: S
    role: ε-软策略与 ε-贪心的定义（覆盖的定量形式）
    pdf_page: 122
    printed_page: "§5.4 Monte Carlo Control without Exploring Starts（纸面 p.100）"
    quote: >
      The ε-greedy policies are examples of ε-soft policies, defined as policies for which
      π(a|s) ≥ ε/|A(s)| for all states and actions, for some ε > 0. Among ε-soft policies,
      ε-greedy policies are in some sense those that are closest to greedy.
  - key: RLbook2020
    level: S
    role: 上确界式的结论（只到"ε-软策略集中的最优者"，没有给价值差的数量级）
    pdf_page: 125
    printed_page: "§5.4 末（纸面 p.103）"
    quote: >
      This brings us to roughly the same point as in the previous section. Now we only achieve
      the best policy among the ε-soft policies, but on the other hand, we have eliminated the
      assumption of exploring starts.
    note: >
      同页紧接 5.5 节进入离策略；全书没有给出 ε-软最优策略与最优策略的价值差公式，
      因此该量化表述须由正文自行给出并证明（见 derivation_file）。

derivation_file: review/derivations/CH03-PROP-004.md
