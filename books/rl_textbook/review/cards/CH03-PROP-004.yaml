reproduction_result:
  note: >
    界由解析推导给出；数值示意只需代入 ε=0.1、R∈[0,1]：γ=0.9 时界为 1.0，γ=0.99 时界为 10.0，
    相差 10 倍，说明 1/(1−γ) 不能省略。

claims:
  - id: c1
    text: V^*(s) − V^{π_ε}(s) = ε[max_a Q^*(s,a) − (1/|A|)Σ_a Q^*(s,a)]，对 ε-贪心策略成立。
    evidence: 推导第 2 节（把 V^{π_ε} 按 π_ε 展开并整理）
    status: 已核对
  - id: c2
    text: 有界奖励下 V^*(s) − Q^*(s,a) ≤ (R_max−R_min)/(1−γ)，故差距 ≤ ε(R_max−R_min)/(1−γ)，即 O(ε/(1−γ))。
    evidence: 推导第 2 节的两步夹逼
    status: 已核对
  - id: c3
    text: S&B 未给出该界，正文的 O(ε) 属自加表述，不能以"教材如此"为由保留。
    evidence: RLbook2020 p.122 与 p.125 原文（只给定义与"best among ε-soft"）
    status: 已核对

