  - 第 154 行后补一句："界对 ε 线性、对 γ 是 1/(1−γ) 的——折扣越接近 1，固定的探索成本越大。"
  - 若不愿给常数，退而写"价值损失随 ε 线性、随 1/(1−γ) 放大"，不得只留 O(ε)。

