reproduction_result:
  note: >
    本条不需要新实验：第 3 章的图 3-3 用的正是常数步长（MC α=0.02、TD α=0.30），曲线后期在
    0.10 附近抖动而不归零，正是 O(α) 邻域的实测形态；若换成 1/N 步长，两条曲线都会趋于 0。

claims:
  - id: c1
    text: 式 (3.15) 的期望更新不动点满足 V=T^πV，即 V^π；"TD(0) 解给定策略的贝尔曼方程"这一句正确。
    evidence: 由式 (3.15) 取期望更新直接得到（推导同节式 (3.14)）
    status: 已核对
  - id: c2
    text: 原文「停在偏差上」只对常数步长成立：此时估计在 V^π 附近 O(α) 邻域游走，不精确收敛。
    evidence: RLbook2020 p.55 原文（常数步长不满足 Σα²<∞，"never completely converge"）
    status: 已核对
  - id: c3
    text: 在 Σα=∞、Σα²<∞ 的步长下（定理 3.1 的条件），TD/Q-learning 以概率 1 收敛到真值，"停在偏差上"不能作为普遍性质。
    evidence: RLbook2020 p.153 原文（Q "converge with probability 1 to q*"）
    status: 已核对
  - id: c4
    text: 该句混用了两个概念：不动点意义下的"解的是贝尔曼方程"（V^π）与有限步长下的"残余偏差"（O(α)），二者不是一回事。
    evidence: 推导见本节式 (3.15) 与 p.55 的常数步长讨论
    status: 已核对

