issue_id: CH03-SEC-001
chapter: 3
severity: P2
status: 已有依据
title: 「TD 收敛快但停在偏差上」缺常数步长条件，与定理 3.1 的 Robbins–Monro 步长冲突
summary: >
  3.3.3 节末句写"TD 每步把估计拉向 T^πV，MC 每步把估计拉向一个无偏样本；前者收敛快但停在偏差上"。
  "停在偏差上"只对常数步长成立（此时收敛到 V^π 附近宽 O(α) 的邻域，S&B p.55）；
  在定理 3.1 所用的 Robbins–Monro 步长下，TD 与 Q-learning 都以概率 1 收敛到真值（S&B p.153）。
  同一章两处对"TD 收敛到哪里"给出不同答案，须限定步长类型。

current_text:
  file: content/ch03.md
  lines: "210-221"
  excerpt: >
    蒙特卡洛的不动点也是 v^π（样本量趋于无穷时），区别在到达路径：TD 每步把估计拉向 T^πV，
    MC 每步把估计拉向一个无偏样本；前者收敛快但停在偏差上，后者慢慢消除偏差。

sources:
  - key: RLbook2020
    level: S
    role: 常数步长下"永不精确收敛、只在真值附近游走"的原文，是"停在偏差上"的唯一依据
    pdf_page: 55
    printed_page: "§2.7 步长条件（纸面 p.33）"
    quote: >
      Note that both convergence conditions are met for the sample-average case, α_n(a) = 1/n,
      but not for the case of constant step-size parameter, α_n(a) = α. In the latter case, the
      second condition is not met, indicating that the estimates never completely converge but
      continue to vary in response to the most recently received rewards.
  - key: RLbook2020
    level: S
    role: Robbins–Monro 步长下 Q-learning 以概率 1 收敛到 q*，与"停在偏差上"的普遍化表述冲突
    pdf_page: 153
    printed_page: "§6.5 Q-learning（纸面 p.131）"
    quote: >
      However, all that is required for correct convergence is that all pairs continue to be
      updated. As we observed in Chapter 5, this is a minimal requirement in the sense that any
      method guaranteed to find optimal behavior in the general case must require it. Under this
      assumption and a variant of the usual stochastic approximation conditions on the sequence
      of step-size parameters, Q has been shown to converge with probability 1 to q*.

