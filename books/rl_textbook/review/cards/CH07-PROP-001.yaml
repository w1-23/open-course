issue_id: CH07-PROP-001
chapter: 7
severity: P2
status: 已有依据
title: 「推得越远方差越小」只在确定性模型下成立，本章却按普遍规律陈述
summary: >
  §7.2.3 用"偏差—方差权衡"解释短 rollout：h 增大时方差下降、偏差上升。方差下降的理由
  写在破折号后——"因为模型内部是确定性的"，这其实是前提，但句子本身被当成普遍结论。同一章
  在 7.2.1、7.3.1、7.3.3 三处都主张模型要建模分布（随机转移），PETS 的轨迹采样更是每一步
  都按概率预测重采样粒子。在随机模型下方差并不下降：取两状态模型（转移等概率、奖励 0/1、
  γ=0.9、V_φ≡0），Var(Ĝ_h)=1.3158(1−0.81^h) 随 h 单调上升并收敛到 1.3158。
  结论"存在最优 h"仍成立，但理由必须写成"h 把权重从价值函数搬到模型"，并说明模型随机性归哪一侧。

current_text:
  file: content/ch07.md
  lines: "109-116"
  excerpt: >
    这样做的理由是**偏差—方差权衡**：h 增大，估计的方差下降——因为模型内部是确定性的，
    几步推演把随机性压缩掉了；但偏差上升——每一步都乘上一次模型误差。

