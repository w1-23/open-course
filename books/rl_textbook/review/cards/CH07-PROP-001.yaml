    text: 随机模型下 Var(Ĝ_h) 随 h 上升，闭式为 1.3158(1−0.81^h)（给定 V_φ 无方差）。
    evidence: 推导第 2 节的逐项计算与数值表
    status: 已核对
  - id: c3
    text: 若 V_φ 自身有方差 σ_v²，则 Var(Ĝ_h)=1.3158(1−0.81^h)+0.81^h σ_v²，只有 σ_v²>1.3158 时方差才随 h 下降。
    evidence: 推导第 2 节的通式
    status: 已核对
  - id: c4
    text: 「存在最优 h」的结论不受影响，受影响的是它的理由：h 是在模型误差与价值误差之间换手，不是单向降方差。
    evidence: 推导第 3 节；偏差一侧由式 (7.5) 的 hε_m 给出
    status: 已核对

planned_fix:
  - 把 `:116` 的破折号从句改写为：「h 增大，偏差上升（每步乘一次模型误差，量级 hε_m）；方差是升是降取决于模型是否确定——确定性模型下 γ^{2h} 把价值函数的方差压掉，随机模型下模型噪声会把方差补回来甚至更大（PETS 的轨迹采样正是每一步都重采样）。两股力量方向相反，所以存在最优视野。」
