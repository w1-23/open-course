title: 优先回放的 41/49 与 48%→106% 被记到"均匀回放的 Double DQN"名下，原文比较的是 DQN
summary: 第 145 行写"原论文在 49 个游戏中的 41 个上优于均匀回放的 Double DQN，归一化得分中位数从 48% 提升到 106%"。原文的比较对象是 DQN 与 DQN+优先回放（引文：adding prioritized replay to DQN … 41 out of 49 … from 48% to 106%），归一化基准是 Double DQN=100%，原文紧接着说优先回放的收益与
  Double 互补、"再加 Double 又高出一档"。本章把基线写成 Double DQN，等于把两级改进压成一级，读者会以为 PER 单独就把中位数从 48% 提到 106%（超过 Double DQN 一倍），而真实关系是 DQN→DQN+PER 才走完这 58 个百分点。
