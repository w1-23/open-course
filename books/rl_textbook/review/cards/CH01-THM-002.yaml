reproduction_file: null
reproduction_result:
  note: >
    K=2 连续先验的反例是解析的（H(1/2)=ln2，样本平均使后验收缩、I(θ;h_T) 无界增长），
    无需数值实验。若要演示可用 Beta 先验的双臂伯努利，但结论不依赖具体分布。

claims:
  - id: c1
    text: 链式法则给出 Σ_t I(θ;A_t,r_t|h_t)=I(θ;h_T)，所以式 (1.16) 的第一个不等号成立。
    evidence: 推导第 1 节（互信息链式法则）
    status: 已核对
  - id: c2
    text: 「I(θ;h_T) ≤ H(A*)」不成立：最优动作只是参数的一个函数，I(θ;h_T) 可以无界增长，而 H(A*)≤ln K。
    evidence: 推导第 2 节（K=2 连续先验反例，H(A*)=ln2≈0.69）
    status: 已核对
  - id: c3
    text: 正确形式把信息量的对象换成最优动作：Γ_t=(EΔ_t)²/I(A*;A_t,r_t|h_t)，上界 √(Γ H(A*) T)。
    evidence: 1707.02038_thompson-sampling p.79 式 (8.7)、p.80 式 (8.8)
    status: 已核对
  - id: c4
    text: 从 √(Γ̄ T H(A*)) 到 √(KT ln K) 还需要 Γ=O(K)；只说「信息比有界」（与 K 无关的常数）只能得到 √(T ln K)。
    evidence: 1707.02038_thompson-sampling p.80 的对角例 Γ≤d/2 与 p.81 的 Γ≤1/2；推导第 4 节
    status: 已核对

planned_fix:
  - 把第 228 行的 I_T 与 Γ_t 中的 θ 改成最优动作 A*：I_T=I(A*;h_{T+1})、Γ_t=(EΔ_t)²/I(A*;A_t,r_t|h_t)，并加一句「信息量的对象是最优动作，不是参数」。
  - 在式 (1.16) 后补一句说明：链式法则给出 I(A*;h_T)，而互信息不超过被判定的离散变量之熵，故有 I(A*;h_T)≤H(A*)≤ln K。
  - 第 236 行把「信息比有界」补成「信息比 O(K) 量级（K 臂情形 Γ≤K/2）」，否则删去 √(KT ln K) 里的 K、只写 √(T ln K)。
  - 第 236 行末「先验必须正确（I_T 按先验算，若真值不在先验支撑内，不等式失去意义）」随符号替换一并改写为按 A* 的先验表述。

