issue_id: CH01-THM-002
chapter: 1
severity: P1
status: 已有依据
title: 式 (1.16) 把信息量的对象写成参数 θ，导致"≤ H(A*)"一步失去依据
summary: >
  第 228 行定义 I_T=I(θ;h_{T+1})、Γ_t=(EΔ_t)²/I(θ;A_t,r_t|h_t)，式 (1.16) 随后写
  I_T ≤ H(A*) ≤ ln K。链式法则那一步（Σ_t I(θ;A_t,r_t|h_t)=I(θ;h_T)）是对的，但
  「I(θ;h_T) ≤ H(A*)」不成立：历史对**参数**的信息量可以远大于最优动作的熵。K=2 连续
  先验的例子中 H(A*)=ln2≈0.69 nats，而样本平均使 I(θ;h_T)→∞。正确写法是把信息量的
  对象换成最优动作 A*：TS 教程式 (8.7) 的分母是 I(x*;(x_t,y_t)|H_{t−1})，式 (8.8) 给
  Regret ≤ √(Γ·H(x*)·T)，其推导正是靠"互信息之和不超过 H(x*)"。另外第 236 行
  「信息比有界 ⇒ √(KT ln K)」还隐含 Γ=O(K)（对角例 Γ≤d/2），只说"有界"只能得到
  √(T ln K)。

current_text:
  file: content/ch01.md
  lines: "228-236"
  excerpt: >
    第 228 行：记瞬时遗憾 Δ_t=μ*-μ_{A_t}、I_T=I(θ;h_{T+1}) 为历史对参数的信息量，并定义信息比
    Γ_t=(E[Δ_t])²/I(θ;A_t,r_t|h_t)……则由柯西—施瓦茨不等式……得
    第 230-234 行（式 1.16）：Regret‾(T) ≤ √(Γ̄ T I_T) ≤ √(Γ̄ T H(A*)) ≤ √(Γ̄ T ln K)。
    第 236 行：TS 之所以好，是因为共轭情形下它的信息比有界，从而得到 √(KT ln K) 量级。

