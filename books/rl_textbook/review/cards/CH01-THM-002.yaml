      between the uncertain optimal action x∗and the impending observation
    note: 式 (8.7) 的完整形式是 Γ_t=(E[μ(x*,θ)−μ(x_t,θ)])²/I(x*;(x_t,y_t)|H_{t−1})；分子是单期期望遗憾的平方。
  - key: 1707.02038_thompson-sampling
    level: S
    role: 上界只到最优动作先验的熵 H(x*)，不涉及参数分布的熵
    pdf_page: 80
    printed_page: "§8.1（纸面 p.80）"
    quote: >
      expect to acquire, which is at most the entropy of the prior distribution
      of the optimal action.
    note: 同一页式 (8.8) 为 E[Regret(T)] ≤ √(Γ H(x*) T)；推导用 Jensen 与互信息链式法则。

