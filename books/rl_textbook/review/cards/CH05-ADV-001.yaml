  lines: 118-140
  excerpt: '第 129 行："这个恒等式对**任意**只依赖 s 的 b 成立，不要求 b 与策略有关，也不要求它有界以外的任何性质。" 第 136 行："对任意 b 都是无偏的。选择 b(s)=V^π(s)
    使权重变成优势 A^π(s,a)，方差最小；选择 b(s)=V_φ(s)（学出来的近似）在实践中几乎一样好，代价是引入一点偏差——关于''偏差从哪来、是否影响无偏性''，5.2.1 节要分成两个命题讲清楚。"

    '
