title: 基线恒等式的条件写对了，但两处措辞会被读成"任意基线"与"梯度有偏"
summary: '式 (5.10) 的推导（Σ_a b(s)∇π = b(s)∇Σ_a π = b(s)∇1 = 0）与"b 只依赖状态"的条件在 正文第 118–129 行与算法 5-1 的注（第 148
  行"b 只依赖状态"）都写了；5.2.1 又把 "优势估计无偏"（命题 5.1，需 V_φ=V^π）与"策略梯度无偏"（命题 B，任意状态基线） 分成两条独立陈述，第 182–184 行还专门警告不要把两者混成"GAE
  无偏所以策略梯度无偏"。 就判定项 2、3 而言，**本章的实质结论正确**。但有两处措辞会被误读： （a）第 129 行"也不要求它有界以外的任何性质"——字面暗示"b 必须有界"，而 Sutton
  & Barto 第 329 页的原话是"可以是任意函数，甚至是随机变量，只要不随动作变化"； （b）第 136 行"对任意 b 都是无偏的"漏掉"只依赖状态"这一限定，紧接着又说"选择 b=V_φ ……
  代价是引入一点偏差"，这句话单独读会推出"用学出来的 critic 会让策略梯度 有偏"。命题 B 只对**蒙特卡洛权重**（式 5.11 的 G_t）成立；一步 AC 的 δ 版本确实有偏 （V_φ
  的误差经转移核变成动作相关项），正文没有把这两者分开写。这两处是措辞层面的 P1，不涉及公式本身。

  '
current_text:
