planned_fix:
- 第 129 行改为：'这个恒等式对任意只依赖状态（不随动作变化）的 b 成立——甚至可以是一个随机变量，唯一要求是它不能依赖 a。'删掉'不要求它有界以外的任何性质'这一歧义句。
- 第 136 行改为：'对任意只依赖状态的 b 都是无偏的。选择 b=V^π 使权重变成优势，方差最小；选择学出来的 V_φ 在实践中几乎一样好——它不改变梯度的期望（命题 B），代价只是优势估计带上
  critic 的误差，方差也未必最小。'
- 在 5.2.1 末尾补一句方向性提醒：'命题 B 要求采样分布与目标策略一致（on-policy）；若用行为策略数据，需乘重要性比率，无偏性另论'，以免读者把命题 B 外推到离策略。
- 算法 5-1 的注（第 148 行）保持'b 只依赖状态'不变，但在框后正文加半句'b 不要求有界、不要求与策略同分布'，与修正后的第 129 行一致。
