issue_id: CH01-THM-003
chapter: 1
severity: P2
status: 已有依据
title: 第 58 行把 Θ(√(KT)) 整体归因给 Auer 等 (2002)，而该文的上界只到 √(KT log T) 量级
summary: >
  第 58 行：「对 [0,1] 有界奖励类的最优量级是 Θ(√(KT))（Auer 等 2002）」。Θ 需要两侧：
  下界 Ω(√(KT)) 与匹配的上界 O(√(KT))。Lattimore 与 Szepesvári（p.17，印 p.13）说 UCB 的
  界「optimal up to O(log T) factors」，并把「去掉 log T 因子」记为 Audibert 与 Bubeck (2010)
  的工作——即 2002 年那篇给出的上界是带 log 因子的 √(KT log T)，匹配的 √(KT) 上界是后来
  才有的。把 Θ 归给 2002 年，等于把 2010 年的一半也算了进去。此处不是纯署名问题：第 171 行
  结尾又用「√(KT) 与 ln T 并不矛盾」支撑论点，读者一旦查文献会发现对不上。

current_text:
  file: content/ch01.md
  lines: "58"
  excerpt: >
    极小极大界先在实例类上取上确界，对 [0,1] 有界奖励类的最优量级是 Θ(√(KT))（Auer 等 2002）；
    贝叶斯界把实例按先验平均，得 √(KT ln K) 量级——三者取 sup 与取期望的顺序不同，数值可差出量级。

sources:
  - key: 1904.07272_bandit-algorithms
    level: S
    role: UCB 类界的身份是「只差 O(log T) 因子」，去掉 log 因子是 2010 年的工作
    pdf_page: 17
    printed_page: "第 1 章 §1.5「Optimality」（纸面 p.13）"
    quote: >
      Regret bounds in (1.9) and (1.11) are near-optimal, according to the lower bounds which we
      discuss in Chapter 2. The instance-dependent regret bound in (1.9) is optimal up to O(log T) factors. Audibert
      and Bubeck (2010) shave off the log T factor
    note: 同页脚注与正文都表明 UCB1 的原始分析带常数项，匹配的 √(KT) 阶上界不是 2002 年那篇给出的。

