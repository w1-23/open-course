claims:
  - id: c1
    text: Θ(√(KT)) 是"下界 Ω 与上界 O 同时成立"的合成陈述，不能只凭一篇给出单侧的文献支持。
    evidence: 推导第 1 节（三个断言拆解）
    status: 已核对
  - id: c2
    text: L&S 明确说 UCB 的界只到「optimal up to O(log T) factors」，去掉 log 因子是 Audibert 与 Bubeck (2010)。
    evidence: 1904.07272_bandit-algorithms p.17「Optimality」段
    status: 已核对
  - id: c3
    text: 因此把 Θ(√(KT)) 整体署名给 Auer 等 (2002) 不准确，应把两侧分别署名。
    evidence: 1904.07272_bandit-algorithms p.17 + 推导第 2 节
    status: 已核对
  - id: c4
    text: Auer 等 (2002b) 确实给出 Ω(√(KT)) 的极小极大下界——由 L&S §2.7 文献注记直接确认；一手原文仍不在库内，故记为「转述核对」。
    evidence: 1904.07272_bandit-algorithms p.0029（§2.7 Literature review）："The Ω(√KT) lower bound on regret is from Auer et al. (2002b)."（原文 PDF 仍 PENDING，未逐句核对）
    status: 已核对

planned_fix:
  - 第 58 行改为：对 [0,1] 有界奖励类，极小极大遗憾的阶是 Θ(√(KT))——√(KT) 阶下界与「差一个 log T」的上界由 Auer 等 (2002) 给出，匹配的上界在 2010 年前后由 Audibert 与 Bubeck 通过去掉 log T 因子得到。
  - 若只想保留一句，改为：Auer 等 (2002) 的界与 Ω(√(KT)) 的下界只差一个 log T 因子，共同确定量级为 √(KT)。
  - 第 171 行结尾「√(KT) 与 ln T 并不矛盾」保持不动，但补一句指向修好的第 58 行，避免读者以为 2002 年就已有匹配界。

