  note: 措辞与前提核对，不需要数值实验；对照第 4.3.4 节的收敛命题前提与第 4.5.3 节的"三条保证同时消失"。

claims:
  - id: c1
    text: 原文的措辞是"不稳定性可以被避免"（can be avoided），不等于"有收敛保证"。
    evidence: RLbook2020 p.286
    status: 已核对
  - id: c2
    text: 函数逼近 + on-policy 的收敛只在“线性 Φ + 满列秩 + Robbins–Monro 步长”下被证明，第 4.3.4 节的命题自己写明了这三条前提。
    evidence: content/ch04.md 第 244 行与式 (4.9)；与 S&B p.258 的限定一致
    status: 已核对
  - id: c3
    text: 函数逼近 + 自举若用非线性逼近（神经网络），没有一般收敛定理；本章 4.5.3 节已明确"三条保证同时消失"。
    evidence: content/ch04.md 第 439 行；与 RLbook2020 p.258 的"不能依赖经典 SGD 结果"一致
    status: 已核对
  - id: c4
    text: 三句并列会让读者以为"只要不凑齐三要素就安全"，从而忽略每类组合各自的附加条件。
    evidence: 推导式对照：第 92 行的三句与第 124、244、439 行给出的实际前提
    status: 已核对

planned_fix:
  - 第 92 行改为"任意两者同时存在时，不稳定性可以被避免（S&B 的措辞），但能否证明收敛取决于具体组合的前提"，并逐项补前提。
  - 表格 + 离策略一句补"每个状态-动作对无限次访问 + 步长条件"；函数逼近 + on-policy 一句补"线性 Φ、满列秩、Robbins–Monro"。
  - 第三句改为"若函数逼近是线性的，可落在第 4.3.4 节定理的范围内；非线性逼近则没有一般结论（见第 4.5.3 节）"。

