issue_id: CH04-PROP-005
chapter: 4
severity: P2
status: 已有依据
title: 第 92 行"两两组合在收敛范围内"的表述比原文的"可以避免不稳定"更强，对非线性逼近不成立
summary: >
  第 92 行写"函数逼近 + 自举但不离策略，同样在收敛范围内"，并在同句给另外两种组合标了
  "有收敛保证"。S&B 的原文措辞是"若三者中任意两个存在、但不是三个，不稳定性可以被避免"
  （instability can be avoided），这是"可以避免"，不是"保证收敛"。而且这三种说法都只在
  特定条件下成立：表格 + 离策略需要无限次访问与步长条件；函数逼近 + on-policy 的定理
  （第 4.3.4 节）明确要求线性 Φ、满列秩与 Robbins–Monro 步长；函数逼近 + 自举若函数逼近是
  非线性的，本章 4.5.3 节自己就说"三条保证同时消失"。把三者并列成"收敛范围内"会抹掉这些前提。

current_text:
  file: content/ch04.md
  lines: "90-92"
  excerpt: >
    第 92 行：表格方法 + 离策略有收敛保证（只要每个状态-动作对被无限次访问）；函数逼近 + on-policy 有收敛保证（第 4.3 节的定理）；函数逼近 + 自举但不离策略，同样在收敛范围内。

sources:
  - key: RLbook2020
    level: S
    role: 原文只说"可以避免不稳定"，没有说两两组合一定收敛
    pdf_page: 286
    printed_page: "§11.3 The Deadly Triad（纸面 p.264）"
    quote: >
      If any two elements of the deadly triad are present, but not all three, then instability
      can be avoided.
  - key: RLbook2020
    level: S
    role: 半梯度方法不能依赖经典 SGD 结论，因此"函数逼近 + 自举"不自动带来收敛
    pdf_page: 258
    printed_page: "§9.12 Summary（纸面 p.236）"
    quote: >
      As such, they cannot rely on classical SGD results.

