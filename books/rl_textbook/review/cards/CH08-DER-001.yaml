issue_id: CH08-DER-001
chapter: 8
severity: P1
status: 已有依据
title: 定理 8.2 的证明梗概把 Σ tε·T 错算成 T²ε（实际是 εT²(T+1)/2）
summary: >
  8.4.1 节按"首次犯错时刻"分解复合误差，写出
  ≤ Σ_{t=1}^{T} Pr(首次犯错=t)·(T−t) ≤ Σ tε·T = T²ε。
  前两步成立，但最后一步的等号不成立：Σ_{t=1}^{T} tε·T = εT·T(T+1)/2
  = εT²(T+1)/2，是 T³ 量级，比主张的 T²ε 大 (T+1)/2 倍（T=56、ε=0.1 时
  8937.6 对 313.6）。结论 T²ε 本身成立，但必须换一条链：按"每步是否出错"
  求和，Pr(第 t 步出错) ≤ tε，于是总损失 ≤ εT(T+1)/2 ≤ T²ε（T≥1）。
  同节第 249 行还把图 8-4 的实测（T=56 时后悔值 47.6）说成"与二次界形状一致"，
  实测 log-log 斜率约 1.3（T≥16 为 1.27、全程约 1.37），应写成"慢于二次上界"。

current_text:
  file: content/ch08.md
  lines: "243-251"
  excerpt: >
    **证明梗概.** 把回合按"第一次犯错"的时刻 \(t\) 分解……于是
    \[J(\pi^{\star})-J(\hat\pi)\le\sum_{t=1}^{T}\Pr(\text{在 }t\text{ 首次犯错})\cdot(T-t)
    \le\sum_{t=1}^{T}t\varepsilon\cdot T=T^{2}\varepsilon .\]

sources:
  - key: 2005.01643_offline-rl-tutorial
    level: C
    role: 旁证——离线模仿学习的误差界"至多二次于时间步、在线为线性"，即二次方来自误差累积
    pdf_page: 10
    printed_page: "§2.6"
    quote: >
      This means that, even with optimal action labels, we get an error bound that is
      at best quadratic in the time horizon H in the offline case, but linear in H in the
      online case. Intuitively, the reason for this gap in performance is that, in the
      offline case, the learned policy π(a|s) may enter into states that are far outside
      of its training distribution
    note: >
      该段引的是 Ross et al. (2011) 的 Theorem 3.2，可用于"二次方"的定性归属；
      它没有给出常数形式，因此本卡的算术部分以推导文件为证据，不靠这条引文。

  - key: 1011.0686_dagger
    level: S
    role: 一手出处——行为克隆（supervised 模仿）的误差确实按 T² 增长，正文的结论常数由此而来
    pdf_page: 3
    printed_page: "§2.1"
    quote: >
      Ross and Bagnell (2010) provided an imitation learning example where J(ˆπsup) =
      (1 −ϵT)J(π∗) + T 2ϵ. Hence the traditional supervised learning approach has poor
      performance guarantees due to the quadratic growth in T.
    note: >
      这条给的是"存在一个例子使误差按 T²ε 增长"，与我们证明的上界同阶；
      它不支持正文那条错的求和链（那一步的算术问题见 c2）。
