planned_fix:
  - 第 241–245 行删掉 \((T-t)\) 因子与随之的 \(t\varepsilon\cdot T\)，改成"按每步是否出错求和"：\(\sum_t\Pr(\text{第 }t\text{ 步出错})\le\sum_t t\varepsilon=\varepsilon T(T+1)/2\le T^{2}\varepsilon\)，并在行内注明最后一步用了 \((T+1)/2\le T\)（\(T\ge1\)）。
  - 若保留"首次犯错"分解，则必须写成 \(\le\sum_t\Pr(\text{首次犯错}=t)(T-t)\le\sum_t t\varepsilon\cdot T=\varepsilon T^{2}(T+1)/2\)，再说明"这比 \(T^{2}\varepsilon\) 大 \((T+1)/2\) 倍，故改用逐步求和"——不能保留那个错误的等号。
  - 第 249 行把"累计损失随 \(T\) 二次增长，与界 (8.14) 的形状一致"改成"实测增长慢于界给出的二次上界（log-log 斜率约 1.3，T=56 时 47.6 对 313.6）"，并把 \(T^{2}\varepsilon\) 明确标为上界而非预期值。
  - 同步检查习题：若某题要求"用 (8.14) 估算长回合的误差"，答案里不能复用这条错误的求和链。

