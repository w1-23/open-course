issue_id: CH08-ALG-002
chapter: 8
severity: P2
status: 已有依据
title: BCQ 的扰动被写成"只在支持集内部移动"，漏掉 Φ 控制的约束区间与两个极限
summary: >
  8.2.2 节说 BCQ"不让贪婪操作看到数据外动作"（第 93 行）、扰动让 argmax"能在
  **支持集内部**平滑移动"（第 102 行）。原文的意思是候选动作可以在 \(-\Phi\le\xi\le\Phi\)
  的**约束区间**内移动——即支持集"附近"，既不严格在内部，也不是"完全不能取新动作"；
  Φ 与采样数 n 决定了它离数据集有多远。原文还给出两个端点作为语义标定：Φ=0 且 n=1 时
  算法退化为行为克隆，Φ→动作区间全长且 n→∞ 时退化为 Q-learning。正文既没写这个
  "附近由 Φ 界定"，也没写端点，读者容易把 BCQ 理解成"只能复制数据动作"。

current_text:
  file: content/ch08.md
  lines: "93; 102; 185"
  excerpt: >
    第 102 行：扰动把候选集合略微"撑开"，让 \(\arg\max\) 能在支持集内部平滑移动，
    而不是被钉死在数据点上。扰动幅度需要裁剪，否则会把候选推出支持集……

sources:
  - key: 1812.02900_bcq
    level: S
    role: 扰动的定义与"约束区域"（constrained region）这一关键措辞
    pdf_page: 6
    printed_page: "§4.1 Eq.(11)"
    quote: >
      To increase the diversity of seen actions, we introduce a perturbation model
      ξφ(s, a, Φ), which outputs an adjustment to an action a in the range [−Φ, Φ].
      This enables access to actions in a constrained region, without having to sample
      from the generative model a prohibitive number of times.
    note: >
      "constrained region" 而不是 "support"：区间由 Φ 给出，可以略微越出数据集流形，
      这正是 BCQ 能比纯模仿好一点点的来源。
  - key: 1812.02900_bcq
    level: S
    role: 两个极限情形，用来标定"约束的松紧"如何连续地连接 BC 与 Q-learning
    pdf_page: 6
    printed_page: "§4.1"
    quote: >
      Φ = 0, and the number of sampled actions n = 1, then the policy resembles behavioral
      cloning and as Φ →amax−amin and n →∞, then the algorithm approaches Q-learning, as
      the policy begins to greedily maximize the value function over the entire action space.
    note: >
      因此"BCQ 只在支持集内取动作"只是 Φ 很小、n 有限时的近似；把它当成定义会掩盖
      超参数 Φ、n 的作用，而这两者恰是 BCQ 最敏感的两个旋钮。

