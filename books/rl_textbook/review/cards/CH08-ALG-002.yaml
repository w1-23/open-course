claims:
  - id: c1
    text: BCQ 的候选动作在 \(-\Phi\le\xi\le\Phi\) 的约束区间内，而不是严格落在支持集内部。
    evidence: 1812.02900_bcq p.6 的扰动模型定义与 "constrained region" 措辞
    status: 已核对
  - id: c2
    text: Φ=0 且 n=1 时退化为行为克隆，Φ 取满动作区间且 n→∞ 时退化为 Q-learning。
    evidence: 1812.02900_bcq p.6 的端点讨论
    status: 已核对
  - id: c3
    text: 正文第 102 行"在支持集内部平滑移动"与原文不符，第 93 行"不让贪婪操作看到数据外动作"也需要加"附近"的限定。
    evidence: 1812.02900_bcq p.6；对照 content/ch08.md 第 93、102 行原文
    status: 已核对

planned_fix:
  - 第 93 行改成"不让贪婪操作在**远离数据**的动作上做选择"，并补一句"严格说是把它限制在数据集附近，'附近'的宽度由扰动的裁剪阈值 Φ 决定"。
  - 第 102 行"能在支持集内部平滑移动"改为"能在支持集附近平滑移动（幅度由 Φ 裁剪）"，后一句"否则会把候选推出支持集"相应改为"否则会把候选推出约束区间，BCQ 退化为普通 actor-critic"。
  - 表 8-1 的 BCQ 行"典型失效模式"补上端点：Φ→0 退化为模仿、Φ 过大或 n 过大退化为 Q-learning（此时外推误差重新出现）。
  - 8.2.2 节末尾补一句工程提醒：Φ 与 n 是 BCQ 最敏感的两个超参数，且都无法从数据直接验证——这一点与第 189 行"生成模型覆盖范围无法验证"的说法一致，可合并叙述。

