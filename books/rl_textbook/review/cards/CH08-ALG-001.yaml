issue_id: CH08-ALG-001
chapter: 8
severity: P1
status: 已有依据
title: IQL 的 expectile 被四处写成"分位数"，与式 (8.8) 的平方损失自相矛盾
summary: >
  正文第 148 行"用期望回归把价值函数学成一个数据内的高分位数"、第 279 行"改用惩罚或
  分位数"、第 400 行"用期望回归在数据内拟合高分位数"、第 473 行"优化的是数据内的分位数"
  ——四处把 expectile 叫成 quantile。式 (8.8) 用的是 \(|\tau-\mathbb{1}\{u<0\}|u^{2}\)
  （非对称平方损失），这正是 IQL 原文 p.4 给出的 expectile 定义；quantile 回归用的是
  非对称绝对值 (\(\ell_1\)) 损失，两者不是同一个统计量。在两点分布 {0,1} 上，
  0.9-expectile = 0.9，而 0.9-分位数 = 1：把 IQL 说成"学高分位数"会让读者以为
  \(\tau=0.9\) 已经取到数据内最大值，实际要 \(\tau\to1\) 才逼近（第 157 行的说法反而是对的）。

current_text:
  file: content/ch08.md
  lines: "148; 159; 281; 404; 477"
  excerpt: >
    第 148 行：于是 IQL 用期望回归（expectile regression）把价值函数学成一个**数据内的高分位数**，替掉最大值：
    第 473 行：注意它优化的是数据内的分位数，不是最优价值。

sources:
  - key: 2110.06169_iql
    level: S
    role: expectile 的定义与非对称平方损失
    pdf_page: 4
    printed_page: "§4.1 Eq.(6)"
    quote: >
      The τ ∈ (0, 1) expectile of some random variable X is defined as a solution to the
      asymmetric least squares problem: arg min mτ Ex∼X[Lτ 2(x − mτ)], where Lτ 2(u) =
      |τ − 1(u < 0)|u2.
    note: >
      同页随后写 "Expectile regression is closely related to quantile regression …
      The quantile regression loss is defined as an asymmetric ℓ1 loss."，可作
      "两者只差损失幂次"的直接依据。
  - key: 2110.06169_iql
    level: S
    role: τ 的两种极限（均值 / 数据内最大值），用于说明它不可能是"分位数"
    pdf_page: 5
    printed_page: "§4.3"
    quote: >
      τ = 0.5 correspond to the conditional mean statistics of the distribution, while
      τ ≈ 1 approximates the maximum operator over in-support values of y.
    note: 正文第 157 行写的正是这一条，因此正文内部就存在"高期望值"与"高分位数"两种互相矛盾的称谓。
  - key: 2110.06169_iql
    level: S
    role: 强调 IQL 不估计价值分布——这从侧面否定"分位数"读法
    pdf_page: 3
    printed_page: "§3 related work"
    quote: >
      our aim is not to estimate the distribution of values that results from stochastic
      transitions, but rather estimate expectiles of the state value function with respect
      to random actions.
    note: 若它真是"分位数"，就必须先有（或隐式构造）价值分布；IQL 的卖点恰恰相反。

