planned_fix:
  - 第 148 行"学成一个数据内的高分位数"改为"学成一个数据内的高期望值（upper expectile）"，并在括号里保留英文术语。
  - 第 279 行"改用惩罚或分位数把不确定性吸收进价值估计"改为"改用惩罚或上期望值把不确定性吸收进价值估计"。
  - 第 400 行"用期望回归在数据内拟合高分位数"改为"用期望回归在数据内拟合上期望值"。
  - 第 473 行"注意它优化的是数据内的分位数，不是最优价值"改为"注意它优化的是数据内的上期望值（expectile），不是最优价值"。
  - 在 8.2.4 节式 (8.8) 之后补一句方法论备注：expectile 用平方损失、quantile 用绝对值损失；τ=0.5 给均值、τ→1 给数据内最大值，两点分布 {0,1} 上分别给出 0.9 与 1。

