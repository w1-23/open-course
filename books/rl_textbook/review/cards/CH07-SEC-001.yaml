  - key: RLbook2020
    level: S
    role: 本章 `:20` 所用"搜索控制"一词的原始定义，只指背景规划里挑起点状态这一环节
    pdf_page: 185
    printed_page: "§8.2，纸面 p.163"
    quote: >
      We use the term search control to refer to the process that selects the starting states
      and actions for the simulated experiences generated by the model.

derivation_file: review/derivations/CH07-SEC-001.md
reproduction_file: null
reproduction_result:
  note: >
    本条是概念分层问题，不需要数值实验。若要自检，可用 §7.1.2 的迷宫实验做一次对照：
    固定真实交互预算，把"每步 n 次后台更新"与"每步 n 次树搜索"的达标回合数比一比——
    前者会随 n 单调改善并保存结果，后者只在当前决策上生效，二者不应被当成同一变量。

claims:
  - id: c1
    text: 本章 `:20` 的"搜索控制"用法与 S&B p.185 定义一致，不是错误用法。
    evidence: RLbook2020 p.185 原文（search control 指挑选模拟经验的起点状态与动作）；推导第 2 节
    status: 已核对
  - id: c2
    text: 全章未出现"背景规划/决策时规划"的命名与二分，读者无法判断两个"搜索"不是同一件事。
    evidence: RLbook2020 p.203 给出两条命名（background / decision-time）；推导第 2 节逐处核对 ch07 用语
    status: 已核对
  - id: c3
    text: 两类规划的输出物不同（价值/策略 vs 单个动作），因此 §7.5 的成本判据"模拟次数×单次前向"只适用于决策时规划。
    evidence: 推导第 1 节的对照表与第 3 节的判据错位分析
    status: 已核对
  - id: c4
    text: 修法只需在 §7.1.1 末与 §7.4 开篇各加一句、并在图 7-1 图注补半句，不涉及任何公式或编号。
    evidence: 推导第 4 节给出的三处落点
    status: 已核对

planned_fix:
  - 在 `:22` 末补一句：Dyna 这种"持续用模拟经验改进价值与策略并保存"的规划叫**背景规划**，与第 7.4 节的**决策时规划**相对，区别在输出物：前者输出可复用的价值/策略，后者只输出当前动作。
  - 在 §7.4 开篇 `:175` 前补一句：树搜索是决策时规划的一种；它与 7.1 节的"搜索控制"不是同一件事——后者是背景规划里挑起点状态的环节，不产生针对当前状态的即时决策。
  - 图 7-1 的图注补半句"图中 `搜索控制` 指挑起点状态，不指第 7.4 节的树搜索"，避免与图 7-5 的"搜索"在页面上直接冲突。
