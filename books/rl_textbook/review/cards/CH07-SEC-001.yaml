issue_id: CH07-SEC-001
chapter: 7
severity: P1
status: 已有依据
title: 背景规划与决策时规划没有分开，"搜索控制"与树搜索共用"搜索"一词
summary: >
  本章 `:20` 用"搜索控制"指"规划从已访问的状态-动作对里抽样"，与 S&B p.185 的定义一致，
  用法本身没错；`:8` 与 `:175` 把 MCTS 也归到"规划"名下，方向也对。问题在全章没有给出
  S&B §8.8 的二分：背景规划（持续更新价值/策略并保存）与决策时规划（针对当前状态、输出
  单个动作、中间量丢弃）。于是 §7.1 的"搜索控制"（背景规划内部的一个环节）与 §7.4 的
  "搜索"（决策时规划）在读者眼里连成同一件事，第 7.5 节据此写出的成本判据（模拟次数×
  单次前向）也只对后者成立，混用会让"该不该为模型付代价"的判断错位。

current_text:
  file: content/ch07.md
  lines: "8, 20, 171-175"
  excerpt: >
    第 20 行：第二是**搜索控制**：规划要从已访问的状态-动作对里抽样，抽样分布决定了计算花在哪里
    第 8 行：第 7.4 节把规划推到极致：在博弈树上做搜索，直到 AlphaZero 与 MuZero。
    第 175 行：蒙特卡洛树搜索解决的是"给定当前状态，把有限的计算花在哪条分支上"。

