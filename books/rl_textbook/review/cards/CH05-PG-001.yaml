  - "全书记号统一（需 lead 决策）：把第 2 章式 (2.8) 的符号改成 d̄^π_γ，或在第 2 章该式后加脚注'第 5 章将区分归一化与未归一化版本'，避免跨章同名不同义。"
  - "在「关键公式」一节并列式 (5.6) 与式 (5.7) 处加半行提示：'两式差 1/(1−γ)，不是两个不同的目标'，与正文第 50 行呼应。"

