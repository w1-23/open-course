    text: 式 (5.5) 说未归一化 d^π_γ 的总质量是 1/(1−γ)，这在几何折扣下正确。
    evidence: 由 Σ_{t≥0}γ^t=1/(1−γ) 直接求和，见 derivation_file 第 1 节；并有 1502.05477_trpo p.2 的 unnormalized 定义作旁证
    status: 已核对
  - id: c2
    text: 式 (5.6) 与式 (5.7) 严格相等，差且只差 1/(1−γ)。
    evidence: derivation_file 第 2 节逐项化简；1502.05477_trpo p.4 出现同一换算式
    status: 已核对
  - id: c3
    text: 本章 5.1 节内部没有混用两种写法而不加说明。
    evidence: 逐处核对 content/ch05.md 第 50–90 行（式 5.5/5.6/5.7/5.8 与第 61 行说明）；换算关系见 derivation_file 第 1、2 节
    status: 已核对
  - id: c4
    text: 第 2 章式 (2.8) 用 d^π_γ 指归一化分布，与本章同名不同义，属跨章记号冲突。
    evidence: content/ch02.md 式 (2.8) 与本章第 61 行的对照；本章已点明但未统一
    status: 已核对

