issue_id: CH05-PG-001
chapter: 5
severity: P1
status: 已有依据
title: 占用测度在两套归一化记号间切换——本章自洽，但与第 2 章同名不同义
summary: >
  5.1 节把未归一化占用测度 d^π_γ 明确定义为总质量 1/(1−γ)（式 5.5），并给出
  归一化版本 d̄=(1−γ)d 与带 1/(1−γ) 因子的等价式 (5.7)，正文用整段篇幅警告
  "混用会直接错掉一个 1/(1−γ) 的尺度"，全章没有出现同一节内两种写法混用而不
  说明的情况——本条判定为**本章无误**。真正的问题在跨章：第 2 章式 (2.8) 用同一个
  符号 d^π_γ 表示**归一化**分布（总质量 1），与本章同名不同义。读者若按第 2 章的
  记忆套用 5.1 节的公式，会漏掉 1/(1−γ)。本章第 61 行已经点明这一差异（"第 2 章的
  式 (2.8) 用的是归一化版本但仍写作 d^π_γ"），但只在正文一句话里，属需要全书层面
  决策的记号冲突。

current_text:
  file: content/ch05.md
  lines: "50-90"
  excerpt: >
    第 50 行："两种写法是同一个梯度的两副面孔，但它们的**归一化因子不同**，混用会直接错掉一个 1/(1−γ) 的尺度。"
    第 57 行（式 5.5）："∑_s d^π_γ(s) = 1/(1−γ)"
    第 61 行："它的总质量不是 1，而是 1/(1−γ)……归一化版本记作 d̄^π_γ=(1−γ)d^π_γ，它才是一个概率分布。第 2 章的式 (2.8) 用的是归一化版本但仍写作 d^π_γ……"

sources:
  - key: RLbook2020
    level: S
    role: 策略梯度定理的"比例常数"写法，说明 ∝ 的常数正是归一化换算的来源
    pdf_page: 348
    printed_page: "§13.2, p.326"
    quote: >
      The symbol ∝ here means "proportional to". In the episodic case, the constant of
      proportionality is the average length of an episode, and in the continuing case it is 1,
      so that the relationship is actually an equality. The distribution µ here (as in
      Chapters 9 and 10) is the on-policy distribution under π.
    note: >
      抽文把 ∝ 抽成了 "/"，此处按原式转写为 ∝。该书 µ 是**归一化**的 on-policy 分布
      （第 199 页定义），因此"∝"里吸收的正是 1/(1−γ) 这类常数；这解释了为什么换用
      归一化测度必须显式乘回该因子。
  - key: 1502.05477_trpo
    level: S
    role: 原始论文对"未归一化访问频率"的定义，以及把状态求和换成期望时显式出现 1/(1−γ)
    pdf_page: 2
    printed_page: "§3, p.2"
    quote: >
      Let ρπ be the (unnormalized) discounted visitation frequencies
      ρπ(s)=P(s0 = s)+γP(s1 = s)+γ2P(s2 = s)+. . . , where s0 ∼ρ0 and the actions are
      chosen according to π.
    note: >
      原文自己用括号标注 unnormalized，与本章式 (5.5) 的 d^π_γ 同义；这是"未归一化"
      写法在文献中的直接依据。
  - key: 1502.05477_trpo
    level: S
    role: 把 Σ_s ρ_θold 换成期望时补上 1/(1−γ) 的那一步，是本章式 (5.7) 的同一换算
    pdf_page: 4
    printed_page: "§5, p.4"
    quote: >
      We first replace Σs ρθold(s)[. . . ] in the objective by the expectation
      1/(1−γ) Es∼ρθold [. . . ]. Next, we replace the advantage values Aθold by the
      Q-values Qθold in Equation (13), which only changes the objective by a constant.
    note: >
      这一段是"归一化测度 + 1/(1−γ) 因子"写法在原始文献中的出处；可直接用于向读者
      说明本章式 (5.6)/(5.7) 的换算不是自创。

claims:
