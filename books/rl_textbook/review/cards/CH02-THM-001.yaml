issue_id: CH02-THM-001
chapter: 2
severity: P1
status: 已有依据
title: 定理 2.1（贝尔曼期望方程）没写前提，也没标 [精确]
summary: >
  定理 2.1 的陈述是「对任意策略 π，价值函数满足 (2.9)(2.10)」，没有任何前提，
  标题里也缺本章其余定理都有的 [精确] 标注。证明末尾用「只要期望存在」代替了
  真正需要的收敛条件：式 (2.9) 的右端含 V^π(s')，要把无穷级数从求和号里拆出来，
  必须要求该级数绝对收敛或该策略下必然终止。正确前提是 RLbook (4.4) 之后那句
  「γ<1 或该策略下从所有状态必然终止」，而本章只在 2.2.2 与 2.3.3 的旁白里提过
  γ<1，没写进定理。表 2-2 第 374 行「期望存在 / 失效方式：无」是同一缺陷的下游。

current_text:
  file: content/ch02.md
  lines: "144-160"
  excerpt: >
    定理 2.1（贝尔曼期望方程） 对任意策略 π，价值函数满足 …（式 2.9、2.10）…
    证明末句：核心只用到一步分解与条件期望的塔性质，不要求 S 有限——只要期望存在。

sources:
  - key: RLbook2020
    level: S
    role: 贝尔曼期望方程（其式 4.4）之后给出的存在唯一性条件，正是本章定理 2.1 缺的那条
    pdf_page: 96
    printed_page: "§4.1, p.74, 式 (4.4) 之后"
    quote: >
      The existence and uniqueness of v⇡are guaranteed as long as either γ < 1 or
      eventual termination is guaranteed from all states under the policy
    note: >
      该句紧接 (4.4)（即本章式 (2.9) 的求和形式）。注意它说的是 existence and
      uniqueness（存在且唯一），比「方程成立」更强；本章 2.3.2 节自己证明了
      I−γP^π 可逆，却未把这条写回定理 2.1 的陈述。

