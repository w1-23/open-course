planned_fix:
  - 定理 2.1 标题补 [精确]，陈述改为「设 S、A 有限、r 有界，且策略 π 满足 γ<1 或 π 下从所有状态几乎必然终止，则式 (2.9)(2.10) 成立且 V^π 是式 (2.11) 的唯一解」。
  - 证明末句改为「推导只用一步分解与条件期望的塔性质；把级数从求和号中拆出要求绝对收敛，这正是上述前提所保证的（有限状态时 I−γP^π 可逆见 2.3.2 节）」。
  - 表 2-2 第 374 行的「前提」改为「期望有限 +（γ<1 或必然终止）」，「失效方式」改为「γ=1 且不终止时 V^π 可能发散，方程退化为恒真」。
  - 在 2.2.2 节「γ<1 是压缩映射成立的前提」一句后补半句「它同时是式 (2.9) 有唯一解的充分条件之一，另一条是该策略下必然终止」，使读者不必等到 2.3 节才见到条件。

