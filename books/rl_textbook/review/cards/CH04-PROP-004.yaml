reproduction_file: review/reproductions/CH04-PROP-004.py
reproduction_result:
  note: >
    按正文构造 Φ(7×8，秩 7)、P^π 每行为状态 7 的 one-hot、D=uniform、γ=0.99：
    eig(A) = {−0.2393, −0.0222, 0, 0.5714(五重)}；min eig(A) = −0.23925；
    min eig((A+Aᵀ)/2) = −1.020579。即 −1.02 来自对称部分，不是 A 的特征值。
    另注：第二个负特征值复算为 −0.0222，正文写 −0.0218，差 2%，建议按复算值统一。

claims:
  - id: c1
    text: 式 (4.19) 给出的谱与复算一致到 1e-3（−0.2393、0、0.5714 五重），最小特征值是 −0.2393，不是 −1.02。
    evidence: reproduction 的 B 段输出（eig(A) 与 min eig 打印）
    status: 已核对
  - id: c2
    text: −1.02 对应的是对称部分 (A+Aᵀ)/2 的最小特征值 −1.0206，用它能判断"存在 u 使 uᵀAu<0"，但它不是 A 的特征值。
    evidence: reproduction 输出 min eig(sym(A)) = −1.020579
    status: 已核对
  - id: c3
    text: A 非对称时"最小特征值为负"不能直接推出"非正定"，判据是二次型 uᵀAu 变号；正文的括号说明需要改写。
    evidence: reproduction 中 A 的最小特征值 −0.2393 与对称部分 −1.0206 并存，说明两者不是同一个量
    status: 已核对
  - id: c4
    text: 发散速率 1+0.2393α 的算术正确，不受本条影响（复算 α=0.01 时 3000 步放大 1.298e3，与正文 1.3e3 一致）。
    evidence: reproduction 输出 3000-step growth = 1.298e+03
    status: 已核对

planned_fix:
  - 第 286 行括号改为"（更准确地说，A 的对称部分 (A+Aᵀ)/2 的最小特征值为 −1.02，故存在 u 使 uᵀAu<0，A 不正定）"。
  - 第 282 行的第二个特征值按复算改为 −0.0222（或注明四舍五入到 3 位），并说明该谱由脚本 `review/reproductions/CH04-PROP-004.py` 生成。
  - 第 286 行末补一句"这里的'最小特征值'指对称部分；A 本身非对称，其特征值实部为负不等价于二次型变号"。

