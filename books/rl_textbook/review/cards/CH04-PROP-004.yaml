issue_id: CH04-PROP-004
chapter: 4
severity: P2
status: 已有依据
title: Baird 段"最小特征值 −1.02 为负"实为对称部分的最小特征值；A 自身的最小特征值是 −0.2393
summary: >
  第 286 行写"两个负实部特征值说明 A 不是正定的（最小特征值 −1.02 为负）"。这与紧邻的式 (4.19)
  自相矛盾：该式列出的谱最小值是 −0.2393。复算表明 −1.02 是 A 的**对称部分** (A+Aᵀ)/2 的最小
  特征值（−1.0206），而 A 非对称，谈"最小特征值"本就不能直接判定正定性。判据应写成
  "⋀ 的对称部分不正定 ⟺ 存在 u 使 uᵀAu<0"，或者干脆只说"存在负实部特征值"。
  发散论证用的 −0.2393 与 1+0.2393α 的算术本身正确，不受影响。

