    evidence: 2305.18290_dpo p.4；content/ch10.md 第 105 行
    status: 已核对
  - id: c2
    text: >
      第 391 行"配分函数不可算"是过强表述，与 105 行及 DPO 原文"expensive to estimate"
      冲突；正确说法是"难以直接精确求和，且采样估计方差过大"。
    evidence: 2305.18290_dpo p.4 原句；推导：对有限奖励与 β>0，Z(x)=Σ_y π_ref exp(r/β) 是有限正数
    status: 已核对
  - id: c3
    text: 该措辞不影响 10.3 的推导（(10.9) 只用 Z(x) 存在且只依赖 x 这一性质）。
    evidence: 式 (10.9)、(10.10)
    status: 已核对

