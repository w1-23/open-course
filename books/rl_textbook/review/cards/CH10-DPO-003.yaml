issue_id: CH10-DPO-003
chapter: 10
severity: P1
status: 已有依据
title: 小结把"配分函数不可算"当结论——应写成"输出空间巨大、难以直接精确求和"
summary: >
  第 105 行写得准确："Z(x) 要对全部可能的回答求和，而语言模型的输出空间是指数大的；
  即使用重要性采样去估，估计的方差在长序列上也不可接受"——这是"工程上不可直接用"，
  不是"原理上不可计算"。但小结第 391 行把它压成"闭式解里的配分函数**不可算**"，越过了
  原文的表述：DPO 原文只说估计 Z(x)"仍然很贵（expensive）"、使这一表示"难以在实践中
  利用"。Z(x) 对有限奖励、给定 β 是有限正数，本身可写、可估，只是代价高。这个措辞直接
  影响读者对"DPO 为什么存在"的理解：消掉 Z 是为了省代价，不是因为 Z 不存在。

current_text:
  file: content/ch10.md
  lines: "103-107, 389-393"
  excerpt: >
    第 105 行：Z(x) 要对全部可能的回答求和，而语言模型的输出空间是指数大的；即使用重要性
    采样去估，估计的方差在长序列上也不可接受。
    第 391 行：第二，KL 正则目标有闭式最优解，但闭式解里的配分函数不可算。这个"有解却算不动"
    的困境是本章所有方法的共同起点……

