title: 第 145 行的 Gibbs 最优解缺三个前提（逐上下文、参考策略全支撑、配分函数有限），第 10 章写了而第 0 章没写
summary: >
  第 145 行写："在目标 max_π E_π[r] − β_KL D_KL(π‖π_ref) 下，最优解是 π* ∝ π_ref exp(r/β_KL)"。
  这句话要成立，至少需要三件事：(a) 目标对每个上下文 x 分别成立，π 在该上下文上取遍所有分布；
  (b) π_ref 对同一上下文的所有动作有正支撑，否则最优解在支撑外不可定义；(c) 配分函数
  Z(x)=Σ_a π_ref exp(r/β_KL) 有限且为正——有限动作用集合上 (c) 自动成立，但第 0 章紧接着就要
  在第 10 章把它用在语言模型（十万量级词表、序列级乘积）上，那里的 Z(x) 是否可求和正是全章的
  困难起点。第 10 章命题 10.1 与 (10.6) 把这三条都写了，第 13prep 章 (P.4) 也在 L88 补了定义；
  唯独第 0 章——读者第一次见到这个结论的地方——一句没写，只留了一个游离的 "∝"。
  修法很轻：在句末加一个括注即可，不必重写段落。
  另注：同一行"β_KL 本身是这一族的温度"与第 13prep 章注框（ch13prep:92-94，称这是"常见误读"）
  互相矛盾，那一处已记在 review/math_review/CH13PREP.md 缺陷 3，本条不重复计入。

