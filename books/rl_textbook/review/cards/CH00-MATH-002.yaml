claims:
  - id: c1
    text: >
      (0.4) 之后的这句是"逐上下文"的结论：把 λ 乘子按上下文分别解，才得到 π* ∝ π_ref exp(r/β)；
      全局目标是各上下文之和，因此最优解在每个上下文上分别取 Gibbs 形式，第 0 章没有交代这一层。
    evidence: 推导：对每个 x 单独做带归一化约束的变分，乘子由 Σ_y π*=1 定出；见 content/ch10.md 命题 10.1
    status: 已核对
  - id: c2
    text: >
      缺少"π_ref 全支撑"时，分母 π_ref(a|s) 出现在 π* 的表达式里却可能为 0，π* 在该动作上不可定义；
      第 10 章 (10.6) 与第 13prep 章 L88 都把这一点写出来了。
    evidence: 推导：π*(y|x)=(1/Z)π_ref(y|x)exp(r/β)，支撑外 π_ref=0 ⇒ π*=0，但 KL 项同时发散
    status: 已核对
  - id: c3
    text: >
      配分函数 Z(x) 有限且为正是"最优解存在且可归一化"的前提；在语言模型上这正是全章困难的来源
      （第 10 章 (10.6) 之后一整段在讲 Z(x) 求不动），第 0 章不写会读者以为 exp(r/β) 天然可归一化。
    evidence: 推导：content/ch10.md 中 Z(x) 的有限性讨论；2305.18290_dpo p.15 说明 Z 只依赖 x
    status: 已核对

