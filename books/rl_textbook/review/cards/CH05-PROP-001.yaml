title: 式 (5.13) 漏掉 γ^t，与式 (5.11)、算法 5-1 第 6 行及 S&B (13.11) 都不一致
summary: 式 (5.13) 写 E[(G_t − V_φ(s_t))∇log π] = ∇J(θ)，左边既没有 γ^t 也没有对 t 的求和。本章式 (5.11)、式 (5.9) 与算法 5-1
  第 6 行都保留 γ^t，5.1.2 节还强调“γ^t 不能省”。按式 (5.11)，正确写法是 γ^t·E[(G_t − b(s_t))∇log π]；它只是第 t 步的贡献，不是 ∇J。结论（无偏）不受影响，但等式本身不成立，且与本章反复强调的
  γ^t 记号自相矛盾。
