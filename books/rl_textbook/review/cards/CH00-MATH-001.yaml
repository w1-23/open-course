issue_id: CH00-MATH-001
chapter: 0
severity: P1
status: 已有依据
title: 第 87 行把"γ<1 时的 γ^k 速率"写成"值迭代以 γ^k 速度收敛"，前提被压掉，而本章全部论点就是"前提决定结论"
summary: >
  第 87 行用第 1–3 章举例说明"这一层什么都能证"，写的是「值迭代以 \(\gamma^k\) 速度收敛到 \(V^*\)」。
  这个速率来自 T^* 的压缩性 ‖T^*V_1 − T^*V_2‖∞ ≤ γ‖V_1 − V_2‖∞，需要 γ<1；若 γ=1，算子只非扩张，
  值迭代的收敛不再有几何速率。本书第 2 章自己把这一点写得很清楚（"压缩性完全来自 γ<1……若 γ=1，
  式 (2.15) 退化为非扩张"，content/ch02.md:228），第 0 章却在全书第一个"能严格证明"的例子里省掉了它。
  同一句还隐含"奖励有界"，否则 V* 的 ∞-范数本身无界、速率无从谈起。
  这不是可有可无的补语：第 0 章第 0.4 节的全部功能就是给读者一把尺子，让他看见"结论依赖前提"；
  在最显眼的示范句里漏一个前提，等于把这把尺子第一次使用时就读错刻度。
  正确写法只需补一个括号："值迭代以 γ^k 速度收敛到 V^*（要求 γ<1 且奖励有界）"。

