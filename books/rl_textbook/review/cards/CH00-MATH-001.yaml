claims:
  - id: c1
    text: >
      值迭代的 γ^k 速率来自压缩性，而压缩性要求 γ<1；第 2 章命题 2.1 与 L228 已明写这一点，
      因此第 0 章 L87 的表述与本书自己的定理条件不一致。
    evidence: 推导：‖T^*V_1−T^*V_2‖∞ ≤ γ‖V_1−V_2‖∞ ⇒ ‖V_k−V^*‖∞ ≤ γ^k‖V_0−V^*‖∞；γ=1 时该步只剩非扩张；见 content/ch02.md:204-213 与 content/ch02.md:228
    status: 已核对
  - id: c2
    text: >
      速率还要求奖励有界（|r|≤r_max），否则 V^* 的 ∞-范数无界，γ^k‖V_0−V^*‖∞ 不构成有限误差界。
    evidence: 推导：|G_t| ≤ r_max/(1−γ)，见 content/ch02.md:93 的数值作用说明
    status: 已核对
  - id: c3
    text: >
      第 0 章自己规定"没有标签的断言默认是[精确]，但前提必须写在同一页上"（L106），L87 既无标签也
      未写前提，违反本章自设的规矩。
    evidence: 推导：content/ch00.md:106 与 L87 对照
    status: 已核对

