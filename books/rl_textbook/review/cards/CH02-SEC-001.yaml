claims:
  - id: c1
    text: 贝尔曼误差是逐状态向量 (T^πV)(s)−V(s)，即 TD 误差的期望，不是范数。
    evidence: RLbook2020 p.290 式 (11.17)(11.18) 及「expectation of the TD error」一句
    status: 已核对
  - id: c2
    text: MSBE/BE 是贝尔曼误差向量的 µ-加权平方范数，书中「某种范数」的说法不准确。
    evidence: RLbook2020 p.290 式 (11.19) 与第 11.3 图的三目标（VE/BE/PBE）
    status: 已核对
  - id: c3
    text: 书中 MSPBE 的定义与 RLbook 的 PBE(w)=‖Π¯δw‖²_µ 等价，无需改动。
    evidence: 推导：Π_D²=Π_D 且 Π_D v_θ=v_θ，见 derivation_file 第 3 节对照表
    status: 已核对
  - id: c4
    text: 框内 (b) 未点名 DQN，也未写明采样平方 TD 损失与 MSBE 的两处机制差异。
    evidence: derivation_file 第 4 节的等式链与三处差异（先平方后期望、缺投影、目标非平稳）
    status: 已核对

planned_fix:
  - 把 :304 第一句拆成三条并列定义：贝尔曼误差向量 δ̄=(T^πV)−V（逐状态、未平方）；MSBE=‖δ̄‖²_D=E_{s∼D}[δ̄(s)²]（平方 + 加权，权重必须写明）；MSPBE 保持现状。
  - 删除「记作 MSBE」对贝尔曼残差的误挂，改为「贝尔曼残差在文献中有两种用法：逐状态量 δ̄，或其投影/加权的平方范数；本章一律按逐状态量理解，凡用范数处必须写出平方与权重」。
  - 在框内 (b) 之后补一句点名：「DQN 类方法实际最小化的是 E_{s∼D}[(r+γmax_{a'}Q_{θ̄}(s',a')−Q_θ(s,a))²]，它是采样平方 TD 误差，既不是 MSBE（没有对 P 取期望）也不是 MSPBE（没有投影）」。
  - 把 (b) 的等式链补进正文一句话：E[δ²]=(Eδ)²+Var(δ|s)，说明采样损失为何在无噪声时才等于 MSBE。

