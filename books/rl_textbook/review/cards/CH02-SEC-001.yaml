issue_id: CH02-SEC-001
chapter: 2
severity: P2
status: 已有依据
title: 警告框把 MSBE 写成「某种范数」，且没点名 DQN 优化的是采样平方 TD 误差
summary: >
  2.4.2 节警告框（:301-307）要区分三个贝尔曼量，方向正确，但定义有两处不准确：
  其一，把「贝尔曼残差（记作 MSBE）」写成「‖V−T^πV‖ 的某种范数」，而 MSBE 在
  文献里是贝尔曼误差向量的 D-加权**平方**范数，未平方的逐状态量叫贝尔曼误差
  （TD 误差的期望），三者被同一个缩写串成两个；其二，框内 (b) 只说「训练损失是
  采样平方 TD 误差」，没有点名 DQN，也没写出它与 MSBE 的两处机制差异（先平方后期望
  带来的方差项、以及缺投影）。两处都是读者按字面引用时会被误导的地方。

current_text:
  file: content/ch02.md
  lines: "301-307"
  excerpt: >
    **贝尔曼残差**（Bellman residual，记作 MSBE）是 ‖V−T^π V‖ 的某种范数，衡量 V
    离 T^π 不动点多远；**均方投影贝尔曼误差**（MSPBE）是 ‖Π_D T^π v_θ−v_θ‖²_D …

sources:
  - key: RLbook2020
    level: S
    role: 贝尔曼误差（逐状态、TD 误差的期望）与 MSBE（加权平方范数）的原始定义
    pdf_page: 290
    printed_page: "§11.4, p.268, 式 (11.17)-(11.19)"
    quote: >
      The vector of all the Bellman errors, at all states, ¯δw 2 R|S|, is called the
      Bellman error vector (shown as BE in Figure 11.3). The overall size of this vector,
      in the norm, is an overall measure of the error in the value function, called the
      mean square Bellman error
    note: >
      同页前文给出 ¯δw(s) = (T^π v_w)(s) − v_w(s)（11.17）并写明「The Bellman error is
      the expectation of the TD error」；MSBE 的定义式是 ‖¯δw‖²_µ（11.19），有平方、
      有权重。书中警告框的「某种范数」与这两点都不符。
  - key: RLbook2020
    level: S
    role: 均方投影贝尔曼误差（PBE）的定义，用于确认书中 MSPBE 一项是对的
    pdf_page: 291
    printed_page: "§11.4, p.269, 式 (11.22)"
    quote: >
      This is the projected Bellman error vector ⇧¯δw, shown in Figure 11.3 as PBE. The
      size of this vector, in the norm, is another measure of error in the approximate
      value function.
    note: >
      PBE(w)=‖Π¯δw‖²_µ（11.22），与书中 ‖Π_D T^π v_θ−v_θ‖²_D 等价（Π_D²=Π_D、
      Π_D v_θ=v_θ），故 MSPBE 一项无需修改。

