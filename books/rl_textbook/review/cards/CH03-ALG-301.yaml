  conclusion: >
    错误写法每轮评估只扫 1 次（总数 12 = 12 轮 × 1 次），且最终 V 与 V^π 相差 0.31；
    因为它近似退化为"单次备份 + 立即改进"，策略可能仍最优，所以只看策略发现不了。

