title: 算法 3-1 先赋值后算差，收敛判据恒为真，评估永远只扫一遍
summary: >
  算法 3-1 第 6 行 `V(s) ← v；Δ ← max(Δ, |v - V(s)|)` 在赋值之后才计算差值，
  赋值使 |v − V(s)| 恒为 0，于是 Δ ≡ 0、评估阶段每次只做 1 次扫描，
  返回的 V 不是 V^π。S&B 的写法是先用副本 v 存旧值、更新后再用 v 求差。
  数值复现显示：书中写法 12 轮 × 1 次扫描、V(0,0) = −0.040；
  正确写法 8 轮、共 723 次扫描、V(0,0) = 0.270。

