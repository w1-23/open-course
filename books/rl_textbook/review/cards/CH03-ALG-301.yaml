planned_fix:
  - 算法 3-1 第 6 行改为两行或调换顺序：`Δ ← max(Δ, |v - V(s)|)；V(s) ← v`。
  - 第 44 行把"评估到足够准"改为"评估到 Δ < θ"，并注明这是截断评估而非精确评估，与 3.1.3 的 m 次扫描口径对齐。
  - 第 42 行的扫描次数公式补一句前提："该式只在 Δ 用旧值计算、阈值按 sup-norm 解释时成立"。
  - 若 3.1.3 的值迭代伪代码复用同一段 Delta 逻辑，需一并核对（值迭代的 Δ 应比较同一状态更新前后）。
  - 习题中若有"实现策略迭代并验证收敛"的题，需在答案里明确 Δ 的两种写法会导致不同结果。

