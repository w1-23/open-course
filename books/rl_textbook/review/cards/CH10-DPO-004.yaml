  且为正、偏好服从 BT 或其可扩展版本、同一 prompt 内比较、有限数据只是经验近似）。但
  本章小结第 393 行写成"它依赖 KL 正则目标、Bradley–Terry 偏好、同一 prompt 内比较、
  参考策略全支撑、β_KL 为正这五个前提"：漏了 Z(x) 有限与有限数据两条；同时第 254 行
  说第七条"不是推导的漏洞，而是所有经验风险最小化的共同处境"，第 393 行却把它排除在
  "精确性的范围"之外，两处口径不一致。读者按小结复述时会漏掉两条前提。

