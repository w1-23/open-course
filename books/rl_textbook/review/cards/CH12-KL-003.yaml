issue_id: CH12-KL-003
chapter: 12
severity: P2
status: 已有依据
title: KL 正则被说成 EWC 的"语言模型版"，回放"通常是最有效的单招"未标强度也未给引用
summary: >
  12.4.2 在两段里各有一处不加限定的断言。第一处：把第 10.2 节的 KL 正则说成 EWC
  "这个思路的语言模型版"——两者确有共同直觉（都在目标里加一个"离旧解不要太远"的惩罚），
  但作用空间不同：EWC 惩罚在参数空间（Fisher 加权的参数距离），KL 惩罚在输出分布
  （对参考策略的散度）；这是类比，不是等价，正文的"语言模型版"容易被读成推导关系。
  第二处："回放通常是最有效的单招"是一般性经验断言，既没有标 `[经验规律]`，也没有给
  任何引用或条件（缓冲区多大、任务多相似）。12.4.5 第 318 行已经示范了正确写法
  （明确标注 `[经验规律]` 并说明只在小回归序列上成立），本节应当对齐。

