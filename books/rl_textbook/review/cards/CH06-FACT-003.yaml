title: 过估计上界 γε(m−1)/(m+1) 被当成一般结论，丢了"误差在 [−ε,ε] 上均匀分布"这个前提
summary: 第 77 行写"Thrun 与 Schwartz 给出的上界是 \(\gamma\epsilon(m-1)/(m+1)\)"，紧接着用"动作越多、估计噪声越大，过估计越严重"来解释它。原文的前提是"action values contain random errors uniformly distributed in an interval [−ε, ε]"——这个界只对均匀分布的误差成立，ε
  是误差区间的半宽，不是高斯标准差。而本章 6.2.1 前半段与图 6-2 用的都是独立高斯噪声，读者会把该界当成高斯情形的公式、把 ε 当成 σ。高斯情形下过估计的增长量级是 \(\sigma\sqrt{\log m}\)（本章习题 1 自己要求证明），与均匀情形的 (m−1)/(m+1) 不是同一个式子。
