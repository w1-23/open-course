claims:
  - id: c1
    text: >
      式 (12.14) 是两任务、单锚点形式；与式 (12.12) 的 Ω(θ,θ*_{1:k-1}) 及 12.4.4 的
      三任务实验不匹配，正文没有给出多任务累积形式。
    evidence: 1612.00796_ewc p.3（第三任务用两个惩罚相加）；content/ch12.md 第 203 行与第 302 行
    status: 已核对
  - id: c2
    text: >
      二次惩罚的成立条件是 Laplace/高斯后验近似与 Fisher 对角化（忽略参数相关性），
      因而只在 θ* 邻域内有效；正文只写了"F 只在一个点上估计"。
    evidence: 1612.00796_ewc p.3 原句；推导：对角 Fisher 丢弃非对角项
    status: 已核对
  - id: c3
    text: >
      正文的"弹簧"比喻与 EWC 原文一致（anchoring the parameters to the previous solution），
      不需要改。
    evidence: 1612.00796_ewc p.2
    status: 已核对
  - id: c4
    text: >
      12.4.4 的实验实现（三任务时是否逐任务累加惩罚、λ 是否全局共享）在正文中没有写出，
      无法从文字核实其与 (12.14) 的对应关系。
    evidence: 未找到实现说明；content/ch12.md 第 302 行只给超参
    status: 待核验

planned_fix:
  - 式 (12.14) 前加一句"下面先写两任务形式"，并在其后补多任务形式 L_k = L_k^data + (λ/2)Σ_{j<k}Σ_i F^{(j)}_i(θ_i−θ^{*(j)}_i)²，注明"逐任务相加等价于一个二次惩罚；工程上也常把 Fisher 累加成一个（在线 EWC）"。
  - 第 257 行"F 只在一个点上估计"扩成两句：Laplace/高斯后验近似 + Fisher 对角化（忽略参数相关性），并说明两者共同决定"只在 θ* 邻域有效"。
  - 12.4.4 第 302 行补一句实验实现："EWC 在三任务上按逐任务惩罚相加，λ 全局共享"，使实验与公式对得上。

