issue_id: CH12-CL-002
chapter: 12
severity: P1
status: 已有依据
title: EWC 只写了两任务单锚点形式 (12.14)，却用 K 任务的 Ω 表述并在三任务实验上使用
summary: >
  12.4.2 给出的式 (12.14) 是 L_k = L_k^data + (λ/2)Σ_i F_i(θ_i−θ*_i)²，锚点只有一组
  θ*，即两任务（A→B）版本；而 12.3.5 的式 (12.12) 把约束写成 Ω(θ,θ*_{1:k-1})（全部
  先前任务），12.4.4 的实验又确实在三任务序列上训练 EWC（λ=10）。正文没有说明多任务时
  惩罚如何累积（逐任务相加、还是把 Fisher 累加成在线 EWC），也没有交代二次惩罚成立
  所依赖的近似：EWC 原文是把后验近似成以 θ*_A 为均值、以 Fisher 对角为精度的高斯
  （Laplace 近似），二次惩罚是这一近似的产物，因而只在 θ*_A 邻域内有效、且忽略了参数
  相关性。正文只写了"F 只在一个点上估计"，方向对但没把这两条前提写全。

current_text:
  file: content/ch12.md
  lines: "198-207, 241-257, 300-308"
  excerpt: >
    第 246 行：L_k(θ)=L_k^data(θ)+(λ/2)Σ_i F_i(θ_i−θ*_i)²，其中 F_i 是 Fisher 信息
    对角元，衡量第 i 个参数对旧任务有多重要。
    第 207 行：其中 Ω 是约束项，θ*_{1:k-1} 是先前任务的解。

