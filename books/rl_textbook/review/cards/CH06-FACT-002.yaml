issue_id: CH06-FACT-002
chapter: 6
severity: P2
status: 已有依据
title: '"29 个达到人类水平"缺 75% 判据，且分母 46/49 与正文不一致'
summary: 第 50 行写"DQN 在 49 个游戏上训练后，也只有 29 个达到或超过人类水平"。S&B §16.5 的表述是：以"达到人类得分 75% 以上"算作人类水平，DQN 在 46 个游戏中的 29 个达到该界（引文）；同一段还给出另外两个数——真正超过人类得分的是 22 个，比分优于此前最好学习系统的是 43 个。本章既没给 75% 判据，也没解释 46 与 49 的差（3 个游戏的人类基准不可比），读者会把"达到或超过人类水平"读成"29
  个游戏打败人类"，这是把判据放宽后的另一个结论。另外，文献库里的 DQN 是 2013 年 arXiv 版（7 个游戏），49 个游戏的表只能经 S&B 转述，因此本条按 S&B 对齐，并把"Nature 原表"标为无法核实。
