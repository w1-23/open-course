issue_id: CH06-ALG-001
chapter: 6
severity: P1
status: 已有依据
title: 终止掩码在五个目标式与算法 6-1 中全部缺失，且全文未区分 terminated 与 truncated
summary: '第 32、88、216–218、239、287 行的目标式都是 \(r+\gamma\cdot(\cdot)\) 的直接形式：式 (6.2)、式 (6.4)、式 (6.12)、式 (6.14) 与式 (6.17) 里都没有终止掩码 \((1-d_t)\)，终止转移的标签仍带着 \(\gamma Q(s'',\cdot)\)。算法 6-1 第 6 行（第 157 行）同样缺这一项，而它是本章唯一给读者照抄的
  DQN 实现配方：照此实现在每个回合末尾都会把下一回合首状态的价值混进终止转移的标签，回合越长、价值量级越大，偏差越大。

  更麻烦的是 terminated 与 truncated 被合成一个 done：算法 6-2 第 1 行（第 261 行）与算法 6-3 第 1 行（第 322 行）只存 done，第 4 行与第 3 行用 \((1-\text{done})\)。按 _CONVENTIONS §1.2，因时间上限或采样预算造成的截断必须保留自举，否则价值被系统性低估；正文没有任何一段说明两者区别，读者无法知道自己实现的是哪一种。

  原文对终止的处理是显式的：Atari 上把"掉一条命"构造为终止状态并把折扣置 0（引文）。本章既没写这一惯例，也没写它的代价——它把连续的命制游戏切成人为的回合边界，改变了被优化的那个任务。'
