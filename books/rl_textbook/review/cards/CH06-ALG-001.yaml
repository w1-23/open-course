reproduction_result:
  note: 本条不需要数值实验：把式 (6.2) 与算法 6-1 第 6 行按终止/非终止两种转移各算一次即可看出差异；若要量化，可用 5×5 网格世界（每回合 20 步上限）比较"缺掩码 / 只掩终止 / 掩终止并保留截断自举"三种实现的价值偏差。
claims:
- id: c1
  text: 终止转移的目标应为 R_{t+1}，不含 γ·max Q(S',·)：等价于把终止处的折扣置 0。
  evidence: RLbook2020 p0096 原文 "the terminal state, if any, must be given value 0"；对照式 (6.2) 第 32 行
  status: 已核对
- id: c2
  text: 式 (6.2)(6.4)(6.12)(6.14)(6.17) 与算法 6-1 第 6 行都缺掩码，照抄实现会把跨回合价值写进终止标签。
  evidence: 式 (6.2) 第 32 行、算法 6-1 第 6 行第 157 行逐字核对
  status: 已核对
- id: c3
  text: 截断（时间上限、采样预算）不等于终止，必须保留自举；本章用单一 done 无法表达这个区别。
  evidence: _CONVENTIONS §1.2「终止与截断（强制）」；文献库内没有对应条目，属项目规范而非文献结论
  status: 替代证据
planned_fix:
- 第 32 行式 (6.2) 之后补一段定义掩码：d_t 为 1 表示终止、0 表示继续，目标写成 r+γ(1−d_t)max_a' Q(s',a')；式 (6.4)(6.12)(6.14)(6.17) 同步加上 (1−d_t)。
- 第 157 行算法 6-1 第 6 行改为 δ_j = R_j + γ(1 − terminated_j)·Q_φ-(S'_j, argmax) − Q_φ(S_j, A_j)，并在第 1 行把 done 拆成 terminated / truncated 两个字段。
- 算法 6-2 第 1 行与算法 6-3 第 1 行同样拆分两个字段，第 4 行与第 3 行的 (1−done) 改为 (1−terminated)；并在 6.4.3 补一句：时间上限造成的截断保留自举，否则价值被低估。
- 6.5.1 补一段 Atari 惯例：掉命即终止、终止折扣置 0；说明它把命制游戏切成人为回合，会改变被优化的任务。
