claims:
  - id: c1
    text: uᵀAu = ‖v‖²_μ − γ⟨v,P^πv⟩_μ 的展开正确，问题出在把 ⟨v,P^πv⟩_μ 换成 ‖v‖²_μ 的那一步。
    evidence: 推导 §1；reproduction 中三组 u 的数值表
    status: 已核对
  - id: c2
    text: 平稳性 μᵀP^π=μ 只保证 Σ_s μ(s)(P^πv)(s)=Σ_s μ(s)v(s)，不能推出 ⟨v,P^πv⟩_μ=‖v‖²_μ。
    evidence: 推导 §1（乘积型量 vs 质量守恒）；reproduction 中 μ 满支撑时等号仍不成立
    status: 已核对
  - id: c3
    text: 正确的下界由 Cauchy–Schwarz 与 ‖P^πv‖_μ≤‖v‖_μ 给出，结论"on-policy 时 A 正定"依然成立。
    evidence: 推导 §2；式 (4.17) 的结论方向不需要修改，只需要把等号换成不等号
    status: 已核对
  - id: c4
    text: 第 242 行"非平稳时等式不成立"暗示平稳时成立，但该等式在任何分布下都不成立（等号要求 P^πv=v）。
    evidence: 推导 §3；reproduction 的不可约链上 μ 是严格平稳分布，等号仍不成立
    status: 已核对
  - id: c5
    text: 第 497 行的关键公式第 4 条复述了同一个错误，需要同步改。
    evidence: content/ch04.md 第 496–499 行与式 (4.17) 对照
    status: 已核对

planned_fix:
  - 第 234–238 行的式 (4.17) 改为三行不等式链：uᵀAu=‖v‖²_μ−γ⟨v,P^πv⟩_μ ≥ ‖v‖²_μ−γ‖v‖_μ‖P^πv‖_μ ≥ (1−γ)‖v‖²_μ>0。
  - 第 240 行把"第二个等号用了 μᵀP^π=μ"改为"第二个不等号用了 Cauchy–Schwarz、第三个用了 μ 平稳时 ‖P^πv‖_μ≤‖v‖_μ"。
  - 第 242 行删去"非平稳时等式并不成立"的暗示，改为"实验里 μ 是归一化折扣访问分布、非扩张性只是近似成立；式 (4.17) 本身是不等式"。
  - 第 497 行"关键公式"第 4 条同步改为 uᵀAu ≥ (1−γ)‖Φu‖²_μ>0。

