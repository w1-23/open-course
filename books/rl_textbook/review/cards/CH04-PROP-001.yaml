issue_id: CH04-PROP-001
chapter: 4
severity: P1
status: 已有依据
title: 式 (4.17) 的第二个等号不成立：uᵀAu 只是 ≥ (1−γ)‖v‖²_μ，不是恒等
summary: >
  第 234–238 行的式 (4.17) 写成 uᵀAu = Σ_s μ(s)v(s)[v(s)−γ(P^πv)(s)] = (1−γ)‖v‖²_μ > 0，
  第 240 行解释第二个等号"用了 μᵀP^π=μ"。该等号不成立：平稳性只给出质量守恒
  Σ_s μ(s)(P^πv)(s) = Σ_s μ(s)v(s)，对乘积项 ⟨v,P^πv⟩_μ 没有任何约束。正确的推导是
  uᵀAu = ‖v‖²_μ − γ⟨v,P^πv⟩_μ ≥ ‖v‖²_μ − γ‖v‖_μ‖P^πv‖_μ ≥ (1−γ)‖v‖²_μ，
  两处不等式分别来自 Cauchy–Schwarz 与 P^π 在 μ-范数下的非扩张性。结论（on-policy 时 A 正定）
  仍然成立，但证明链断裂；第 497 行"关键公式"第 4 条又把同一式子当作恒等式复述了一遍。
  第 242 行"非平稳时等式不成立"的说法进一步暗示"平稳时成立"，把错误包装成了条件命题。

current_text:
  file: content/ch04.md
  lines: "232-242, 496-499"
  excerpt: >
    第 236 行：(1-\gamma)\|v\|_\mu^2>0（承接 235 行的 =\sum_s\mu(s)v(s)[v(s)-\gamma(P^\pi v)(s)]）
    第 240 行：第一个等号按 s 展开并合并两项，第二个等号用了 \mu^\top P^\pi=\mu（\mu 是 \pi 的平稳分布），右端严格为正
    第 497 行：u^\top Au=(1-\gamma)\|\Phi u\|_\mu^2>0

