issue_id: CH95-SEC-001
chapter: 95
severity: P2
status: 已有依据
title: 配分函数 Z(x) 在第 95.4 式里出现但本章从未定义，读第 10 章的反解与相消时会缺一环
summary: >
  第 95.4 式给出 π*(y|x)=(1/Z(x))·π_ref(y|x)·exp(r(x,y)/β_KL)，Z(x) 从头到尾没有定义；
  本章也没有一句话说明它只依赖 x、不依赖策略、对有限词表有限。第 10 章在 (10.6) 里把
  Z(x)=Σ_y π_ref(y|x)exp(r_φ(x,y)/β_KL) 明确写出，并解释它"只依赖 x、不依赖策略，且对任意 x
  有限、为正"，随后 (10.9) 反解奖励时那个 β_KL log Z(x) 正是从这里来，(10.10) 的相消也依赖
  "同一 prompt 的两个回答共享同一个 Z(x)"。本章是接口章，读者在 (95.4) 处停下却查不到 Z(x)，
  到第 10 章会误以为这是新引入的对象，而不是同一归一化项的换写法。

current_text:
  file: content/ch13prep.md
  lines: "81-87"
  excerpt: >
    第 82-83 行：π*(y|x) = (1/Z(x))·π_ref(y|x)·exp(r(x,y)/β_KL)；
    第 87 行：这里 β_KL 同时充当温度……（全段没有给出 Z(x) 的定义）

