claims:
  - id: c1
    text: >
      本章第 82-83 行使用 1/Z(x) 但未定义；第 10 章 (10.6) 在同一位置给出定义，
      因此这是接口章与后续章的缺口，而不是新的记号约定。
    evidence: 推导：content/ch10.md 第 98-111 行的 (10.6) 与 Z(x) 的有限性讨论；2305.18290_dpo p.15 说明其只依赖 x
    status: 已核对
  - id: c2
    text: >
      缺 Z(x) 会让第 10 章 (10.9) 反解式里多出的 β_KL log Z(x) 失去出处，
      也使 (10.10) 的"同一 prompt 相消"看起来像近似而不是恒等。
    evidence: 推导：content/ch10.md 第 174-191 行（反解与相消）；2305.18290_dpo p.6 的归一化算子
    status: 已核对
  - id: c3
    text: >
      (95.4) 本身没有写错；缺的是紧随其后的一行定义与"只依赖 x、有限为正"的半句。
    evidence: 推导：对照 content/ch10.md 第 98-111 行可见 (95.4) 与 (10.6) 的正文只是省略了定义
    status: 已核对

planned_fix:
