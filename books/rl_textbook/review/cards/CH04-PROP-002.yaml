issue_id: CH04-PROP-002
chapter: 4
severity: P2
status: 已有依据
title: GTD 的收敛被写成"覆盖假设下离策略也收敛"，漏掉双时间尺度与步长条件
summary: >
  第 299 行给 GTD/TDC 的定位是"收益是在覆盖假设下**离策略也收敛**"。覆盖假设只是必要条件
  （第 4.2.3 节自己已经写明"覆盖保证可辨识性，不保证稳定性"），而 GTD 类方法的收敛证明
  还需要两个学习率满足双时间尺度条件：次级的 β 相对初级 α 更快趋于零，即极限下 β→0 且 α/β→0
  （S&B p.281 明确写"这些收敛证明通常显式假设这一点"，并称之为 two-time-scale proofs）。
  正文把它压缩成"覆盖假设 ⇒ 收敛"，读者会误以为覆盖本身就是收敛条件。

current_text:
  file: content/ch04.md
  lines: "292-299"
  excerpt: >
    第 299 行：配上第二个参数向量做双时间尺度更新，就得到 GTD(0) 与 TDC。代价是每个样本要多一次内积、多一个步长参数，收益是在覆盖假设下**离策略也收敛**。

sources:
  - key: RLbook2020
    level: S
    role: GTD2/TDC 的收敛证明要求双时间尺度（β→0 且 α/β→0），不是仅凭覆盖假设
    pdf_page: 303
    printed_page: "§11.8 Emphatic-TD Methods（纸面 p.281）"
    quote: >
      GTD2 and TDC both involve two learning processes, a primary one for w and a secondary
      one for v. ... The convergence proofs for these methods often make this assumption
      explicitly. These are called two-time-scale proofs.

