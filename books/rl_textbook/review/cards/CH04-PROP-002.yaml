planned_fix:
  - 第 299 行改为"在覆盖假设、Φ 满列秩与双时间尺度步长（β→0 且 α/β→0）下，GTD(0)/TDC 可以证明离策略收敛"，并注明这是[渐近]结论。
  - 在同一段补一句与第 4.2.3 节呼应的提醒："覆盖假设是必要条件，不是收敛条件；GTD 把'真梯度'引进来的代价正是这组步长条件。"
  - 第 4.3.5 节末段的"GTD 不是更好的 TD"保留，但补上半句"它的收敛以双时间尺度为代价"。

