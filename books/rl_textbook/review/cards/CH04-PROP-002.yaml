    evidence: 推导 §2 把 S&B p.281 的条件与第 299 行的断言逐项对照
    status: 已核对
  - id: c4
    text: 同段还漏了线性的满列秩与遍历性前提（MSPBE 的二次型需要 C 可逆）。
    evidence: 推导 §2；与式 (4.21) 处"C^{-1} 要求 Φ 满列秩"的说明一致
