title: 式 (6.18) 里 φ 同时参数化策略与 critic，与算法 6-3 及全书 θ=actor／φ=critic 的约定冲突
summary: |-
  第 295 行的策略损失写成 \(J_\pi(\phi)=\mathbb{E}[\alpha_{\mathrm{ent}}\log\pi_\phi(a\mid s)-Q_\phi(s,a)]\)：同一个 φ 既定义策略 \(\pi_\phi\)，又定义 critic \(Q_\phi\)。第 320–327 行的算法 6-3 又改用 \(Q_{\theta_i}\) 表示 critic、\(\pi_\phi\) 表示策略，与式 (6.18) 自相矛盾；第 299 行再引入第三个符号 ψ 表示目标价值网络。
  SAC 原文的对应关系是 \(V_\psi\)、\(Q_\theta\)、\(\pi_\phi\)，策略损失里的 critic 明确写作 \(Q_\theta\)（引文）。而 _CONVENTIONS §2 规定 θ=actor/policy、φ=critic，与本章 6.1–6.3.3 一直使用的 \(Q_\phi\) 正好相反。结果是同一章里 φ 至少有四个所指：critic 参数、策略参数、目标价值网络之外的策略参数、以及6.2.4 里与 α/β 并列的局部记号。读者无法从符号判断哪一组参数在被更新，抄写式 (6.18) 时把 critic 也当成策略网络的输出是必然的。
